<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Rounded-square background with slight gradient (stone -> ice) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#1a3d6c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#sky)"/>

  <!-- Subtle ice motes -->
  <g fill="#e8faff" fill-opacity="0.55">
    <rect x="60"  y="70"  width="6" height="6"/>
    <rect x="150" y="40"  width="4" height="4"/>
    <rect x="420" y="90"  width="5" height="5"/>
    <rect x="370" y="150" width="3" height="3"/>
    <rect x="80"  y="180" width="4" height="4"/>
    <rect x="470" y="220" width="4" height="4"/>
    <rect x="110" y="300" width="3" height="3"/>
    <rect x="300" y="60"  width="4" height="4"/>
  </g>

  <!-- Ice blue floors forming the tower silhouette -->
  <g>
    <rect x="60"  y="420" width="392" height="26" fill="#4aa8e0"/>
    <rect x="60"  y="420" width="392" height="8"  fill="#9cd9ff"/>
    <rect x="120" y="360" width="272" height="20" fill="#4aa8e0"/>
    <rect x="120" y="360" width="272" height="6"  fill="#9cd9ff"/>
    <rect x="170" y="300" width="172" height="18" fill="#4aa8e0"/>
    <rect x="170" y="300" width="172" height="5"  fill="#9cd9ff"/>
  </g>

  <!-- Arctic climber, centered, mid-jump -->
  <g>
    <!-- legs (tucked) -->
    <rect x="224" y="230" width="18" height="34" fill="#2b2b30"/>
    <rect x="270" y="230" width="18" height="34" fill="#2b2b30"/>
    <rect x="220" y="258" width="26" height="10" fill="#111318"/>
    <rect x="266" y="258" width="26" height="10" fill="#111318"/>

    <!-- parka body -->
    <rect x="216" y="170" width="80" height="66" fill="#2e84d6"/>
    <rect x="216" y="226" width="80" height="10" fill="#ffffff"/>

    <!-- arms up -->
    <rect x="196" y="150" width="18" height="60" fill="#2067b0"/>
    <rect x="298" y="150" width="18" height="60" fill="#2067b0"/>

    <!-- head -->
    <rect x="220" y="118" width="72" height="60" fill="#f2d1a8"/>
    <!-- goggles -->
    <rect x="220" y="134" width="72" height="12" fill="#1a1a1a"/>
    <rect x="264" y="136" width="18" height="8"  fill="#ff9a3d"/>
    <!-- beanie -->
    <rect x="220" y="106" width="72" height="18" fill="#d03030"/>
    <rect x="220" y="96"  width="14" height="12" fill="#ffffff"/>
    <rect x="220" y="120" width="72" height="6"  fill="#ffffff"/>

    <!-- yellow scarf flutter -->
    <rect x="200" y="192" width="14" height="12" fill="#ffdc4a"/>
    <rect x="188" y="200" width="12" height="10" fill="#ffdc4a"/>
  </g>
</svg>

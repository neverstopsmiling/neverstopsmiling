<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Frostspire</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05080f;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #fff;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    canvas { display: block; }
    #tilt-enable {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(20, 90, 180, 0.92);
      color: #fff;
      border: 2px solid #9cd9ff;
      border-radius: 10px;
      font: 700 12px/1 "Courier New", monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: none;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      /* Don't intercept taps outside of the button itself */
      touch-action: manipulation;
    }
    #boot-msg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9cd9ff;
      font: 700 18px/1.5 "Courier New", monospace;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="tilt-enable" type="button">Enable Tilt Controls</button>
  <div id="boot-msg">LOADING FROSTSPIRE</div>

  <script>
    // Register the service worker. When a new version is available, pop a
    // small banner inviting the user to reload so they pick it up.
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          const showUpdate = (worker) => {
            const banner = document.createElement("div");
            banner.id = "sw-update-banner";
            banner.textContent = "NEW VERSION - TAP TO RELOAD";
            banner.style.cssText =
              "position:fixed;left:50%;top:18px;transform:translateX(-50%);" +
              "background:#ff7020;color:#fff;padding:10px 16px;border-radius:10px;" +
              "font:700 12px/1 'Courier New',monospace;letter-spacing:1px;" +
              "z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;" +
              "border:2px solid #fff;";
            banner.addEventListener("click", () => {
              try { worker.postMessage({ type: "SKIP_WAITING" }); } catch (_) {}
              location.reload();
            });
            document.body.appendChild(banner);
          };
          if (reg.waiting) showUpdate(reg.waiting);
          reg.addEventListener("updatefound", () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", () => {
              if (nw.state === "installed" && navigator.serviceWorker.controller) {
                showUpdate(nw);
              }
            });
          });
          // A controllerchange fires when the new SW takes over.
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            // Only auto-reload if the user tapped the banner (skipWaiting).
          });
        }).catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script>
  "use strict";

  /* =========================================================================
   * FROSTSPIRE - an Icy Tower-inspired vertical climber
   * Single-file browser game built with Phaser 3.
   * ========================================================================= */

  // ------------------------------------------------------------------
  // CFG - all gameplay tuning in one place
  // ------------------------------------------------------------------
  const CFG = {
    // Horizontal motion
    MAX_H_SPEED: 400,           // px/s at full sprint
    GROUND_ACCEL: 1000,         // 400 / 0.4s ramp to max
    GROUND_FRICTION: 1333,      // 400 / 0.3s slide to stop
    AIR_ACCEL: 600,             // 60% of ground accel

    // Vertical / jump
    GRAVITY: 800,               // px/s^2 (matches spec 0.8 scaled)
    BASE_JUMP: 300,             // jump Vy at standstill -> ~1 floor
    BONUS_JUMP: 350,            // added at full sprint -> ~5 floors

    // Floors
    FLOOR_HEIGHT: 50,           // vertical spacing between floors
    FLOOR_THICKNESS: 10,        // visual thickness
    FLOOR_MIN_WIDTH_PX: 60,
    FLOOR_WIDTH_JITTER: 0.15,   // +/- 15%

    // Walls
    WALL_THICKNESS: 36,
    WALL_BOUNCE_WINDOW_MS: 100, // time to press opposite dir for full preserve

    // Character
    CHAR_W: 22,
    CHAR_H: 32,

    // Combo
    COMBO_MIN_FLOORS: 2,
    COMBO_TIMEOUT_MS: 3000,

    // Scroll escalation
    SCROLL_START_FLOOR: 5,
    SCROLL_INITIAL_SPEED: 30,
    SCROLL_INCREMENT: 20,
    SCROLL_INCREMENT_MS: 30000,

    // Scoring
    POINTS_PER_FLOOR: 10,

    // Ghost recorder
    GHOST_SAMPLE_MS: 100,

    // Milestones
    MILESTONES: [100, 250, 500, 1000],
  };

  // Level progression. floor = the lowest floor number that belongs to this
  // level. Each level also drives the scroll-speed baseline, floor-width
  // factor (applied to the 70% base), and visual theme.
  const LEVELS = [
    { floor:    1, themeKey: "snow",   scrollSpeed:  30, widthFactor: 1.00, name: "SNOWFIELD"      },
    { floor:   20, themeKey: "cave",   scrollSpeed:  50, widthFactor: 0.92, name: "FROZEN CAVE"    },
    { floor:   50, themeKey: "stone",  scrollSpeed:  75, widthFactor: 0.82, name: "STONE KEEP"     },
    { floor:  100, themeKey: "iron",   scrollSpeed: 105, widthFactor: 0.70, name: "IRON FORTRESS"  },
    { floor:  200, themeKey: "lava",   scrollSpeed: 140, widthFactor: 0.55, name: "LAVA CAVERN"    },
    { floor:  400, themeKey: "forest", scrollSpeed: 180, widthFactor: 0.42, name: "ENCHANTED WOOD" },
    { floor:  800, themeKey: "storm",  scrollSpeed: 220, widthFactor: 0.34, name: "STORM CLOUDS"   },
    { floor: 1500, themeKey: "space",  scrollSpeed: 260, widthFactor: 0.28, name: "DEEP SPACE"     },
  ];

  // Per-theme palette + decorative accent hook (method name on GameScene).
  const THEMES = {
    snow: {
      top: 0x9cd9ff, side: 0x4aa8e0, wall: 0x2a5c8c,
      bg1: 0x0b1d3a, bg2: 0x1a3d6c,
      accent: 0xe8faff, glint: 0xd3f0ff,
      name: "SNOWFIELD", accentFn: "accentSnow",
    },
    cave: {
      top: 0x7ad0e0, side: 0x2a7380, wall: 0x0e3a42,
      bg1: 0x041822, bg2: 0x0e3440,
      accent: 0xb8f0ff, glint: 0x5aa8c0,
      name: "FROZEN CAVE", accentFn: "accentCave",
    },
    stone: {
      top: 0xc9c9c9, side: 0x6a6a6a, wall: 0x2e2e34,
      bg1: 0x14141a, bg2: 0x2a2a32,
      accent: 0xffd480, glint: 0xa8a8a8,
      name: "STONE KEEP", accentFn: "accentStone",
    },
    iron: {
      top: 0x8a7868, side: 0x3e3428, wall: 0x1a1008,
      bg1: 0x0a0805, bg2: 0x1c1510,
      accent: 0xffa040, glint: 0x706050,
      name: "IRON FORTRESS", accentFn: "accentIron",
    },
    lava: {
      top: 0xffb27a, side: 0xcc3a0a, wall: 0x5a1400,
      bg1: 0x200500, bg2: 0x501200,
      accent: 0xffd27a, glint: 0xff7a30,
      name: "LAVA CAVERN", accentFn: "accentLava",
    },
    forest: {
      top: 0xb8f0a8, side: 0x2a7a38, wall: 0x14401e,
      bg1: 0x061505, bg2: 0x0f2e18,
      accent: 0xfff0a8, glint: 0x6acb7a,
      name: "ENCHANTED WOOD", accentFn: "accentForest",
    },
    storm: {
      top: 0xc0a8ff, side: 0x6a4aa0, wall: 0x2e1858,
      bg1: 0x0a0020, bg2: 0x180a44,
      accent: 0xfff4a0, glint: 0x9070ff,
      name: "STORM CLOUDS", accentFn: "accentStorm",
    },
    space: {
      top: 0xd8c0ff, side: 0x5e3fa0, wall: 0x261048,
      bg1: 0x010014, bg2: 0x0c0830,
      accent: 0xfff0ff, glint: 0xa47fff,
      name: "DEEP SPACE", accentFn: "accentSpace",
    },
  };

  // Character roster - each has its own procedural drawer (method name
  // on GameScene). All take the same options object and draw in local
  // body-centered coordinates so rotation / facing transforms behave.
  const CHARACTERS = [
    { id: "climber", name: "ARCTIC CLIMBER", color: 0x2e84d6, drawFn: "drawCharClimber" },
    { id: "penguin", name: "PENGUIN",        color: 0x1a1a1a, drawFn: "drawCharPenguin" },
    { id: "dragon",  name: "DRAGON",         color: 0x3ac050, drawFn: "drawCharDragon"  },
    { id: "trex",    name: "T-REX",          color: 0xe07020, drawFn: "drawCharTrex"    },
    { id: "yeti",    name: "YETI",           color: 0xe4eef4, drawFn: "drawCharYeti"    },
    { id: "robot",   name: "ROBOT",          color: 0xb0b4bc, drawFn: "drawCharRobot"   },
  ];

  function levelIndexFor(n) {
    let idx = 0;
    for (let i = 0; i < LEVELS.length; i++) {
      if (n >= LEVELS[i].floor) idx = i;
      else break;
    }
    return idx;
  }
  function levelFor(n) { return LEVELS[levelIndexFor(n)]; }

  const LS_KEYS = {
    bestScore:    "frostspire.bestScore",
    bestFloor:    "frostspire.bestFloor",
    longestCombo: "frostspire.longestCombo",
    ghost:        "frostspire.ghost",
    tiltGranted:  "frostspire.tiltGranted",   // "1" after user granted motion permission
    tiltInvert:   "frostspire.tiltInvert",    // "1" = invert X sign
    bestFlips:    "frostspire.bestFlips",
    character:    "frostspire.character",
  };

  function lsGetInt(key, fallback) {
    try {
      const v = parseInt(localStorage.getItem(key), 10);
      return Number.isFinite(v) ? v : fallback;
    } catch (_) { return fallback; }
  }
  function lsGetJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val)); }
    catch (_) {}
  }

  // Combo tier color (0xRRGGBB). Used by HUD glow + multiplier text.
  function tierColorFor(n) {
    if (n >= 100) return 0xff5cf0;       // GODLIKE pink
    if (n >= 50)  return 0xff3cdc;       // EXTREME magenta
    if (n >= 30)  return 0xa93cff;       // FANTASTIC purple
    if (n >= 20)  return 0xff2e2e;       // EXCELLENT red
    if (n >= 10)  return 0xff8a2a;       // SWEET orange
    if (n >= 5)   return 0xffdf3c;       // GOOD yellow
    return 0xffcc00;                     // opening color
  }
  function tierColorCssFor(n) {
    const v = tierColorFor(n).toString(16).padStart(6, "0");
    return "#" + v;
  }

  // Linearly blend two 0xRRGGBB colors at t in [0..1]
  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    const r = Math.round(ar + (br - ar) * t) & 0xff;
    const g = Math.round(ag + (bg - ag) * t) & 0xff;
    const bl= Math.round(ab + (bb - ab) * t) & 0xff;
    return (r << 16) | (g << 8) | bl;
  }

  // ------------------------------------------------------------------
  // AudioMgr - procedural Web Audio (no assets)
  // ------------------------------------------------------------------
  class AudioMgr {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.enabled = true;
      this.muted = false;
    }
    init() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) { this.enabled = false; return; }
        this.ctx = new Ctor();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.55;
        this.master.connect(this.ctx.destination);
        if (this.ctx.state === "suspended") this.ctx.resume();
      } catch (_) {
        this.enabled = false;
      }
    }
    toggleMute() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
      return this.muted;
    }
    // One-shot primitive: oscillator with envelope and optional freq sweep.
    _blip(opts) {
      if (!this.enabled || !this.ctx || this.muted) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (opts.delay || 0);
      const dur = opts.dur || 0.08;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = opts.type || "sine";
      osc.frequency.setValueAtTime(opts.f0, now);
      if (opts.f1 != null) {
        if (opts.linear) osc.frequency.linearRampToValueAtTime(opts.f1, now + dur);
        else osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.f1), now + dur);
      }
      // ADSR-ish envelope
      const peak = opts.vol != null ? opts.vol : 0.22;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + Math.min(0.01, dur * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain).connect(this.master);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }
    _noise(dur, vol, bp) {
      if (!this.enabled || !this.ctx || this.muted) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const length = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, length, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / length);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = vol;
      if (bp) {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = bp;
        f.Q.value = 6;
        src.connect(f).connect(g).connect(this.master);
      } else {
        src.connect(g).connect(this.master);
      }
      src.start(now);
      src.stop(now + dur + 0.02);
    }

    jump(speedFrac) {
      // Upward sweep; higher top pitch when jumping at full sprint.
      const end = 320 + speedFrac * 300;
      this._blip({ type: "square",   f0: 140, f1: end, dur: 0.08, vol: 0.22 });
      this._blip({ type: "triangle", f0: 280, f1: end * 1.5, dur: 0.08, vol: 0.08 });
    }
    land(impact) {
      // Low thud: fast sine thump + a bit of shaped noise.
      this._blip({ type: "sine", f0: 160, f1: 60, dur: 0.06, vol: 0.20 + impact * 0.1 });
      this._noise(0.05, 0.08 + impact * 0.05, 220);
    }
    wallBounce() {
      this._blip({ type: "triangle", f0: 1400, f1: 2600, dur: 0.05, vol: 0.20, linear: true });
      this._blip({ type: "square",   f0: 900,  f1: 1700, dur: 0.04, vol: 0.10, linear: true, delay: 0.005 });
    }
    comboReward(tierIdx) {
      // Ascending 3-note chime; key lifts with tier.
      const base = 523.25 + tierIdx * 40;
      const notes = [base, base * 1.2599, base * 1.4983];
      notes.forEach((f, i) => {
        this._blip({ type: "triangle", f0: f, dur: 0.18, vol: 0.18, delay: i * 0.09 });
      });
    }
    hurryUp(strong) {
      const f = strong ? 980 : 760;
      this._blip({ type: "square", f0: f, f1: f * 0.7, dur: 0.1, vol: 0.22, linear: true });
      this._blip({ type: "square", f0: f, f1: f * 0.7, dur: 0.1, vol: 0.22, linear: true, delay: 0.14 });
      if (strong) this._noise(0.12, 0.04, 2200);
    }
    gameOver() {
      const notes = [523, 440, 349, 262, 196];
      notes.forEach((f, i) => {
        this._blip({ type: "triangle", f0: f, dur: 0.22, vol: 0.20, delay: i * 0.18 });
      });
    }
    milestone() {
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => {
        this._blip({ type: "triangle", f0: f, dur: 0.22, vol: 0.20, delay: i * 0.1 });
      });
    }
  }

  // ------------------------------------------------------------------
  // GameScene - will grow in subsequent phases
  // ------------------------------------------------------------------
  class GameScene extends Phaser.Scene {
    constructor() { super("game"); }

    create() {
      this.W = this.scale.gameSize.width;
      this.H = this.scale.gameSize.height;

      this.audio = new AudioMgr();
      // Browsers require a user gesture; warm the context on first input.
      const armAudio = () => this.audio.init();
      this.input.once("pointerdown", armAudio);
      this.input.keyboard.on("keydown", armAudio);
      // M key toggles mute
      this.input.keyboard.on("keydown-M", () => this.audio.toggleMute());
      // C key opens character select (also cancels current if open)
      this.input.keyboard.on("keydown-C", () => this.openCharacterSelect());

      // Persistent bests (loaded once at boot, updated during play)
      this.best = {
        score:        lsGetInt(LS_KEYS.bestScore, 0),
        floor:        lsGetInt(LS_KEYS.bestFloor, 0),
        longestCombo: lsGetInt(LS_KEYS.longestCombo, 0),
        ghost:        lsGetJSON(LS_KEYS.ghost, null),
      };

      // Layer setup (deeper = foreground). Game-world layers scroll with camera.
      this.bgGfx       = this.add.graphics().setDepth(-10);
      this.wallsGfx    = this.add.graphics().setDepth(-5);
      this.floorsGfx   = this.add.graphics().setDepth(0);
      this.particlesGfx= this.add.graphics().setDepth(5);
      this.ghostGfx    = this.add.graphics().setDepth(8).setAlpha(0.35);
      this.playerGfx   = this.add.graphics().setDepth(10);

      // UI layer (stays put on screen)
      this.uiLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1000);
      this.fxLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1500);

      this.cameras.main.setBackgroundColor("#05080f");

      this.drawBackground();

      this.setupInput();
      this.resetRun();

      // Start on title screen instead of playing immediately.
      this.state = "title";
      this.showTitleScreen();

      // P / Esc to pause during play
      this.input.keyboard.on("keydown-P", () => this.togglePause());
      this.input.keyboard.on("keydown-ESC", () => this.togglePause());

      this.scale.on("resize", this.onResize, this);

      // Hide boot overlay now that Phaser is alive.
      const boot = document.getElementById("boot-msg");
      if (boot) boot.style.display = "none";
    }

    onResize(gameSize) {
      this.W = gameSize.width;
      this.H = gameSize.height;
      this.drawBackground();
      // Don't rebuild floors on resize; widths were set at spawn time.
      // Floor-0 (ground) is redrawn to cover full screen width.
      if (this.floors && this.floors[0]) {
        this.floors[0].x = 0;
        this.floors[0].w = this.W;
      }
      // Rebuild HUD so it re-anchors to the new viewport.
      if (this.hud) this.buildHUD();
    }

    // Themed vertical-gradient backdrop + parallax stars/snow.
    drawBackground() {
      const g = this.bgGfx;
      g.clear();
      const theme = this.currentTheme ? this.currentTheme() : this.floorTheme(0);

      // Chunky vertical gradient between bg1 and bg2.
      const steps = 12;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const c = lerpColor(theme.bg1, theme.bg2, t);
        g.fillStyle(c, 1);
        g.fillRect(0, (this.H * i) / steps, this.W, this.H / steps + 1);
      }

      // Per-theme decorative accent layer (snow, icicles, torches, etc.)
      const fn = theme.accentFn && this[theme.accentFn];
      if (fn) fn.call(this, g, theme);
    }

    // -------------- Per-theme accent renderers --------------
    // They all draw in screen-space onto this.bgGfx after the gradient.
    // Most use a deterministic pseudo-random function of (screen x, scroll)
    // so they drift naturally as the camera moves.

    _rng(seed) {
      // Tiny deterministic PRNG [0..1)
      let s = seed >>> 0;
      return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
    }

    accentSnow(g, theme) {
      // Falling snowflakes drifting downward, parallax tied to camera.
      const t = this.time.now * 0.001;
      const cam = this.cameraY || 0;
      const rand = this._rng(42);
      for (let i = 0; i < 55; i++) {
        const baseX = rand() * this.W;
        const baseY = rand() * this.H;
        const spd   = 10 + rand() * 20;
        const drift = Math.sin((t + i) * 0.7) * 8;
        const y = (baseY + t * spd + cam * 0.12) % this.H;
        const x = (baseX + drift + this.W) % this.W;
        const sz = 1 + (i % 3);
        g.fillStyle(theme.accent, 0.55);
        g.fillRect(x, y, sz, sz);
      }
    }

    accentCave(g, theme) {
      // Hanging icicles along the top + drifting mist.
      g.fillStyle(theme.top, 0.55);
      const cols = Math.ceil(this.W / 24);
      for (let c = 0; c < cols; c++) {
        const h = 8 + ((c * 1103515245 + 12345) >>> 4) % 18;
        const x = c * 24 + 6;
        g.fillRect(x, 0, 4, h);
        g.fillRect(x + 1, h, 2, 3);
      }
      // Mist swirls
      const t = this.time.now * 0.0005;
      g.fillStyle(theme.accent, 0.12);
      for (let i = 0; i < 12; i++) {
        const x = ((t * 40 + i * 91) % (this.W + 120)) - 60;
        const y = 40 + ((i * 37) % (this.H - 120));
        g.fillRect(x, y, 80, 6);
      }
    }

    accentStone(g, theme) {
      // Wall torches: bright flickering flames at fixed column positions.
      const cam = this.cameraY || 0;
      const flameColors = [0xffcc40, 0xff7a20, 0xff4010];
      const positions = [
        { x: 16, side: -1 },
        { x: this.W - 16, side: 1 },
      ];
      // Torches repeat every 160 world pixels, anchored to camera so they scroll.
      const rowH = 160;
      const startRow = Math.floor(cam / rowH) * rowH;
      for (let y = startRow; y < cam + this.H + rowH; y += rowH) {
        const screenY = y - cam;
        if (screenY < -20 || screenY > this.H + 20) continue;
        for (const pos of positions) {
          // Bracket
          g.fillStyle(0x5a3010, 1);
          g.fillRect(pos.x - 3, screenY, 6, 4);
          // Flame
          const flick = Math.floor(this.time.now / 90 + y) % 3;
          g.fillStyle(flameColors[flick], 0.95);
          g.fillRect(pos.x - 3, screenY - 8, 6, 6);
          g.fillStyle(0xffeeaa, 0.8);
          g.fillRect(pos.x - 1, screenY - 10, 2, 3);
        }
      }
    }

    accentIron(g, theme) {
      // Rivets on the walls + occasional sparks in the middle.
      const cam = this.cameraY || 0;
      g.fillStyle(0x2a1a0a, 1);
      const rowH = 50;
      const startRow = Math.floor(cam / rowH) * rowH;
      for (let y = startRow; y < cam + this.H; y += rowH) {
        const sy = y - cam;
        g.fillRect(8, sy, 3, 3);
        g.fillRect(this.W - 11, sy, 3, 3);
      }
      // Sparks
      const t = this.time.now;
      g.fillStyle(theme.accent, 0.9);
      for (let i = 0; i < 6; i++) {
        const phase = ((t + i * 137) % 1500) / 1500;
        if (phase > 0.2) continue;
        const x = 20 + (i * 131) % (this.W - 40);
        const y = 60 + (i * 247) % (this.H - 120);
        const life = 1 - phase / 0.2;
        const sz = 1 + Math.floor(life * 2);
        g.fillRect(x, y, sz, sz);
      }
    }

    accentLava(g, theme) {
      // Rising embers + hot glow at bottom.
      g.fillStyle(0xff4010, 0.18);
      g.fillRect(0, this.H - 30, this.W, 30);
      g.fillStyle(0xff7a20, 0.12);
      g.fillRect(0, this.H - 12, this.W, 12);
      const t = this.time.now * 0.001;
      const rand = this._rng(1337);
      for (let i = 0; i < 40; i++) {
        const x0 = rand() * this.W;
        const off = rand() * this.H;
        const rise = (off + t * (30 + rand() * 40)) % this.H;
        const y = this.H - rise;
        const x = x0 + Math.sin(t * 2 + i) * 10;
        g.fillStyle(i % 3 === 0 ? 0xfff080 : 0xff8a2a, 0.7);
        g.fillRect(x, y, 2, 2);
      }
    }

    accentForest(g, theme) {
      // Drifting leaves + vines on walls.
      const t = this.time.now * 0.0006;
      const cam = this.cameraY || 0;
      // Vines
      g.fillStyle(0x1e4020, 0.7);
      const rowH = 40;
      const start = Math.floor(cam / rowH) * rowH;
      for (let y = start; y < cam + this.H; y += rowH) {
        const sy = y - cam;
        const kink = Math.sin((y + t * 100) * 0.07) * 4;
        g.fillRect(2 + kink, sy, 3, rowH);
        g.fillRect(this.W - 5 - kink, sy, 3, rowH);
      }
      // Leaves
      for (let i = 0; i < 24; i++) {
        const x = ((i * 47 + t * 90) % (this.W + 40)) - 20;
        const y = ((i * 93 + t * 70) % (this.H + 20)) - 10;
        const col = i % 3 === 0 ? theme.accent : theme.top;
        g.fillStyle(col, 0.75);
        g.fillRect(x, y, 4, 2);
        g.fillRect(x + 1, y + 2, 2, 2);
      }
    }

    accentStorm(g, theme) {
      // Drifting purple clouds + occasional lightning flash.
      const t = this.time.now * 0.0005;
      const rand = this._rng(9999);
      g.fillStyle(0x9068d8, 0.18);
      for (let i = 0; i < 10; i++) {
        const x = ((rand() * this.W + t * 30 + i * 150) % (this.W + 200)) - 100;
        const y = rand() * this.H;
        g.fillRect(x, y, 120, 10);
        g.fillRect(x + 10, y - 4, 100, 4);
        g.fillRect(x + 20, y + 10, 80, 4);
      }
      // Lightning: bright short flash every few seconds
      const flashPhase = (this.time.now % 4000) / 4000;
      if (flashPhase < 0.04) {
        g.fillStyle(0xffffff, (0.04 - flashPhase) * 15);
        g.fillRect(0, 0, this.W, this.H);
      }
    }

    accentSpace(g, theme) {
      // Parallax starfield in three depths.
      const cam = this.cameraY || 0;
      const starsFor = (seedBase, count, par, col, a) => {
        const rng = this._rng(seedBase);
        g.fillStyle(col, a);
        for (let i = 0; i < count; i++) {
          const bx = rng() * this.W;
          const by = rng() * (this.H * 2);
          const y = ((by + cam * par) % (this.H + 40)) - 20;
          g.fillRect(bx, y, 1 + (i % 2), 1 + (i % 2));
        }
      };
      starsFor(101, 50, 0.1, 0x9070ff, 0.55);
      starsFor(202, 35, 0.2, 0xffffff, 0.70);
      starsFor(303, 18, 0.4, theme.accent, 0.95);
      // Distant nebula smear
      g.fillStyle(0x5020a0, 0.20);
      g.fillRect(0, this.H * 0.35, this.W, 60);
      g.fillStyle(0x7040c0, 0.15);
      g.fillRect(0, this.H * 0.55, this.W, 40);
    }

    // ---------------------------------------------------------------
    // Input (keyboard for Phase 2; tilt/touch wired in Phase 8)
    // ---------------------------------------------------------------
    setupInput() {
      this.keys = this.input.keyboard.addKeys({
        left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        up:    Phaser.Input.Keyboard.KeyCodes.UP,
        a:     Phaser.Input.Keyboard.KeyCodes.A,
        d:     Phaser.Input.Keyboard.KeyCodes.D,
        w:     Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      // Prevent arrow / space from scrolling the page.
      this.input.keyboard.addCapture("LEFT,RIGHT,UP,DOWN,SPACE");

      // Axis buffer gets populated from keyboard / tilt / touch.
      this.axisX = 0;
      this.jumpPressed = false;

      // Jump buffering + coyote time (the "quick tap" feel of Icy Tower).
      this.jumpBufferUntil = 0;      // time.now deadline after which a buffered jump expires
      this.lastGroundTime  = 0;      // time.now when player was last grounded

      // ---- Tilt (DeviceOrientation) with orientation correction ----
      this.tilt = {
        enabled: false,
        x: 0,                        // screen-relative axis already in [-1..1]
        invert: lsGetInt(LS_KEYS.tiltInvert, 0) === 1,
      };
      this.tiltBtn = document.getElementById("tilt-enable");
      this.touchLeft = false;
      this.touchRight = false;

      const needsPermission =
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function";

      // Convert beta/gamma into a screen-relative left/right axis,
      // applying the current screen orientation so tilt stays consistent
      // when the device is rotated.
      const getScreenAngle = () => {
        try {
          if (screen.orientation && typeof screen.orientation.angle === "number") {
            return screen.orientation.angle;
          }
        } catch (_) {}
        if (typeof window.orientation === "number") return window.orientation;
        return 0;
      };

      const installHandler = () => {
        if (this.tilt._installed) return;
        this.tilt._installed = true;
        window.addEventListener("deviceorientation", (ev) => {
          if (ev.gamma == null || ev.beta == null) return;
          const g = ev.gamma, b = ev.beta;
          const angle = getScreenAngle();
          // In each screen orientation, a different sensor axis maps to
          // "tilt the screen left/right". Signs chosen so physically
          // tilting the phone to the player's right always moves right.
          let x;
          switch (angle) {
            case 90:   x =  b; break;    // landscape right
            case -90:
            case 270:  x = -b; break;    // landscape left
            case 180:  x = -g; break;    // upside-down portrait
            default:   x =  g; break;    // normal portrait (0)
          }
          if (this.tilt.invert) x = -x;
          // Deadzone + normalise over +/- 25 degrees.
          const mag = Math.max(0, Math.abs(x) - 3);
          const sign = x >= 0 ? 1 : -1;
          this.tilt.x = Phaser.Math.Clamp(sign * (mag / 22), -1, 1);
          this.tilt.enabled = true;
          // If the tilt-enable button is still visible for any reason,
          // hide it now that events are flowing.
          if (this.tiltBtn && this.tiltBtn.style.display !== "none") {
            this.tiltBtn.style.display = "none";
          }
        }, true);
      };

      // Try a silent install path first. If permission was already granted
      // in a previous session we can re-grant without ever showing a prompt
      // or the DOM button; the call still needs a user gesture though, so
      // attach it to the first pointerdown/keydown.
      const alreadyGranted = lsGetInt(LS_KEYS.tiltGranted, 0) === 1;

      const silentArm = async () => {
        if (!needsPermission) { installHandler(); return; }
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === "granted") {
            installHandler();
            lsSet(LS_KEYS.tiltGranted, "1");
            if (this.tiltBtn) this.tiltBtn.style.display = "none";
          } else {
            // User declined this time - surface the visible button so they
            // can try again if they change their mind.
            if (this.tiltBtn) this.tiltBtn.style.display = "block";
          }
        } catch (_) {
          // Call failed (e.g. no gesture) - fall back to visible button.
          if (this.tiltBtn && !alreadyGranted) this.tiltBtn.style.display = "block";
        }
      };

      if (needsPermission) {
        // Wire the visible button regardless; it's harmless when hidden.
        if (this.tiltBtn) {
          this.tiltBtn.onclick = async () => {
            await silentArm();
          };
          if (!alreadyGranted) this.tiltBtn.style.display = "block";
        }
        // First pointer/key gesture in the scene also tries to arm tilt.
        const armOnce = () => {
          this.input.off("pointerdown", armOnce);
          this.input.keyboard.off("keydown", armOnce);
          silentArm();
        };
        this.input.once("pointerdown", armOnce);
        this.input.keyboard.once("keydown", armOnce);
      } else if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
        installHandler();
      } else {
        // Desktop: still try to install so a laptop with an accelerometer works.
        installHandler();
      }

      // ---- Touch fallback + jump-on-tap ----
      // Scene-level pointerdown is the single source of truth for menu
      // button taps (via this.menuHits) when we're not in "playing"
      // state, and for jump/steering during play. Phaser zone-based
      // setInteractive has been unreliable on some iOS builds so we
      // stopped relying on it for critical menus.
      const gameTap = (pointer) => {
        // Menus and overlays handle their own hits via menuHits.
        if (this.state !== "playing") {
          this.tryMenuHit(pointer.x, pointer.y);
          return;
        }
        // Regular gameplay: top-right pause button first, then jump + steer.
        if (this.tryHudHit(pointer.x, pointer.y)) return;
        this.jumpBufferUntil = this.time.now + 150;
        if (pointer.x < this.W / 2) this.touchLeft = true;
        else this.touchRight = true;
      };
      this.input.on("pointerdown", gameTap);
      this.input.on("pointermove", (pointer) => {
        if (this.state !== "playing") return;
        if (pointer.isDown) {
          if (pointer.x < this.W / 2) { this.touchLeft = true;  this.touchRight = false; }
          else                        { this.touchRight = true; this.touchLeft = false;  }
        }
      });
      this.input.on("pointerup", () => {
        this.touchLeft = false;
        this.touchRight = false;
      });
    }

    // ----- Menu hit dispatch -----
    // Overlay screens register rectangular hit regions here. A single
    // scene-level pointerdown handler routes taps, which avoids any
    // Phaser zone/container interactive quirks on mobile.
    addMenuHit(x, y, w, h, onPress, label) {
      if (!this.menuHits) this.menuHits = [];
      this.menuHits.push({ x, y, w, h, onPress, label: label || "" });
    }
    clearMenuHits() { this.menuHits = []; }
    tryMenuHit(px, py) {
      if (!this.menuHits || !this.menuHits.length) return false;
      for (let i = this.menuHits.length - 1; i >= 0; i--) {
        const h = this.menuHits[i];
        if (px >= h.x && px <= h.x + h.w && py >= h.y && py <= h.y + h.h) {
          try { h.onPress(); } catch (e) { console && console.error && console.error(e); }
          return true;
        }
      }
      return false;
    }
    // ----- HUD (in-game) hit dispatch -----
    // Separate from menuHits because those get cleared on each overlay.
    // Used for the always-visible pause button.
    tryHudHit(px, py) {
      if (!this.hudHits || !this.hudHits.length) return false;
      for (let i = this.hudHits.length - 1; i >= 0; i--) {
        const h = this.hudHits[i];
        if (px >= h.x && px <= h.x + h.w && py >= h.y && py <= h.y + h.h) {
          try { h.onPress(); } catch (e) { console && console.error && console.error(e); }
          return true;
        }
      }
      return false;
    }

    readInput() {
      const k = this.keys;
      let ax = 0;

      if (k.left.isDown  || k.a.isDown) ax -= 1;
      if (k.right.isDown || k.d.isDown) ax += 1;

      if (ax === 0 && this.tilt.enabled) {
        ax = this.tilt.x;
      }

      if (ax === 0 && !this.tilt.enabled) {
        if (this.touchLeft)  ax -= 1;
        if (this.touchRight) ax += 1;
      }

      this.axisX = ax;

      // Keyboard jump buffers into the same jumpBufferUntil window as taps.
      if (
        Phaser.Input.Keyboard.JustDown(k.up) ||
        Phaser.Input.Keyboard.JustDown(k.w)  ||
        Phaser.Input.Keyboard.JustDown(k.space)
      ) {
        this.jumpBufferUntil = this.time.now + 150;
      }

      // Fire a jump if: we have a live buffered press AND we can jump
      // (on ground, or inside the 80 ms coyote-time window).
      const now = this.time.now;
      const buffered  = now <= this.jumpBufferUntil;
      const coyoteOk  = !this.player.onGround && (now - this.lastGroundTime) <= 80;
      this.jumpPressed = buffered && (this.player.onGround || coyoteOk);
      if (this.jumpPressed) this.jumpBufferUntil = 0;
    }

    // ---------------------------------------------------------------
    // Run lifecycle
    // ---------------------------------------------------------------
    resetRun() {
      // Floor 0 top surface lives here in world coords.
      this.FLOOR0_Y = this.H - 80;

      this.player = {
        x: this.W / 2,
        y: this.FLOOR0_Y,       // feet y (world coords)
        prevY: this.FLOOR0_Y,
        vx: 0,
        vy: 0,
        w: CFG.CHAR_W,
        h: CFG.CHAR_H,
        onGround: true,
        facing: 1,
        runPhase: 0,
        crouchT: 0,
        // Wall bounce bookkeeping
        wallHitTime: 0,          // performance.now() of last wall hit, 0 if none pending
        wallHitSide: 0,          // -1 = hit left wall, +1 = hit right wall
        wallBounceArmed: false,  // true between hit and window expiry
        // Floor tracking
        currentFloor: 0,
        highestFloor: 0,
        jumpStartFloor: 0,
        // Flip / somersault
        rotation: 0,             // current body rotation in radians
        rotRate: 0,              // rad/s while airborne (0 = no flip)
        jumpSpeedFrac: 0,        // |vx|/maxSpeed at the instant of takeoff
      };
      this.bestFlips = lsGetInt(LS_KEYS.bestFlips, 0);
      this.bestFlipsThisRun = 0;

      // Pull selected character and bind its drawer.
      try {
        const savedId = localStorage.getItem(LS_KEYS.character) || "climber";
        const entry = CHARACTERS.find(c => c.id === savedId) || CHARACTERS[0];
        this.characterId = entry.id;
        this.characterDrawer = this[entry.drawFn] || this.drawCharClimber;
      } catch (_) {
        this.characterId = "climber";
        this.characterDrawer = this.drawCharClimber;
      }

      // Floors are authored in world-space; spawn them once.
      this.floors = [];
      this.maxSpawnedFloor = -1;
      this.spawnFloor(0); // ground
      for (let i = 1; i <= 60; i++) this.spawnFloor(i);

      // Camera starts at 0 (top of screen = world y 0). Upward-only follow.
      this.cameras.main.setScroll(0, 0);
      this.cameraY = 0;

      // Auto-scroll state
      this.scrollActive = false;
      this.scrollSpeed  = 0;              // px/s (camera moves upward)
      this.scrollStartedAt = 0;
      this.nextSpeedupAt = 0;

      // Hurry-up & flash FX
      this.hurryFlashEndsAt = 0;
      this.hurryFlashStrong = false;

      // Run / game-over state
      this.gameOver = false;
      this.gameOverOverlay = null;
      this.runStartTime = this.time.now;
      this.hintUntil = this.time.now + 5500; // hint auto-hides
      this.hintLabel = null;

      // Combo + score
      this.score = 0;
      this.combo = {
        count: 0,
        timer: 0,                // seconds remaining (0 = inactive)
        longest: 0,              // longest combo this run
      };
      this.rewardPopups = [];    // active reward text objects

      // Particles
      this.particles = [];       // [{x,y,vx,vy,life,maxLife,size,color}]

      // Milestones already announced (so each only fires once)
      this.milestonesFired = {};

      // Ghost recording / playback
      // Saved samples: [t_ms, x, y, facing] per tick.
      this.ghostRec = { samples: [], lastSampleAt: 0 };
      this.ghostPlay = null;
      if (this.best.ghost && Array.isArray(this.best.ghost.samples) && this.best.ghost.samples.length > 2) {
        this.ghostPlay = {
          samples: this.best.ghost.samples,
          startTime: this.time.now,
          index: 0,
        };
      }

      // Build / refresh HUD
      this.buildHUD();
    }

    // ---------------------------------------------------------------
    // Floor generation
    // ---------------------------------------------------------------
    floorY(n) { return this.FLOOR0_Y - n * CFG.FLOOR_HEIGHT; }

    // Width fraction uses the current level's widthFactor with a gentle
    // interpolation toward the next level's factor so the narrowing is
    // smooth rather than stepped.
    floorWidthFrac(n) {
      if (n <= 0) return 1.0;
      const idx = levelIndexFor(n);
      const cur = LEVELS[idx];
      const next = LEVELS[idx + 1];
      if (!next) return 0.70 * cur.widthFactor;
      const t = Phaser.Math.Clamp((n - cur.floor) / (next.floor - cur.floor), 0, 1);
      const w = Phaser.Math.Linear(cur.widthFactor, next.widthFactor, t);
      return 0.70 * w;
    }

    spawnFloor(n) {
      if (n <= this.maxSpawnedFloor) return;
      // Fill any gaps (shouldn't happen in practice)
      for (let k = this.maxSpawnedFloor + 1; k <= n; k++) this._createFloor(k);
    }

    _createFloor(n) {
      const y = this.floorY(n);
      let f;
      if (n === 0) {
        // Ground - full width
        f = { n: 0, x: 0, y, w: this.W, h: CFG.FLOOR_THICKNESS, ground: true };
      } else {
        const frac = this.floorWidthFrac(n);
        const jitter = 1 + (Math.random() * 2 - 1) * CFG.FLOOR_WIDTH_JITTER;
        const availW = this.W - CFG.WALL_THICKNESS * 2;
        let w = Math.max(CFG.FLOOR_MIN_WIDTH_PX, availW * frac * jitter);
        w = Math.min(w, availW - 10);
        const slack = availW - w;
        const x = CFG.WALL_THICKNESS + Math.random() * slack;
        f = { n, x, y, w, h: CFG.FLOOR_THICKNESS, ground: false };
      }
      this.floors.push(f);
      this.maxSpawnedFloor = n;
    }

    // Theme for a given floor number is driven by the level table.
    floorTheme(n) {
      return THEMES[levelFor(n).themeKey];
    }

    // Smoothly blend between current and next level's theme over the last
    // 8 floors before a level boundary.
    currentTheme() {
      const n = this.player ? this.player.highestFloor : 0;
      const idx = levelIndexFor(n);
      const cur = LEVELS[idx];
      const next = LEVELS[idx + 1];
      const a = THEMES[cur.themeKey];
      if (!next) return a;
      const floorsLeft = next.floor - n;
      if (floorsLeft > 8) return a;
      const t = 1 - floorsLeft / 8;
      const b = THEMES[next.themeKey];
      return {
        top:    lerpColor(a.top,    b.top,    t),
        side:   lerpColor(a.side,   b.side,   t),
        wall:   lerpColor(a.wall,   b.wall,   t),
        bg1:    lerpColor(a.bg1,    b.bg1,    t),
        bg2:    lerpColor(a.bg2,    b.bg2,    t),
        accent: lerpColor(a.accent, b.accent, t),
        glint:  lerpColor(a.glint,  b.glint,  t),
        name:   a.name,
        accentFn: a.accentFn,
      };
    }

    // Draws the player procedurally in local coordinates centered on
    // (0,0) = body center. Position + rotation are applied via playerGfx
    // transform so mid-air flips just work.
    drawPlayer() {
      const p = this.player;
      const g = this.playerGfx;
      g.clear();

      // Squash/stretch + facing lean (only on ground - while airborne
      // the body itself rotates so no lean is needed).
      const crouch = p.crouchT;
      const squash = 1 - crouch * 0.2;
      const stretch = p.onGround ? 1 : 1.05;
      const h = p.h * squash * stretch;
      const w = p.w;

      const airborne = !p.onGround;
      const speedFrac = Phaser.Math.Clamp(Math.abs(p.vx) / CFG.MAX_H_SPEED, 0, 1);
      const lean = p.onGround ? p.facing * speedFrac * 4 : 0;

      // Body-center is the rotation pivot.
      g.x = p.x;
      g.y = p.y - h / 2;
      g.rotation = p.rotation;
      g.scaleX = p.facing < 0 ? -1 : 1; // mirror when facing left

      // Origin inside the local frame: body center at (0,0).
      // Draw everything relative to that.
      const draw = this.characterDrawer || this.drawCharClimber;
      draw.call(this, g, { w, h, lean, airborne, speedFrac, runPhase: p.runPhase, now: this.time.now, facing: p.facing });
    }

    // ----- Character drawers (local coords centered on body) -----
    // Only the arctic climber is defined now. Phase 13 adds the roster.
    drawCharClimber(g, o) {
      const { w, h, lean, airborne, speedFrac, runPhase, now } = o;
      const halfH = h / 2;

      // Top-left of bounding box in local coords
      const bx = -w / 2;
      const by = -halfH;

      // Legs
      const legW = 5;
      const legH = Math.max(4, h * 0.28);
      const legY = by + h - legH;
      const legSpread = w * 0.25;
      const legLX = -legSpread - legW / 2;
      const legRX =  legSpread - legW / 2;

      g.fillStyle(0x2b2b30, 1);
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX, tuckY, legW, legH);
        g.fillRect(legRX, tuckY, legW, legH);
      } else if (speedFrac > 0.05) {
        const s = Math.sin(runPhase);
        const off = s * legH * 0.4;
        g.fillRect(legLX, legY - off, legW, legH);
        g.fillRect(legRX, legY + off, legW, legH);
      } else {
        g.fillRect(legLX, legY, legW, legH);

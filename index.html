    // ---------------------------------------------------------------
    // Physics
    // ---------------------------------------------------------------
    updatePhysics(dt) {
      const p = this.player;
      const ax = this.axisX;

      // ---- Horizontal ----
      if (ax !== 0) {
        const accel = p.onGround ? CFG.GROUND_ACCEL : CFG.AIR_ACCEL;
        p.vx += ax * accel * dt;
        p.vx = Phaser.Math.Clamp(p.vx, -CFG.MAX_H_SPEED, CFG.MAX_H_SPEED);
        p.facing = ax > 0 ? 1 : -1;
      } else if (p.onGround) {
        // Ice friction - slide to stop
        const dec = CFG.GROUND_FRICTION * dt;
        if (Math.abs(p.vx) <= dec) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * dec;
      }

      // ---- Jump ----
      if (this.jumpPressed && (p.onGround || (this.time.now - this.lastGroundTime) <= 80)) {
        const speedFrac = Math.abs(p.vx) / CFG.MAX_H_SPEED;
        p.vy = -(CFG.BASE_JUMP + speedFrac * CFG.BONUS_JUMP);
        p.onGround = false;
        p.jumpStartFloor = p.currentFloor;
        p.jumpSpeedFrac = speedFrac;
        // Somersault mid-air when launched at high speed. Rotation sign
        // follows the direction of travel so the flip looks "forward".
        if (speedFrac >= 0.7) {
          const dir = Math.sign(p.vx) || 1;
          // 2.2 full turns per second at max speed, 0 turns at 70% speed.
          const turnsPerSec = 2.2 * (speedFrac - 0.7) / 0.3;
          p.rotRate = dir * Math.PI * 2 * turnsPerSec;
        } else {
          p.rotRate = 0;
        }
        p.rotation = 0;
        this.audio.jump(speedFrac);
      }

      // ---- Gravity ----
      p.vy += CFG.GRAVITY * dt;

      // ---- Integrate ----
      p.prevY = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // ---- Floor collision (one-way, only when falling) ----
      this.resolveFloorCollision();

      // ---- Wall collision & bounce ----
      this.resolveWallCollision();

      // Track the last moment the player was grounded, used by coyote time.
      if (p.onGround) this.lastGroundTime = this.time.now;

      // ---- Somersault rotation while airborne ----
      if (!p.onGround && p.rotRate !== 0) {
        p.rotation += p.rotRate * dt;
      } else if (p.onGround) {
        // Ease rotation to 0 on the ground so stance is upright.
        if (p.rotation !== 0) {
          const ease = Math.sign(p.rotation) * Math.min(Math.abs(p.rotation), Math.PI * 6 * dt);
          p.rotation -= ease;
        }
      }

      // ---- Animation state ----
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.runPhase += (Math.abs(p.vx) / CFG.MAX_H_SPEED) * 18 * dt;
      } else if (!p.onGround) {
        p.runPhase = 0;
      }
      if (p.crouchT > 0) p.crouchT = Math.max(0, p.crouchT - dt / 0.15);
    }

    resolveFloorCollision() {
      const p = this.player;
      if (p.vy < 0) return; // rising - pass through (one-way)

      const halfW = p.w / 2;
      const prevBottom = p.prevY;
      const curBottom = p.y;

      // Only consider floors whose top is between prevBottom and curBottom.
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        const top = f.y;
        if (prevBottom <= top && curBottom >= top) {
          // Horizontal overlap?
          if (p.x + halfW > f.x && p.x - halfW < f.x + f.w) {
            // Land
            p.y = top;
            p.vy = 0;
            const wasAir = !p.onGround;
            p.onGround = true;
            if (wasAir) this.onLand(f);
            break;
          }
        }
      }
    }

    resolveWallCollision() {
      const p = this.player;
      const halfW = p.w / 2;
      const leftBound  = CFG.WALL_THICKNESS + halfW;
      const rightBound = this.W - CFG.WALL_THICKNESS - halfW;
      const now = performance.now();

      if (p.x < leftBound && p.vx <= 0) {
        p.x = leftBound;
        // Flip horizontal velocity on impact
        p.vx = Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = -1;
        p.wallBounceArmed = true;
      } else if (p.x > rightBound && p.vx >= 0) {
        p.x = rightBound;
        p.vx = -Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = 1;
        p.wallBounceArmed = true;
      }

      // Resolve the bounce window
      if (p.wallBounceArmed) {
        const elapsed = now - p.wallHitTime;
        // Opposite-direction input check: hit right wall -> need LEFT input.
        const inputAwayFromWall =
          (p.wallHitSide === 1  && this.axisX < -0.1) ||
          (p.wallHitSide === -1 && this.axisX >  0.1);

        if (inputAwayFromWall && elapsed <= CFG.WALL_BOUNCE_WINDOW_MS) {
          // Successful wall bounce: full momentum preserved, vy untouched.
          const dir = -p.wallHitSide;
          p.vx = dir * CFG.MAX_H_SPEED;
          // vy left alone - the upward climb continues.
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
          this.onWallBounce();
        } else if (elapsed > CFG.WALL_BOUNCE_WINDOW_MS) {
          // Window expired without reversal - lose all horizontal momentum.
          p.vx = 0;
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
        }
      }
    }

    // ---------------------------------------------------------------
    // Landing / wall-bounce hooks
    // ---------------------------------------------------------------
    onLand(floor) {
      const p = this.player;
      p.crouchT = 1;

      const fromFloor = p.jumpStartFloor;
      const toFloor   = floor.n;
      const prevFloor = p.currentFloor;
      p.currentFloor = toFloor;

      // Landing particle burst + sound
      this.spawnLandParticles(p.x, floor.y, this.floorTheme(floor.n));
      const impact = Phaser.Math.Clamp((p.vy === 0 ? 0 : 0.5) + (p.prevY > floor.y ? (p.prevY - floor.y) / 200 : 0), 0, 1);
      this.audio.land(impact);
      // Microinteraction: subtle camera shake on high-impact landings.
      if (impact > 0.55) this.shakeCamera(0.004 + (impact - 0.55) * 0.01, 120);

      // --- Flip / somersault reward ---
      const flips = Math.max(0, Math.floor(Math.abs(p.rotation) / (Math.PI * 2)));
      let flipBonus = 0;
      if (flips > 0) {
        const mult = 1 + this.combo.count * 0.5;
        flipBonus = Math.round(100 * flips * mult);
        this.score += flipBonus;
        if (flips > this.bestFlipsThisRun) this.bestFlipsThisRun = flips;
        if (flips > this.bestFlips) {
          this.bestFlips = flips;
          lsSet(LS_KEYS.bestFlips, this.bestFlips);
        }
        this.spawnFlipPopup(flips, flipBonus);
        // Audio: rising pair of pings scaled to flip count
        this.audio.comboReward(Math.min(4, flips));
      }
      // Reset rotation & rotation rate now that the jump is done.
      p.rotation = 0;
      p.rotRate = 0;
      p.jumpSpeedFrac = 0;

      const floorsClearedSinceJump = toFloor - fromFloor;

      // --- New-floor scoring ---
      if (toFloor > p.highestFloor) {
        const gained = toFloor - p.highestFloor;
        // Multiplier is additive: 1 + (count * 0.5). count 0 -> 1x.
        const mult = 1 + this.combo.count * 0.5;
        this.score += Math.round(CFG.POINTS_PER_FLOOR * gained * mult);
        const prevBest = p.highestFloor;
        p.highestFloor = toFloor;

        // Level-up detection (fires before milestones so banners stack nicely)
        const prevLevelIdx = levelIndexFor(prevBest);
        const newLevelIdx  = levelIndexFor(toFloor);
        if (newLevelIdx > prevLevelIdx) {
          this.triggerLevelUp(LEVELS[newLevelIdx]);
        }

        // Milestone flashes
        for (let m = 0; m < CFG.MILESTONES.length; m++) {
          const ms = CFG.MILESTONES[m];
          if (prevBest < ms && toFloor >= ms && !this.milestonesFired[ms]) {
            this.milestonesFired[ms] = true;
            this.triggerMilestone(ms);
          }
        }

        // Keep the tower built well above the player
        const wantUpTo = toFloor + 80;
        if (wantUpTo > this.maxSpawnedFloor) {
          for (let k = this.maxSpawnedFloor + 1; k <= wantUpTo; k++) this._createFloor(k);
        }
      } else if (toFloor < prevFloor) {
        // Fell to a lower floor - revoke the points for the drop.
        const lost = prevFloor - toFloor;
        this.score = Math.max(0, this.score - lost * CFG.POINTS_PER_FLOOR);
      }

      // --- Combo update ---
      // Combo continues if we cleared >=2 floors OR completed at least 1 flip.
      const qualifying = floorsClearedSinceJump >= CFG.COMBO_MIN_FLOORS || flips > 0;
      if (qualifying) {
        this.combo.count += 1;
        this.combo.timer = CFG.COMBO_TIMEOUT_MS / 1000;
        if (this.combo.count > this.combo.longest) {
          this.combo.longest = this.combo.count;
        }
        this.maybeShowComboReward(this.combo.count);
        this.pulseCombo();
      } else {
        if (this.combo.count > 0) this.breakCombo();
      }
    }

    spawnFlipPopup(flips, bonus) {
      const word = flips === 1 ? "1 FLIP" : `${flips} FLIPS`;
      const color = flips >= 3 ? "#ff5cf0" : flips >= 2 ? "#ffaa00" : "#fff56a";
      const text = `${word}  +${bonus}`;
      const p = this.player;
      // World-space popup near the character so it reads as a flip reward.
      const wx = p.x;
      const wy = p.y - p.h - 10;
      const label = this.add.text(wx, wy, text, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(Math.min(this.W, this.H) * 0.05) + "px",
        fontStyle: "bold",
        color,
        stroke: "#000",
        strokeThickness: 5,
      }).setOrigin(0.5).setDepth(11);
      this.tweens.add({
        targets: label,
        y: wy - 40,
        alpha: { from: 1, to: 0 },
        scale: { from: 0.6, to: 1.1 },
        duration: 900,
        ease: "Sine.Out",
        onComplete: () => label.destroy(),
      });
    }

    breakCombo() {
      this.combo.count = 0;
      this.combo.timer = 0;
    }

    // Reward thresholds from the spec: 5/10/20/30/50/100+
    maybeShowComboReward(n) {
      const tier = this.comboTierFor(n);
      if (!tier) return;
      this.spawnRewardPopup(tier);
      // Tier index drives the chime key
      const tierIdx =
        n >= 100 ? 5 : n >= 50 ? 4 : n >= 30 ? 3 : n >= 20 ? 2 : n >= 10 ? 1 : 0;
      this.audio.comboReward(tierIdx);
    }

    comboTierFor(n) {
      // Only fire the pop-up when we just crossed a threshold.
      if (n === 5)   return "GOOD!";
      if (n === 10)  return "SWEET!";
      if (n === 20)  return "EXCELLENT!";
      if (n === 30)  return "FANTASTIC!";
      if (n === 50)  return "EXTREME!";
      if (n === 100) return "GODLIKE!";
      // Every +25 beyond 100 keeps GODLIKE alive so marathon combos still feel good.
      if (n > 100 && (n - 100) % 25 === 0) return "GODLIKE!";
      return null;
    }

    spawnRewardPopup(text) {
      const cx = this.W / 2;
      const cy = this.H * 0.38;
      const S = Math.min(this.W, this.H);
      const size = Math.round(S * 0.12);
      const color = tierColorFor(this.combo.count);
      const colorCss = tierColorCssFor(this.combo.count);

      // Shockwave ring behind the text
      const ring = this.add.graphics().setScrollFactor(0).setDepth(1690);
      const drawRing = (r, a) => {
        ring.clear();
        ring.lineStyle(5, color, a);
        ring.strokeCircle(cx, cy, r);
        ring.lineStyle(2, 0xffffff, a * 0.7);
        ring.strokeCircle(cx, cy, r * 0.95);
      };
      drawRing(4, 0.9);
      this.tweens.addCounter({
        from: 4, to: S * 0.4, duration: 550, ease: "Sine.Out",
        onUpdate: (tw) => {
          const r = tw.getValue();
          const a = 1 - r / (S * 0.4);
          drawRing(r, Math.max(0, a));
        },
        onComplete: () => ring.destroy(),
      });

      const label = this.add.text(cx, cy, text, {
        fontFamily: "Courier New, monospace",
        fontSize: size + "px",
        fontStyle: "bold",
        color: colorCss,
        stroke: "#000",
        strokeThickness: 9,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1700).setAlpha(0);

      this.tweens.add({
        targets: label,
        alpha: { from: 0, to: 1 },
        scale: { from: 0.5, to: 1.2 },
        y: cy - 20,
        ease: "Back.Out",
        duration: 260,
      });
      this.tweens.add({
        targets: label,
        alpha: 0,
        scale: 1.0,
        y: cy - 80,
        delay: 1000,
        duration: 700,
        ease: "Sine.In",
        onComplete: () => label.destroy(),
      });
    }

    onWallBounce() {
      this.audio.wallBounce();
      const p = this.player;
      const theme = this.currentTheme();
      const xWall = p.wallHitSide === -1 ? CFG.WALL_THICKNESS : this.W - CFG.WALL_THICKNESS;
      const dir = -p.wallHitSide;
      for (let i = 0; i < 10; i++) {
        this.particles.push({
          x: xWall, y: p.y - p.h * 0.6 + (Math.random() - 0.5) * 14,
          vx: dir * (40 + Math.random() * 80),
          vy: (Math.random() - 0.5) * 80,
          life: 0.4, maxLife: 0.4,
          size: 2 + Math.random() * 2,
          color: theme.accent,
        });
      }
    }

    // ---------------------------------------------------------------
    // Particles
    // ---------------------------------------------------------------
    spawnLandParticles(x, y, theme) {
      const n = 14;
      for (let i = 0; i < n; i++) {
        const angle = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9; // upward fan
        const speed = 40 + Math.random() * 90;
        this.particles.push({
          x: x + (Math.random() - 0.5) * 12,
          y: y - 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.3,
          maxLife: 0.8,
          size: 1 + Math.floor(Math.random() * 3),
          color: i % 3 === 0 ? theme.accent : theme.top,
        });
      }
    }

    updateParticles(dt) {
      const arr = this.particles;
      for (let i = arr.length - 1; i >= 0; i--) {
        const pt = arr[i];
        pt.life -= dt;
        if (pt.life <= 0) { arr.splice(i, 1); continue; }
        pt.vy += 420 * dt; // gravity on particles
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
      }
    }

    drawParticles() {
      const g = this.particlesGfx;
      g.clear();
      for (let i = 0; i < this.particles.length; i++) {
        const pt = this.particles[i];
        const a = Math.max(0, Math.min(1, pt.life / pt.maxLife));
        g.fillStyle(pt.color, a);
        g.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
      }
    }

    // ---------------------------------------------------------------
    // Ghost recording & playback
    // ---------------------------------------------------------------
    updateGhost(dt) {
      const p = this.player;
      const now = this.time.now - this.runStartTime;
      // Sample roughly every GHOST_SAMPLE_MS
      if (now - this.ghostRec.lastSampleAt >= CFG.GHOST_SAMPLE_MS) {
        this.ghostRec.lastSampleAt = now;
        // Keep sample payload tiny: rounded ints only.
        this.ghostRec.samples.push([
          Math.round(now),
          Math.round(p.x),
          Math.round(p.y),
          p.facing,
        ]);
      }
    }

    drawGhost() {
      const g = this.ghostGfx;
      g.clear();
      if (!this.ghostPlay) return;
      const samples = this.ghostPlay.samples;
      const elapsed = this.time.now - this.ghostPlay.startTime;

      // Advance index while next sample time <= elapsed
      while (
        this.ghostPlay.index < samples.length - 1 &&
        samples[this.ghostPlay.index + 1][0] <= elapsed
      ) this.ghostPlay.index++;

      const i = this.ghostPlay.index;
      if (i >= samples.length - 1) return;

      const a = samples[i];
      const b = samples[i + 1];
      const span = Math.max(1, b[0] - a[0]);
      const t = Phaser.Math.Clamp((elapsed - a[0]) / span, 0, 1);
      const gx = a[1] + (b[1] - a[1]) * t;
      const gy = a[2] + (b[2] - a[2]) * t;

      // Don't render if offscreen
      if (gy < this.cameraY - 60 || gy > this.cameraY + this.H + 60) return;

      // Simple silhouette matching the player proportions
      const w = CFG.CHAR_W;
      const h = CFG.CHAR_H;
      const bx = gx - w / 2;
      const by = gy - h;
      g.fillStyle(0xffffff, 0.35);
      g.fillRect(bx, by + 4, w, h - 4);
      g.fillStyle(0x9cd9ff, 0.40);
      g.fillRect(bx, by + h * 0.30, w, h * 0.46);
      g.fillStyle(0xffffff, 0.25);
      g.fillRect(bx + 1, by, w - 2, 6);
    }

    maybeSaveGhost() {
      // Save this run's ghost only if it beat the stored best score,
      // or if no ghost exists yet. Keeps the localStorage payload bounded.
      const bestHas = this.best.ghost && Array.isArray(this.best.ghost.samples);
      const beatBest = this.score >= (this.best.ghost ? this.best.ghost.score : 0);
      if (!bestHas || beatBest) {
        // Cap total length at ~2000 samples (~200s of play) to keep storage small.
        const samples = this.ghostRec.samples.slice(0, 2000);
        const payload = {
          samples,
          score: this.score,
          floor: this.player.highestFloor,
          combo: this.combo.longest,
        };
        try {
          lsSet(LS_KEYS.ghost, payload);
          this.best.ghost = payload;
        } catch (_) {}
      }
    }

    // ---------------------------------------------------------------
    // Share
    // ---------------------------------------------------------------
    shareScore() {
      const text = `I reached floor ${this.player.highestFloor} with a ${this.combo.longest}-combo in Frostspire!`;
      const fallback = () => {
        // textarea + execCommand("copy") fallback for very old browsers
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (_) { return false; }
      };
      const done = () => {
        if (this._shareToast) this._shareToast.destroy();
        const toast = this.add.text(this.W / 2, this.H - 56, "COPIED!", {
          fontFamily: "Courier New, monospace",
          fontSize: "18px", fontStyle: "bold",
          color: "#fff", stroke: "#000", strokeThickness: 3,
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2100);
        this._shareToast = toast;
        this.tweens.add({ targets: toast, alpha: 0, delay: 900, duration: 600, onComplete: () => toast.destroy() });
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => { if (fallback()) done(); });
      } else if (fallback()) {
        done();
      }
      // If the Web Share API is available (mobile), also offer native share.
      if (navigator.share) {
        try { navigator.share({ text, title: "Frostspire" }).catch(() => {}); } catch (_) {}
      }
    }

    // ---------------------------------------------------------------
    // Milestone flash at floors 100 / 250 / 500 / 1000
    // ---------------------------------------------------------------
    triggerLevelUp(level) {
      this.audio.milestone();
      const idx = LEVELS.indexOf(level);
      const cx = this.W / 2;
      const cy = this.H * 0.38;
      const size = Math.round(Math.min(this.W, this.H) * 0.065);
      const nameSize = Math.round(Math.min(this.W, this.H) * 0.10);

      const line1 = this.add.text(cx, cy - nameSize * 0.6, `LEVEL ${idx + 1}`, {
        fontFamily: "Courier New, monospace",
        fontSize: size + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 6,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1750).setAlpha(0);

      const line2 = this.add.text(cx, cy + nameSize * 0.15, level.name, {
        fontFamily: "Courier New, monospace",
        fontSize: nameSize + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 7,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1750).setAlpha(0);

      this.tweens.add({
        targets: [line1, line2], alpha: 1, scale: { from: 0.5, to: 1.1 },
        duration: 280, ease: "Back.Out",
      });
      this.tweens.add({
        targets: [line1, line2], alpha: 0, scale: 1.25, y: "-=40",
        delay: 1500, duration: 700, ease: "Sine.In",
        onComplete: () => { line1.destroy(); line2.destroy(); },
      });

      // Screen-tint flash using the incoming theme's accent color.
      const nextTheme = THEMES[level.themeKey];
      const flash = this.add.graphics().setScrollFactor(0).setDepth(1600);
      flash.fillStyle(nextTheme.accent, 0.35);
      flash.fillRect(0, 0, this.W, this.H);
      this.tweens.add({
        targets: flash, alpha: 0, duration: 550, ease: "Sine.Out",
        onComplete: () => flash.destroy(),
      });

      // Ratchet scroll speed to the new level baseline so pressure rises.
      if (this.scrollActive && this.scrollSpeed < level.scrollSpeed) {
        this.scrollSpeed = level.scrollSpeed;
      }
    }

    triggerMilestone(n) {
      this.audio.milestone();
      const msg = n >= 1000 ? `FLOOR ${n}!\nLEGEND.`
                : n >= 500  ? `FLOOR ${n}!\nINCREDIBLE!`
                : n >= 250  ? `FLOOR ${n}!\nKEEP GOING!`
                :             `FLOOR ${n}!\nNICE CLIMB!`;
      const cx = this.W / 2;
      const cy = this.H * 0.42;
      const size = Math.round(Math.min(this.W, this.H) * 0.1);
      const label = this.add.text(cx, cy, msg, {
        fontFamily: "Courier New, monospace",
        fontSize: size + "px",
        fontStyle: "bold",
        color: "#fff",
        stroke: "#000",
        strokeThickness: 8,
        align: "center",
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1750).setAlpha(0);
      this.tweens.add({
        targets: label, alpha: 1, scale: { from: 0.5, to: 1.2 },
        duration: 260, ease: "Back.Out",
      });
      this.tweens.add({
        targets: label, alpha: 0, scale: 1.3, y: cy - 40,
        delay: 1400, duration: 700, ease: "Sine.In",
        onComplete: () => label.destroy(),
      });

      // Full-screen color flash
      const theme = this.currentTheme();
      const flash = this.add.graphics().setScrollFactor(0).setDepth(1600);
      flash.fillStyle(theme.accent, 0.35);
      flash.fillRect(0, 0, this.W, this.H);
      this.tweens.add({
        targets: flash, alpha: 0,
        duration: 450, ease: "Sine.Out",
        onComplete: () => flash.destroy(),
      });
    }

    // ---------------------------------------------------------------
    // Camera - upward-only follow + auto-scroll escalation
    // ---------------------------------------------------------------
    updateCamera(dt) {
      const p = this.player;

      // Follow player while climbing; never pan back down.
      const desired = p.y - this.H * 0.62;
      if (desired < this.cameraY) {
        this.cameraY = Phaser.Math.Linear(this.cameraY, desired, 0.18);
      }

      // Trigger auto-scroll once the player first reaches the start floor.
      if (!this.scrollActive && p.highestFloor >= CFG.SCROLL_START_FLOOR) {
        this.scrollActive = true;
        this.scrollSpeed = Math.max(CFG.SCROLL_INITIAL_SPEED, levelFor(p.highestFloor).scrollSpeed);
        this.scrollStartedAt = this.time.now;
        this.nextSpeedupAt  = this.time.now + CFG.SCROLL_INCREMENT_MS;
        this.triggerHurryUp(false);
      }

      if (this.scrollActive) {
        // Scheduled speed-ups (still +20 every 30s for in-level pressure).
        if (this.time.now >= this.nextSpeedupAt) {
          this.scrollSpeed += CFG.SCROLL_INCREMENT;
          this.nextSpeedupAt = this.time.now + CFG.SCROLL_INCREMENT_MS;
          this.triggerHurryUp(true);
        }
        // Keep up with the level baseline, but never slow down.
        const baseline = levelFor(p.highestFloor).scrollSpeed;
        if (this.scrollSpeed < baseline) this.scrollSpeed = baseline;
        this.cameraY -= this.scrollSpeed * dt;
      }

      this.cameras.main.setScroll(0, this.cameraY);
    }

    // ---------------------------------------------------------------
    // Combo timer update (called per frame)
    // ---------------------------------------------------------------
    updateCombo(dt) {
      if (this.combo.timer > 0) {
        this.combo.timer -= dt;
        if (this.combo.timer <= 0) {
          this.combo.timer = 0;
          if (this.combo.count > 0) this.breakCombo();
        }
      }
    }

    // ---------------------------------------------------------------
    // HUD (floor / score / best / combo meter)
    // ---------------------------------------------------------------
    buildHUD() {
      if (this.hud) this.hud.container.destroy();
      const c = this.add.container(0, 0).setScrollFactor(0).setDepth(1100);

      const S = Math.min(this.W, this.H);
      const pad = Math.round(S * 0.025);
      const small = Math.max(13, Math.round(S * 0.030));
      const big   = Math.max(20, Math.round(S * 0.050));

      // ---- Floor counter (top-left) ----
      const floorPlate = this.add.graphics();
      c.add(floorPlate);
      const floorTxt = this.add.text(pad + 6, pad, "FLOOR 0", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#00182e", strokeThickness: 4,
      });
      c.add(floorTxt);

      // ---- Score ticker (top-center) ----
      const scorePlate = this.add.graphics();
      c.add(scorePlate);
      const scoreTxt = this.add.text(this.W / 2, pad, "0", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(big * 1.1) + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0.5, 0);
      c.add(scoreTxt);

      // ---- Best score (top-right, with crown glyph) ----
      const bestTxt = this.add.text(this.W - pad, pad + 2, "\u2654 BEST " + this.best.score, {
        fontFamily: "Courier New, monospace",
        fontSize: small + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 3,
      }).setOrigin(1, 0);
      c.add(bestTxt);

      // ---- Combo meter (vertical, left edge) ----
      const meterBG    = this.add.graphics();
      const meterFill  = this.add.graphics();
      const meterGlow  = this.add.graphics();
      c.add(meterBG); c.add(meterFill); c.add(meterGlow);

      // ---- Giant multiplier badge on the meter ----
      const multTxt = this.add.text(pad + 26, this.H * 0.5, "", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.085) + "px",
        fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 6,
      }).setOrigin(0, 0.5);
      c.add(multTxt);
      multTxt.setVisible(false);

      // Small "COMBO" label above the meter
      const comboLabel = this.add.text(pad + 8, this.H * 0.22 - small * 1.1, "COMBO", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(small * 0.85) + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#000", strokeThickness: 3,
      }).setOrigin(0.5, 1);
      c.add(comboLabel);
      comboLabel.setVisible(false);

      // ---- Always-visible in-game PAUSE button (top-right) ----
      // Rendered high up (depth 1100 via container), hit-tested via hudHits.
      const pauseSize = Math.max(34, Math.round(S * 0.065));
      const pauseX = this.W - pad - pauseSize;
      const pauseY = pad - 2;
      const pauseBtn = this.add.graphics();
      pauseBtn.fillStyle(0x000000, 0.55);
      pauseBtn.fillRoundedRect(pauseX, pauseY, pauseSize, pauseSize, 8);
      pauseBtn.lineStyle(2, 0x9cd9ff, 0.9);
      pauseBtn.strokeRoundedRect(pauseX, pauseY, pauseSize, pauseSize, 8);
      // Pause bars
      pauseBtn.fillStyle(0x9cd9ff, 1);
      const barW = Math.round(pauseSize * 0.15);
      const barH = Math.round(pauseSize * 0.5);
      const bar1X = pauseX + pauseSize * 0.32 - barW / 2;
      const bar2X = pauseX + pauseSize * 0.68 - barW / 2;
      const barY  = pauseY + (pauseSize - barH) / 2;
      pauseBtn.fillRect(bar1X, barY, barW, barH);
      pauseBtn.fillRect(bar2X, barY, barW, barH);
      c.add(pauseBtn);

      // Register HUD hit for the pause button. hudHits fire during playing.
      this.hudHits = [{
        x: pauseX - 4, y: pauseY - 4,
        w: pauseSize + 8, h: pauseSize + 8,
        onPress: () => this.togglePause(),
      }];

      // Bump "BEST" label x so it doesn't collide with the pause square.
      bestTxt.setX(pauseX - 8);

      this.hud = {
        container: c,
        floorPlate, floorTxt, scorePlate, scoreTxt, bestTxt,
        meterBG, meterFill, meterGlow, multTxt, comboLabel,
        pauseBtn, pauseSize,
        pad, small, big, S,
        // Tickers / pulse state
        scoreShown: 0,
        multPrev: 0,
        meterPulse: 0,
      };
    }

    // Drive a smoothly animated score so it ticks up instead of snapping.
    drawHUD() {
      if (!this.hud) return;
      const h = this.hud;
      const p = this.player;

      // Floor counter with small chevron
      h.floorTxt.setText("\u25B2 FLOOR " + p.highestFloor);

      // Plate behind floor text
      const fb = h.floorTxt.getBounds();
      h.floorPlate.clear();
      h.floorPlate.fillStyle(0x000000, 0.38);
      h.floorPlate.fillRoundedRect(fb.x - 8, fb.y - 3, fb.width + 16, fb.height + 6, 6);

      // Score ticker: ease toward target each frame
      const target = this.score;
      if (h.scoreShown !== target) {
        const diff = target - h.scoreShown;
        const step = Math.max(1, Math.ceil(Math.abs(diff) * 0.18));
        if (diff > 0) h.scoreShown = Math.min(target, h.scoreShown + step);
        else          h.scoreShown = Math.max(target, h.scoreShown - step);
      }
      h.scoreTxt.setText(String(h.scoreShown));

      // Score plate
      const sb = h.scoreTxt.getBounds();
      h.scorePlate.clear();
      h.scorePlate.fillStyle(0x000000, 0.42);
      h.scorePlate.fillRoundedRect(sb.x - 10, sb.y - 3, sb.width + 20, sb.height + 6, 8);
      // Flash border when behind target
      if (h.scoreShown < target) {
        h.scorePlate.lineStyle(2, 0xffdf3c, 0.8);
        h.scorePlate.strokeRoundedRect(sb.x - 10, sb.y - 3, sb.width + 20, sb.height + 6, 8);
      }

      // Best score with crown + subtle glow when nearing a beat
      const bestVal = Math.max(this.best.score, h.scoreShown);
      h.bestTxt.setText("\u2654 BEST " + bestVal);

      // Combo meter
      h.meterBG.clear();
      h.meterFill.clear();
      h.meterGlow.clear();

      const mx = h.pad;
      const myTop = this.H * 0.22;
      const mw = 16;
      const mh = this.H * 0.56;

      // Track (outer shadow + inner dark)
      h.meterBG.fillStyle(0x000000, 0.55);
      h.meterBG.fillRoundedRect(mx - 3, myTop - 3, mw + 6, mh + 6, 4);
      h.meterBG.fillStyle(0x0a1428, 1);
      h.meterBG.fillRoundedRect(mx, myTop, mw, mh, 3);
      // Top tick marks to hint "drain"
      h.meterBG.fillStyle(0x1e2e48, 1);
      for (let t = 0.25; t < 1; t += 0.25) {
        h.meterBG.fillRect(mx + 2, myTop + mh * t, mw - 4, 1);
      }

      const active = this.combo.count > 0 && this.combo.timer > 0;
      if (active) {
        const frac = Phaser.Math.Clamp(this.combo.timer / (CFG.COMBO_TIMEOUT_MS / 1000), 0, 1);
        const fillH = mh * frac;
        const y0 = myTop + (mh - fillH);
        // Gradient fill from top (hot) to bottom (base) in chunky bands.
        const baseColor = tierColorFor(this.combo.count);
        const hotColor  = lerpColor(baseColor, 0xffffff, 0.35);
        const steps = 8;
        for (let i = 0; i < steps; i++) {
          const t = i / (steps - 1);
          const c = lerpColor(hotColor, baseColor, t);
          const segH = fillH / steps + 1;
          h.meterFill.fillStyle(c, 1);
          h.meterFill.fillRect(mx, y0 + segH * i, mw, segH);
        }
        // Animated shine ribbon
        const shineY = y0 + (this.time.now * 0.12 % fillH);
        h.meterFill.fillStyle(0xffffff, 0.35);
        h.meterFill.fillRect(mx, shineY, mw, 2);

        // Outer glow, pulses on qualifying jumps
        const glowA = 0.35 + 0.35 * h.meterPulse + 0.10 * Math.abs(Math.sin(this.time.now / 120));
        h.meterGlow.lineStyle(4, baseColor, Math.min(0.9, glowA));
        h.meterGlow.strokeRoundedRect(mx - 2, y0 - 2, mw + 4, fillH + 4, 4);

        // Multiplier badge
        const mult = this.combo.count;
        h.multTxt.setVisible(true);
        h.multTxt.setText("x" + mult);
        h.multTxt.setColor(tierColorCssFor(mult));
        // Bouncy increment pop
        if (mult !== h.multPrev) {
          h.multPrev = mult;
          this.tweens.add({
            targets: h.multTxt,
            scale: { from: 1.6, to: 1 },
            duration: 260, ease: "Back.Out",
          });
        }
        h.comboLabel.setVisible(true);
      } else {
        h.multTxt.setVisible(false);
        h.comboLabel.setVisible(false);
        h.multPrev = 0;
      }

      // Decay meter pulse
      if (h.meterPulse > 0) h.meterPulse = Math.max(0, h.meterPulse - 0.04);
    }

    pulseCombo() {
      if (this.hud) this.hud.meterPulse = 1;
    }

    // ---------------------------------------------------------------
    // HURRY UP flash (banner only here; alarm audio lands in Phase 7)
    // ---------------------------------------------------------------
    triggerHurryUp(strong) {
      this.hurryFlashEndsAt = this.time.now + (strong ? 1800 : 1200);
      this.hurryFlashStrong = strong;
      this.audio.hurryUp(strong);
    }

    drawHurryUp() {
      const fx = this.fxLayer;
      // Clear prior transient child
      if (this._hurryLabel) { this._hurryLabel.destroy(); this._hurryLabel = null; }
      if (this.time.now > this.hurryFlashEndsAt) return;

      const remaining = this.hurryFlashEndsAt - this.time.now;
      const pulse = 0.6 + 0.4 * Math.abs(Math.sin(this.time.now / 90));
      const color = this.hurryFlashStrong ? "#ff3a3a" : "#ffcc33";
      const text = this.hurryFlashStrong ? "HURRY UP!" : "CLIMB!";

      const label = this.add.text(this.W / 2, this.H * 0.18, text, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(Math.min(this.W, this.H) * 0.09) + "px",
        fontStyle: "bold",
        color,
        stroke: "#000",
        strokeThickness: 6,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1600).setAlpha(pulse);

      this._hurryLabel = label;

      // Edge vignette flash
      this.fxLayer.iterate(() => {});
      if (this._edgeFlash) this._edgeFlash.destroy();
      const ef = this.add.graphics().setScrollFactor(0).setDepth(1550);
      ef.fillStyle(Phaser.Display.Color.HexStringToColor(color).color, 0.18 * pulse);
      const thick = 18;
      ef.fillRect(0, 0, this.W, thick);
      ef.fillRect(0, this.H - thick, this.W, thick);
      ef.fillRect(0, 0, thick, this.H);
      ef.fillRect(this.W - thick, 0, thick, this.H);
      this._edgeFlash = ef;

      // Schedule auto-cleanup when the flash expires.
      this.time.delayedCall(Math.max(0, remaining), () => {
        if (this._edgeFlash === ef) { ef.destroy(); this._edgeFlash = null; }
      });
    }

    // ---------------------------------------------------------------
    // Game over
    // ---------------------------------------------------------------
    checkGameOver() {
      if (this.gameOver) return;
      const p = this.player;
      // Bottom of screen in world coords
      const viewBottom = this.cameraY + this.H;
      if (p.y > viewBottom + 8) {
        this.triggerGameOver();
      }
    }

    triggerGameOver() {
      this.gameOver = true;
      this.state = "gameover";
      this.audio.gameOver();
      // Persist all three bests to localStorage.
      if (this.player.highestFloor > this.best.floor) {
        this.best.floor = this.player.highestFloor;
        lsSet(LS_KEYS.bestFloor, this.best.floor);
      }
      if (this.score > this.best.score) {
        this.best.score = this.score;
        lsSet(LS_KEYS.bestScore, this.best.score);
      }
      if (this.combo.longest > this.best.longestCombo) {
        this.best.longestCombo = this.combo.longest;
        lsSet(LS_KEYS.longestCombo, this.best.longestCombo);
      }
      // Save ghost if this was a best-score run (or none stored yet).
      this.maybeSaveGhost();
      this.showGameOverScreen();
    }

    showGameOverScreen() {
      if (this.gameOverOverlay) this.gameOverOverlay.destroy();
      // New overlay = fresh button set.
      this.clearMenuHits();

      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2000);

      const bg = this.add.graphics();
      bg.fillStyle(0x000000, 0.80);
      bg.fillRect(0, 0, this.W, this.H);
      g.add(bg);

      const cx = this.W / 2;
      const S = Math.min(this.W, this.H);
      const titleSize = Math.round(S * 0.09);
      const lineSize  = Math.round(S * 0.034);
      const btnH      = Math.round(S * 0.075);
      const btnW      = Math.min(this.W * 0.74, S * 0.62);
      const gap       = Math.round(S * 0.014);

      const runLinesCount = 3;
      const bestLinesCount = 3;
      const btnCount = this.tilt && this.tilt.enabled ? 4 : 3;
      const blockH =
        titleSize * 1.1 + gap +
        lineSize * 1.25 * runLinesCount + gap +
        lineSize * 1.25 * bestLinesCount + gap * 1.5 +
        (btnH + gap) * btnCount;
      let y = Math.max(S * 0.04, (this.H - blockH) / 2);

      const title = this.add.text(cx, y, "GAME OVER", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px",
        fontStyle: "bold",
        color: "#ff5a5a",
        stroke: "#000",
        strokeThickness: 6,
      }).setOrigin(0.5, 0);
      g.add(title);
      y += titleSize * 1.1 + gap;

      const runLines = [
        `FLOOR   ${this.player.highestFloor}`,
        `SCORE   ${this.score}`,
        `COMBO   x${this.combo.longest}`,
      ];
      runLines.forEach((t) => {
        const line = this.add.text(cx, y, t, {
          fontFamily: "Courier New, monospace",
          fontSize: lineSize + "px",
          fontStyle: "bold",
          color: "#9cd9ff",
        }).setOrigin(0.5, 0);
        g.add(line);
        y += lineSize * 1.25;
      });

      y += gap;

      const bestLines = [
        `BEST FLOOR  ${this.best.floor}`,
        `BEST SCORE  ${this.best.score}`,
        `BEST COMBO  x${this.best.longestCombo}`,
      ];
      bestLines.forEach((t) => {
        const line = this.add.text(cx, y, t, {
          fontFamily: "Courier New, monospace",
          fontSize: Math.round(lineSize * 0.88) + "px",
          color: "#ffdf3c",
        }).setOrigin(0.5, 0);
        g.add(line);
        y += lineSize * 1.25;
      });

      y += gap * 1.5;

      // Visual button. Interactivity comes from menuHits + the scene-level
      // pointerdown handler, which is reliable on iOS where zone hit-boxes
      // have been flaky.
      const addBtn = (yy, label, fill, stroke, onPress) => {
        const gb = this.add.graphics();
        gb.fillStyle(fill, 1);
        gb.fillRoundedRect(cx - btnW / 2, yy, btnW, btnH, 12);
        gb.lineStyle(3, stroke, 1);
        gb.strokeRoundedRect(cx - btnW / 2, yy, btnW, btnH, 12);
        g.add(gb);
        const lbl = this.add.text(cx, yy + btnH / 2, label, {
          fontFamily: "Courier New, monospace",
          fontSize: Math.round(lineSize * 1.15) + "px",
          fontStyle: "bold",
          color: "#fff",
          stroke: "#000",
          strokeThickness: 2,
        }).setOrigin(0.5);
        g.add(lbl);
        this.addMenuHit(cx - btnW / 2, yy, btnW, btnH, onPress, label);
      };

      addBtn(y, "RESTART",   0x2e84d6, 0x9cd9ff, () => this.restartRun());
      y += btnH + gap;
      addBtn(y, "SHARE",     0x444b66, 0xffdf3c, () => this.shareScore());
      y += btnH + gap;
      addBtn(y, "CHARACTER", 0x1a1a24, 0xffdf3c, () => this.openCharacterSelect());

      if (this.tilt && this.tilt.enabled) {
        y += btnH + gap;
        const tiltLabel = "FLIP TILT: " + (this.tilt.invert ? "ON" : "OFF");
        addBtn(y, tiltLabel, 0x223344, 0x9cd9ff, () => {
          this.tilt.invert = !this.tilt.invert;
          lsSet(LS_KEYS.tiltInvert, this.tilt.invert ? "1" : "0");
          this.showGameOverScreen();
        });
      }

      // Keyboard fallback - restart on space/enter when game-over.
      this.input.keyboard.once("keydown-SPACE", () => {
        if (this.state === "gameover") this.restartRun();
      });
      this.input.keyboard.once("keydown-ENTER", () => {
        if (this.state === "gameover") this.restartRun();
      });

      this.gameOverOverlay = g;
    }

    openCharacterSelect() {
      // Toggle off if already open
      if (this.characterSelectOverlay) {
        this.closeCharacterSelect();
        return;
      }
      // Stash the state we're suspending so we can return to the right screen.
      this._charSelectReturnState = this.state;
      this.state = "charselect";
      this.clearMenuHits();

      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2200);

      const bg = this.add.graphics();
      bg.fillStyle(0x000000, 0.90);
      bg.fillRect(0, 0, this.W, this.H);
      g.add(bg);

      const S = Math.min(this.W, this.H);
      const titleSize = Math.round(S * 0.075);

      const title = this.add.text(this.W / 2, S * 0.04, "CHOOSE YOUR CLIMBER", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0.5, 0);
      g.add(title);

      const gridTop = S * 0.04 + titleSize * 1.4;
      const gridBottom = this.H - S * 0.11;
      // Auto pick column count from aspect ratio.
      const cols = this.W / this.H > 1.2 ? 3 : 2;
      const rows = Math.ceil(CHARACTERS.length / cols);
      const gridW = Math.min(this.W - S * 0.08, S * 1.3);
      const cellW = gridW / cols;
      const cellH = (gridBottom - gridTop) / rows;
      const gridX = (this.W - gridW) / 2;

      const nameSize = Math.round(Math.min(cellH * 0.15, S * 0.032));
      const scale = Math.min(cellW, cellH) / 60;

      CHARACTERS.forEach((c, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const cx = gridX + cellW * col + cellW / 2;
        const cy = gridTop + cellH * row + cellH / 2;

        const selected = c.id === this.characterId;
        const cellX = cx - cellW * 0.45;
        const cellY = cy - cellH * 0.45;
        const cellBG = this.add.graphics();
        cellBG.fillStyle(selected ? 0x223b66 : 0x12182a, 0.95);
        cellBG.fillRoundedRect(cellX, cellY, cellW * 0.90, cellH * 0.90, 12);
        cellBG.lineStyle(selected ? 4 : 2, selected ? 0xffdf3c : 0x9cd9ff, 1);
        cellBG.strokeRoundedRect(cellX, cellY, cellW * 0.90, cellH * 0.90, 12);
        g.add(cellBG);

        const preview = this.drawCharacterPreview(c.id, cx, cy - nameSize * 1.1, scale);
        g.add(preview);

        const lbl = this.add.text(cx, cy + cellH * 0.30, c.name, {
          fontFamily: "Courier New, monospace",
          fontSize: nameSize + "px", fontStyle: "bold",
          color: selected ? "#ffdf3c" : "#ffffff",
          stroke: "#000", strokeThickness: 3,
          align: "center",
        }).setOrigin(0.5);
        g.add(lbl);

        this.addMenuHit(cellX, cellY, cellW * 0.90, cellH * 0.90, () => {
          this.characterId = c.id;
          try { localStorage.setItem(LS_KEYS.character, c.id); } catch (_) {}
          this.characterDrawer = this[c.drawFn];
          // Audio confirm
          if (this.audio) this.audio._blip({ type: "triangle", f0: 880, dur: 0.1, vol: 0.2 });
          this.closeCharacterSelect();
        }, "CHAR:" + c.id);
      });

      // Close button
      const closeBtnW = Math.min(S * 0.40, this.W * 0.5);
      const closeBtnH = Math.round(S * 0.07);
      const closeBtnX = this.W / 2 - closeBtnW / 2;
      const closeBtnY = this.H - S * 0.09;
      const closeBG = this.add.graphics();
      closeBG.fillStyle(0x444b66, 1);
      closeBG.fillRoundedRect(closeBtnX, closeBtnY, closeBtnW, closeBtnH, 10);
      closeBG.lineStyle(3, 0x9cd9ff, 1);
      closeBG.strokeRoundedRect(closeBtnX, closeBtnY, closeBtnW, closeBtnH, 10);
      g.add(closeBG);
      const closeLabel = this.add.text(this.W / 2, closeBtnY + closeBtnH / 2, "CLOSE", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.035) + "px", fontStyle: "bold",
        color: "#fff", stroke: "#000", strokeThickness: 2,
      }).setOrigin(0.5);
      g.add(closeLabel);
      this.addMenuHit(closeBtnX, closeBtnY, closeBtnW, closeBtnH,
        () => this.closeCharacterSelect(), "CLOSE");

      this.characterSelectOverlay = g;
    }

    closeCharacterSelect() {
      if (this.characterSelectOverlay) {
        this.characterSelectOverlay.destroy();
        this.characterSelectOverlay = null;
      }
      this.clearMenuHits();
      // Return to the previous state and redraw its buttons.
      const prev = this._charSelectReturnState || "title";
      this._charSelectReturnState = null;
      if (prev === "gameover") { this.state = "gameover"; this.showGameOverScreen(); }
      else if (prev === "paused") { this.state = "paused"; this.showPauseMenu(); }
      else if (prev === "title")   { this.state = "title"; this.showTitleScreen(); }
      else                         { this.state = prev; }
    }

    drawCharacterPreview(id, x, y, scale) {
      const entry = CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
      const fn = this[entry.drawFn] || this.drawCharClimber;
      const g = this.add.graphics();
      g.clear();
      fn.call(this, g, {
        w: CFG.CHAR_W, h: CFG.CHAR_H, lean: 0, airborne: false,
        speedFrac: 0, runPhase: 0, now: this.time.now, facing: 1,
      });
      g.x = x; g.y = y;
      g.scaleX = g.scaleY = scale;
      return g;
    }

    restartRun() {
      if (this._restarting) return;
      this._restarting = true;

      // Kill tweens + timers BEFORE destroy so callbacks don't touch freed
      // objects. killAll hits scene-wide - that's what we want mid-restart.
      this.tweens.killAll();
      if (this.time && this.time.removeAllEvents) this.time.removeAllEvents();

      // Tear down every overlay we may have left up.
      if (this.gameOverOverlay)        { this.gameOverOverlay.destroy();        this.gameOverOverlay = null; }
      if (this.characterSelectOverlay) { this.characterSelectOverlay.destroy(); this.characterSelectOverlay = null; }
      if (this.pauseOverlay)           { this.pauseOverlay.destroy();           this.pauseOverlay = null; }
      if (this.countdownOverlay)       { this.countdownOverlay.destroy();       this.countdownOverlay = null; }
      if (this._hurryLabel)            { this._hurryLabel.destroy();            this._hurryLabel = null; }
      if (this._edgeFlash)             { this._edgeFlash.destroy();             this._edgeFlash = null; }
      if (this._shareToast)            { this._shareToast.destroy();            this._shareToast = null; }

      this.clearMenuHits();

      this.floorsGfx.clear();
      this.playerGfx.clear();
      this.wallsGfx.clear();
      this.particlesGfx.clear();
      this.ghostGfx.clear();

      this.touchLeft = this.touchRight = false;
      this.jumpBufferUntil = 0;

      if (this.tiltBtn && this.tilt && this.tilt.enabled) {
        this.tiltBtn.style.display = "none";
      }

      this.resetRun();
      this.state = "playing";
      if (this.hud) this.hud.container.setVisible(true);
      this._restarting = false;
    }

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    drawFloors() {
      const g = this.floorsGfx;
      g.clear();
      const viewTop = this.cameraY - 20;
      const viewBottom = this.cameraY + this.H + 20;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < viewTop || f.y > viewBottom) continue;
        const theme = this.floorTheme(f.n);
        // Shadow strip under the floor
        g.fillStyle(0x000000, 0.35);
        g.fillRect(f.x + 2, f.y + f.h, f.w, 4);
        // Side color (thickness)
        g.fillStyle(theme.side, 1);
        g.fillRect(f.x, f.y, f.w, f.h);
        // Top highlight
        g.fillStyle(theme.top, 1);
        g.fillRect(f.x, f.y, f.w, 3);
        // Glint ticks
        g.fillStyle(theme.accent, 0.75);
        for (let t = 0; t < f.w; t += 24) {
          g.fillRect(f.x + t + 6, f.y + 1, 4, 1);
        }
        // Floor number etched on every 5th floor
        if (f.n > 0 && f.n % 5 === 0 && f.w > 70) {
          // Small tick on left end
          g.fillStyle(theme.wall, 0.55);
          g.fillRect(f.x + 4, f.y + 5, 3, 3);
        }
      }
    }

    drawWalls() {
      const g = this.wallsGfx;
      g.clear();
      const theme = this.currentTheme();
      const top = this.cameraY - 20;
      const h = this.H + 40;

      // Left wall
      g.fillStyle(theme.wall, 1);
      g.fillRect(0, top, CFG.WALL_THICKNESS, h);
      // Right wall
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, CFG.WALL_THICKNESS, h);

      // Inner edge highlight
      g.fillStyle(theme.accent, 0.10);
      g.fillRect(CFG.WALL_THICKNESS - 2, top, 2, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, 2, h);

      // Brick hatching
      g.fillStyle(0x000000, 0.28);
      const startRow = Math.floor(top / 16) * 16;
      for (let y = startRow; y < top + h; y += 16) {
        g.fillRect(0, y, CFG.WALL_THICKNESS, 1);
        g.fillRect(this.W - CFG.WALL_THICKNESS, y, CFG.WALL_THICKNESS, 1);
      }
      // Vertical mortar line
      g.fillStyle(0x000000, 0.18);
      g.fillRect(CFG.WALL_THICKNESS / 2, top, 1, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS / 2, top, 1, h);
    }

    // ---------------------------------------------------------------
    // Title screen
    // ---------------------------------------------------------------
    showTitleScreen() {
      if (this.titleOverlay) this.titleOverlay.destroy();
      if (this.hud) this.hud.container.setVisible(false);
      this.clearMenuHits();

      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2400);

      const dim = this.add.graphics();
      dim.fillStyle(0x000000, 0.42);
      dim.fillRect(0, 0, this.W, this.H);
      g.add(dim);

      const cx = this.W / 2;
      const S = Math.min(this.W, this.H);
      const titleSize = Math.round(S * 0.16);
      const subSize   = Math.round(S * 0.045);
      const hintSize  = Math.round(S * 0.028);

      const logoY = S * 0.16;
      const logoShadow = this.add.text(cx + 4, logoY + 4, "FROSTSPIRE", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px", fontStyle: "bold",
        color: "#000000",
      }).setOrigin(0.5).setAlpha(0.7);
      g.add(logoShadow);

      const logo = this.add.text(cx, logoY, "FROSTSPIRE", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#0b2848", strokeThickness: 8,
      }).setOrigin(0.5);
      g.add(logo);

      const sub = this.add.text(cx, logoY + titleSize * 0.55, "A VERTICAL CLIMB", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(subSize * 0.75) + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 3,
      }).setOrigin(0.5);
      g.add(sub);

      // Character preview centered, tappable to open select.
      const previewY = this.H * 0.44;
      const preview = this.drawCharacterPreview(this.characterId || "climber",
        cx, previewY, Math.min(this.W, this.H) * 0.09);
      g.add(preview);
      this._titlePreview = preview;
      this._titlePreviewId = this.characterId || "climber";

      // Selected-character label just below the preview.
      const charEntry = CHARACTERS.find(c => c.id === (this.characterId || "climber")) || CHARACTERS[0];
      const selLbl = this.add.text(cx, previewY + S * 0.08, "SELECTED: " + charEntry.name, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(subSize * 0.7) + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 3,
      }).setOrigin(0.5);
      g.add(selLbl);

      // BIG START GAME button (primary call-to-action).
      const startBtnW = Math.min(this.W * 0.80, S * 0.72);
      const startBtnH = Math.round(S * 0.11);
      const startBtnY = this.H - S * 0.30 - startBtnH;

      const startBG = this.add.graphics();
      startBG.fillStyle(0x2e84d6, 1);
      startBG.fillRoundedRect(cx - startBtnW / 2, startBtnY, startBtnW, startBtnH, 14);
      startBG.lineStyle(4, 0xffdf3c, 1);
      startBG.strokeRoundedRect(cx - startBtnW / 2, startBtnY, startBtnW, startBtnH, 14);
      g.add(startBG);

      const startLbl = this.add.text(cx, startBtnY + startBtnH / 2, "\u25B6  START GAME", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.055) + "px",
        fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0.5);
      g.add(startLbl);

      // Pulse the button so the user sees it as the target.
      this._titleTween = this.tweens.add({
        targets: [startBG, startLbl],
        alpha: { from: 1, to: 0.72 },
        duration: 700, yoyo: true, repeat: -1, ease: "Sine.InOut",
      });

      this.addMenuHit(cx - startBtnW / 2, startBtnY, startBtnW, startBtnH,
        () => this.startFromTitle(), "START");

      // CHARACTER button - made prominent with an arrow to the preview.
      const chrBtnW = Math.min(this.W * 0.80, S * 0.72);
      const chrBtnH = Math.round(S * 0.07);
      const chrBtnY = startBtnY + startBtnH + S * 0.02;

      const chrBG = this.add.graphics();
      chrBG.fillStyle(0x1a1a24, 0.95);
      chrBG.fillRoundedRect(cx - chrBtnW / 2, chrBtnY, chrBtnW, chrBtnH, 10);
      chrBG.lineStyle(2, 0xffdf3c, 1);
      chrBG.strokeRoundedRect(cx - chrBtnW / 2, chrBtnY, chrBtnW, chrBtnH, 10);
      g.add(chrBG);

      const chrLbl = this.add.text(cx, chrBtnY + chrBtnH / 2, "CHOOSE CHARACTER \u25B6", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.033) + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 3,
      }).setOrigin(0.5);
      g.add(chrLbl);
      this.addMenuHit(cx - chrBtnW / 2, chrBtnY, chrBtnW, chrBtnH,
        () => this.openCharacterSelect(), "CHARACTER");

      // Also let the user tap the preview itself to open select.
      const previewSize = Math.min(this.W, this.H) * 0.25;
      this.addMenuHit(cx - previewSize / 2, previewY - previewSize / 2,
        previewSize, previewSize,
        () => this.openCharacterSelect(), "PREVIEW");

      // Bottom-line hints.
      const hint = this.add.text(cx, this.H - S * 0.05,
        "DESKTOP: \u2190 \u2192 / A D  +  SPACE     MOBILE: TILT  +  TAP", {
        fontFamily: "Courier New, monospace",
        fontSize: hintSize + "px",
        color: "#9cd9ff", stroke: "#000", strokeThickness: 3,
        align: "center",
      }).setOrigin(0.5);
      g.add(hint);

      // Keyboard: space/enter/up also begins.
      this._titleKeyHandler = () => this.startFromTitle();
      this.input.keyboard.once("keydown-SPACE", this._titleKeyHandler);
      this.input.keyboard.once("keydown-ENTER", this._titleKeyHandler);
      this.input.keyboard.once("keydown-UP",    this._titleKeyHandler);

      this.titleOverlay = g;
    }

    animateTitleScreen() {
      // Refresh character preview if selection changed via overlay.
      if (this._titlePreviewId !== (this.characterId || "climber")) {
        if (this._titlePreview) { this._titlePreview.destroy(); this._titlePreview = null; }
        const cx = this.W / 2;
        const previewY = this.H * 0.52;
        const preview = this.drawCharacterPreview(this.characterId || "climber",
          cx, previewY, Math.min(this.W, this.H) * 0.07);
        if (this.titleOverlay) this.titleOverlay.add(preview);
        this._titlePreview = preview;
        this._titlePreviewId = this.characterId || "climber";
      }
    }

    startFromTitle() {
      if (this.state !== "title") return;
      if (this._titleTween) { this._titleTween.stop(); this._titleTween = null; }
      if (this.titleOverlay) { this.titleOverlay.destroy(); this.titleOverlay = null; }
      this._titlePreview = null;
      this.clearMenuHits();
      this.restartRun();    // sets state = "playing"
      this.runStartTime = this.time.now;
      this.hintUntil = this.time.now + 5500;
      if (this.audio) this.audio.init(); // unlock audio on the gesture
    }

    // ---------------------------------------------------------------
    // Pause menu
    // ---------------------------------------------------------------
    togglePause() {
      if (this.state === "playing") this.showPauseMenu();
      else if (this.state === "paused") this.hidePauseMenu();
    }
    showPauseMenu() {
      this.state = "paused";
      if (this.pauseOverlay) this.pauseOverlay.destroy();
      this.clearMenuHits();

      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2300);
      const bg = this.add.graphics();
      bg.fillStyle(0x000000, 0.72);
      bg.fillRect(0, 0, this.W, this.H);
      g.add(bg);

      const cx = this.W / 2;
      const S = Math.min(this.W, this.H);
      const titleSize = Math.round(S * 0.11);
      const btnLblSize = Math.round(S * 0.040);
      const btnH = Math.round(S * 0.075);
      const btnW = Math.min(this.W * 0.74, S * 0.65);
      const gap = Math.round(S * 0.014);

      const btnCount = 5;
      const totalH = titleSize * 1.2 + gap + (btnH + gap) * btnCount;
      let y = Math.max(S * 0.04, (this.H - totalH) / 2);

      const title = this.add.text(cx, y, "PAUSED", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#000", strokeThickness: 6,
      }).setOrigin(0.5, 0);
      g.add(title);
      y += titleSize * 1.2 + gap;

      const makeBtn = (label, onPress, fill, stroke) => {
        const gb = this.add.graphics();
        gb.fillStyle(fill, 1);
        gb.fillRoundedRect(cx - btnW / 2, y, btnW, btnH, 12);
        gb.lineStyle(3, stroke, 1);
        gb.strokeRoundedRect(cx - btnW / 2, y, btnW, btnH, 12);
        g.add(gb);
        const lbl = this.add.text(cx, y + btnH / 2, label, {
          fontFamily: "Courier New, monospace",
          fontSize: btnLblSize + "px", fontStyle: "bold",
          color: "#fff", stroke: "#000", strokeThickness: 2,
        }).setOrigin(0.5);
        g.add(lbl);
        this.addMenuHit(cx - btnW / 2, y, btnW, btnH, onPress, label);
        y += btnH + gap;
      };

      makeBtn("\u25B6  RESUME",     () => this.requestResume(),                     0x2e84d6, 0xffdf3c);
      makeBtn("CHARACTER",          () => this.openCharacterSelect(),              0x1a1a24, 0xffdf3c);
      makeBtn(this.audio.muted ? "UNMUTE" : "MUTE",
                                    () => { this.audio.toggleMute(); this.showPauseMenu(); }, 0x223344, 0x9cd9ff);
      makeBtn("RESTART",            () => { this.hidePauseMenu(true); this.restartRun(); }, 0x664434, 0xffdf3c);
      makeBtn("HOME",               () => { this.hidePauseMenu(true); this.state = "title"; this.showTitleScreen(); }, 0x444b66, 0xff9a9a);

      this.pauseOverlay = g;
    }

    hidePauseMenu(keepState) {
      if (this.pauseOverlay) { this.pauseOverlay.destroy(); this.pauseOverlay = null; }
      this.clearMenuHits();
      if (!keepState) this.state = "playing";
    }

    // ---- 3-second resume countdown ----
    requestResume() {
      this.hidePauseMenu(true);      // keep state="paused" for safety
      this.showResumeCountdown();
    }

    showResumeCountdown() {
      if (this.countdownOverlay) this.countdownOverlay.destroy();
      this.clearMenuHits();
      this.state = "countdown";

      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2350);
      const bg = this.add.graphics();
      bg.fillStyle(0x000000, 0.55);
      bg.fillRect(0, 0, this.W, this.H);
      g.add(bg);

      const cx = this.W / 2, cy = this.H / 2;
      const S = Math.min(this.W, this.H);

      const bigLabel = this.add.text(cx, cy, "3", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.35) + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 10,
      }).setOrigin(0.5);
      g.add(bigLabel);

      const hint = this.add.text(cx, cy + S * 0.22, "GET READY", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.05) + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 4,
      }).setOrigin(0.5);
      g.add(hint);

      this.countdownOverlay = g;
      this.countdownBigLabel = bigLabel;

      // Flush stale input so the player doesn't jump immediately.
      this.jumpBufferUntil = 0;
      this.touchLeft = this.touchRight = false;

      const beep = (freq) => {
        if (this.audio) this.audio._blip({ type: "triangle", f0: freq, dur: 0.12, vol: 0.22 });
      };
      beep(660);

      const tick = (n) => {
        if (!this.countdownOverlay) return;
        bigLabel.setText(String(n));
        bigLabel.setScale(1.5);
        bigLabel.setAlpha(1);
        this.tweens.add({
          targets: bigLabel, scale: 1.0, alpha: 0.8,
          duration: 800, ease: "Sine.Out",
        });
      };

      this.time.delayedCall(1000, () => { if (this.state === "countdown") { tick(2); beep(784); } });
      this.time.delayedCall(2000, () => { if (this.state === "countdown") { tick(1); beep(880); } });
      this.time.delayedCall(3000, () => {
        if (this.state !== "countdown") return;
        bigLabel.setText("GO!");
        bigLabel.setScale(1.2);
        bigLabel.setColor("#9cd9ff");
        hint.setVisible(false);
        beep(1320);
        // Clear any stale input buffered during the countdown one more time.
        this.jumpBufferUntil = 0;
        this.touchLeft = this.touchRight = false;
        this.time.delayedCall(400, () => {
          if (this.countdownOverlay) { this.countdownOverlay.destroy(); this.countdownOverlay = null; }
          this.state = "playing";
        });
      });
    }

    // ---------------------------------------------------------------
    // First-run hint
    // ---------------------------------------------------------------
    updateHint() {
      const now = this.time.now;
      if (now > this.hintUntil) {
        if (this.hintLabel) { this.hintLabel.destroy(); this.hintLabel = null; }
        return;
      }
      if (!this.hintLabel) {
        const S = Math.min(this.W, this.H);
        const text = "RUN FAST TO JUMP HIGHER.   HIT WALLS + REVERSE TO BOUNCE.";
        this.hintLabel = this.add.text(this.W / 2, this.H - S * 0.05, text, {
          fontFamily: "Courier New, monospace",
          fontSize: Math.round(S * 0.026) + "px",
          fontStyle: "bold",
          color: "#9cd9ff", stroke: "#000", strokeThickness: 3,
          align: "center",
        }).setOrigin(0.5).setScrollFactor(0).setDepth(1200);
      }
      // Fade last 0.8s
      const remaining = this.hintUntil - now;
      if (remaining < 800) {
        this.hintLabel.setAlpha(remaining / 800);
      }
    }

    // ---------------------------------------------------------------
    // Camera shake (called on high-impact landings)
    // ---------------------------------------------------------------
    shakeCamera(intensity, ms) {
      this.cameras.main.shake(ms || 140, intensity || 0.004);
    }

    update(_time, delta) {
      // Title: animate backdrop only (menu is interactive via menuHits).
      if (this.state === "title") {
        this.drawBackground();
        this.animateTitleScreen();
        return;
      }
      // Paused / character select / countdown / gameover all freeze the
      // game world but keep the current frame rendered so the overlay
      // reads like a modal, not a cold blank.
      if (this.state === "paused"    ||
          this.state === "charselect" ||
          this.state === "countdown" ||
          this.state === "gameover") {
        this.drawBackground();
        this.drawWalls();
        this.drawFloors();
        this.drawGhost();
        this.drawParticles();
        this.drawPlayer();
        if (this.state !== "gameover") this.drawHUD();
        return;
      }
      // Playing
      const dt = Math.min(delta / 1000, 1 / 30);
      this.readInput();
      this.updatePhysics(dt);
      this.updateCombo(dt);
      this.updateParticles(dt);
      this.updateGhost(dt);
      this.updateCamera(dt);
      this.drawBackground();
      this.drawWalls();
      this.drawFloors();
      this.drawGhost();
      this.drawParticles();
      this.drawPlayer();
      this.drawHurryUp();
      this.drawHUD();
      this.updateHint();
      this.checkGameOver();
    }
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#05080f",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: window.innerWidth,
      height: window.innerHeight,
    },
    render: {
      pixelArt: true,
      antialias: false,
      roundPixels: true,
    },
    scene: [GameScene],
  };

  // eslint-disable-next-line no-unused-vars
  const game = new Phaser.Game(config);
  </script>
</body>
</html>

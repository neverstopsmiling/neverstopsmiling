<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Frostspire</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05080f;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #fff;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    canvas { display: block; }
    #tilt-enable {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 22px;
      background: rgba(20, 90, 180, 0.92);
      color: #fff;
      border: 2px solid #9cd9ff;
      border-radius: 10px;
      font: 700 14px/1 "Courier New", monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: none;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    #boot-msg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9cd9ff;
      font: 700 18px/1.5 "Courier New", monospace;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="tilt-enable" type="button">Enable Tilt Controls</button>
  <div id="boot-msg">LOADING FROSTSPIRE</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script>
  "use strict";

  /* =========================================================================
   * FROSTSPIRE - an Icy Tower-inspired vertical climber
   * Single-file browser game built with Phaser 3.
   * ========================================================================= */

  // ------------------------------------------------------------------
  // CFG - all gameplay tuning in one place
  // ------------------------------------------------------------------
  const CFG = {
    // Horizontal motion
    MAX_H_SPEED: 400,           // px/s at full sprint
    GROUND_ACCEL: 1000,         // 400 / 0.4s ramp to max
    GROUND_FRICTION: 1333,      // 400 / 0.3s slide to stop
    AIR_ACCEL: 600,             // 60% of ground accel

    // Vertical / jump
    GRAVITY: 800,               // px/s^2 (matches spec 0.8 scaled)
    BASE_JUMP: 300,             // jump Vy at standstill -> ~1 floor
    BONUS_JUMP: 350,            // added at full sprint -> ~5 floors

    // Floors
    FLOOR_HEIGHT: 50,           // vertical spacing between floors
    FLOOR_THICKNESS: 10,        // visual thickness
    FLOOR_MIN_WIDTH_PX: 60,
    FLOOR_WIDTH_JITTER: 0.15,   // +/- 15%

    // Walls
    WALL_THICKNESS: 36,
    WALL_BOUNCE_WINDOW_MS: 100, // time to press opposite dir for full preserve

    // Character
    CHAR_W: 22,
    CHAR_H: 32,

    // Combo
    COMBO_MIN_FLOORS: 2,
    COMBO_TIMEOUT_MS: 3000,

    // Scroll escalation
    SCROLL_START_FLOOR: 5,
    SCROLL_INITIAL_SPEED: 30,
    SCROLL_INCREMENT: 20,
    SCROLL_INCREMENT_MS: 30000,

    // Scoring
    POINTS_PER_FLOOR: 10,

    // Ghost recorder
    GHOST_SAMPLE_MS: 100,

    // Milestones
    MILESTONES: [100, 250, 500, 1000],
  };

  const LS_KEYS = {
    bestScore:   "frostspire.bestScore",
    bestFloor:   "frostspire.bestFloor",
    longestCombo:"frostspire.longestCombo",
    ghost:       "frostspire.ghost",
  };

  function lsGetInt(key, fallback) {
    try {
      const v = parseInt(localStorage.getItem(key), 10);
      return Number.isFinite(v) ? v : fallback;
    } catch (_) { return fallback; }
  }
  function lsGetJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val)); }
    catch (_) {}
  }

  // Linearly blend two 0xRRGGBB colors at t in [0..1]
  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    const r = Math.round(ar + (br - ar) * t) & 0xff;
    const g = Math.round(ag + (bg - ag) * t) & 0xff;
    const bl= Math.round(ab + (bb - ab) * t) & 0xff;
    return (r << 16) | (g << 8) | bl;
  }

  // ------------------------------------------------------------------
  // GameScene - will grow in subsequent phases
  // ------------------------------------------------------------------
  class GameScene extends Phaser.Scene {
    constructor() { super("game"); }

    create() {
      this.W = this.scale.gameSize.width;
      this.H = this.scale.gameSize.height;

      // Persistent bests (loaded once at boot, updated during play)
      this.best = {
        score:        lsGetInt(LS_KEYS.bestScore, 0),
        floor:        lsGetInt(LS_KEYS.bestFloor, 0),
        longestCombo: lsGetInt(LS_KEYS.longestCombo, 0),
        ghost:        lsGetJSON(LS_KEYS.ghost, null),
      };

      // Layer setup (deeper = foreground). Game-world layers scroll with camera.
      this.bgGfx       = this.add.graphics().setDepth(-10);
      this.wallsGfx    = this.add.graphics().setDepth(-5);
      this.floorsGfx   = this.add.graphics().setDepth(0);
      this.particlesGfx= this.add.graphics().setDepth(5);
      this.ghostGfx    = this.add.graphics().setDepth(8).setAlpha(0.35);
      this.playerGfx   = this.add.graphics().setDepth(10);

      // UI layer (stays put on screen)
      this.uiLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1000);
      this.fxLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1500);

      this.cameras.main.setBackgroundColor("#05080f");

      this.drawBackground();

      this.setupInput();
      this.resetRun();

      this.scale.on("resize", this.onResize, this);

      // Hide boot overlay now that Phaser is alive.
      const boot = document.getElementById("boot-msg");
      if (boot) boot.style.display = "none";
    }

    onResize(gameSize) {
      this.W = gameSize.width;
      this.H = gameSize.height;
      this.drawBackground();
      // Don't rebuild floors on resize; widths were set at spawn time.
      // Floor-0 (ground) is redrawn to cover full screen width.
      if (this.floors && this.floors[0]) {
        this.floors[0].x = 0;
        this.floors[0].w = this.W;
      }
      // Rebuild HUD so it re-anchors to the new viewport.
      if (this.hud) this.buildHUD();
    }

    // Themed vertical-gradient backdrop + parallax stars/snow.
    drawBackground() {
      const g = this.bgGfx;
      g.clear();
      const theme = this.currentTheme ? this.currentTheme() : this.floorTheme(0);

      // Draw a chunky-pixel vertical gradient between bg1 and bg2.
      const steps = 10;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const c = lerpColor(theme.bg1, theme.bg2, t);
        g.fillStyle(c, 1);
        g.fillRect(0, (this.H * i) / steps, this.W, this.H / steps + 1);
      }

      // Subtle parallax "stars" / ice motes - deterministic per band
      const band = this.player ? Math.floor(this.player.highestFloor / 100) : 0;
      const seed = 1337 + band * 7;
      const count = 40;
      g.fillStyle(theme.accent, 0.35);
      for (let i = 0; i < count; i++) {
        const r = ((seed * (i + 1)) * 9301 + 49297) % 233280;
        const x = (r % this.W);
        const y = ((r >> 3) % this.H);
        const sz = 1 + (i % 3);
        g.fillRect(x, y, sz, sz);
      }
    }

    // ---------------------------------------------------------------
    // Input (keyboard for Phase 2; tilt/touch wired in Phase 8)
    // ---------------------------------------------------------------
    setupInput() {
      this.keys = this.input.keyboard.addKeys({
        left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        up:    Phaser.Input.Keyboard.KeyCodes.UP,
        a:     Phaser.Input.Keyboard.KeyCodes.A,
        d:     Phaser.Input.Keyboard.KeyCodes.D,
        w:     Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      // Prevent arrow / space from scrolling the page.
      this.input.keyboard.addCapture("LEFT,RIGHT,UP,DOWN,SPACE");

      // Axis buffer gets populated from keyboard / tilt / touch.
      this.axisX = 0;        // -1, 0, +1 (or analog in [-1..1] from tilt)
      this.jumpPressed = false;
    }

    readInput() {
      const k = this.keys;
      let ax = 0;
      if (k.left.isDown  || k.a.isDown) ax -= 1;
      if (k.right.isDown || k.d.isDown) ax += 1;
      this.axisX = ax;

      // Edge-triggered jump: true for one frame when any jump key goes down
      this.jumpPressed =
        Phaser.Input.Keyboard.JustDown(k.up) ||
        Phaser.Input.Keyboard.JustDown(k.w)  ||
        Phaser.Input.Keyboard.JustDown(k.space);
    }

    // ---------------------------------------------------------------
    // Run lifecycle
    // ---------------------------------------------------------------
    resetRun() {
      // Floor 0 top surface lives here in world coords.
      this.FLOOR0_Y = this.H - 80;

      this.player = {
        x: this.W / 2,
        y: this.FLOOR0_Y,       // feet y (world coords)
        prevY: this.FLOOR0_Y,
        vx: 0,
        vy: 0,
        w: CFG.CHAR_W,
        h: CFG.CHAR_H,
        onGround: true,
        facing: 1,
        runPhase: 0,
        crouchT: 0,
        // Wall bounce bookkeeping
        wallHitTime: 0,          // performance.now() of last wall hit, 0 if none pending
        wallHitSide: 0,          // -1 = hit left wall, +1 = hit right wall
        wallBounceArmed: false,  // true between hit and window expiry
        // Floor tracking
        currentFloor: 0,
        highestFloor: 0,
        jumpStartFloor: 0,
      };

      // Floors are authored in world-space; spawn them once.
      this.floors = [];
      this.maxSpawnedFloor = -1;
      this.spawnFloor(0); // ground
      for (let i = 1; i <= 60; i++) this.spawnFloor(i);

      // Camera starts at 0 (top of screen = world y 0). Upward-only follow.
      this.cameras.main.setScroll(0, 0);
      this.cameraY = 0;

      // Auto-scroll state
      this.scrollActive = false;
      this.scrollSpeed  = 0;              // px/s (camera moves upward)
      this.scrollStartedAt = 0;
      this.nextSpeedupAt = 0;

      // Hurry-up & flash FX
      this.hurryFlashEndsAt = 0;
      this.hurryFlashStrong = false;

      // Run / game-over state
      this.gameOver = false;
      this.gameOverOverlay = null;
      this.runStartTime = this.time.now;

      // Combo + score
      this.score = 0;
      this.combo = {
        count: 0,
        timer: 0,                // seconds remaining (0 = inactive)
        longest: 0,              // longest combo this run
      };
      this.rewardPopups = [];    // active reward text objects

      // Particles
      this.particles = [];       // [{x,y,vx,vy,life,maxLife,size,color}]

      // Milestones already announced (so each only fires once)
      this.milestonesFired = {};

      // Build / refresh HUD
      this.buildHUD();
    }

    // ---------------------------------------------------------------
    // Floor generation
    // ---------------------------------------------------------------
    floorY(n) { return this.FLOOR0_Y - n * CFG.FLOOR_HEIGHT; }

    // Width fraction curve based on spec: 70% base at floor 0,
    // drifting to ~40% at floor 200, ~25% at floor 500+.
    floorWidthFrac(n) {
      if (n <= 0) return 1.0;
      if (n < 200) return 0.70 - 0.30 * (n / 200);
      if (n < 500) return 0.40 - 0.15 * ((n - 200) / 300);
      return Math.max(0.15, 0.25 - (n - 500) * 0.0002);
    }

    spawnFloor(n) {
      if (n <= this.maxSpawnedFloor) return;
      // Fill any gaps (shouldn't happen in practice)
      for (let k = this.maxSpawnedFloor + 1; k <= n; k++) this._createFloor(k);
    }

    _createFloor(n) {
      const y = this.floorY(n);
      let f;
      if (n === 0) {
        // Ground - full width
        f = { n: 0, x: 0, y, w: this.W, h: CFG.FLOOR_THICKNESS, ground: true };
      } else {
        const frac = this.floorWidthFrac(n);
        const jitter = 1 + (Math.random() * 2 - 1) * CFG.FLOOR_WIDTH_JITTER;
        const availW = this.W - CFG.WALL_THICKNESS * 2;
        let w = Math.max(CFG.FLOOR_MIN_WIDTH_PX, availW * frac * jitter);
        w = Math.min(w, availW - 10);
        const slack = availW - w;
        const x = CFG.WALL_THICKNESS + Math.random() * slack;
        f = { n, x, y, w, h: CFG.FLOOR_THICKNESS, ground: false };
      }
      this.floors.push(f);
      this.maxSpawnedFloor = n;
    }

    // Full theme palette per 100-floor band.
    // top/side = floor surfaces, wall = side walls, bg1/bg2 = sky gradient,
    // accent = particles, glintA/B = wall hatching tones.
    floorTheme(n) {
      if (n < 100) return {
        top: 0x9cd9ff, side: 0x4aa8e0, wall: 0x2a5c8c,
        bg1: 0x0b1d3a, bg2: 0x1a3d6c,
        accent: 0xe8faff, glint: 0xd3f0ff,
        name: "ICE",
      };
      if (n < 200) return {
        top: 0xc9c9c9, side: 0x6a6a6a, wall: 0x2e2e34,
        bg1: 0x14141a, bg2: 0x2a2a32,
        accent: 0xe0e0e0, glint: 0xa8a8a8,
        name: "STONE",
      };
      if (n < 300) return {
        top: 0xffb27a, side: 0xcc3a0a, wall: 0x5a1400,
        bg1: 0x200500, bg2: 0x501200,
        accent: 0xffd27a, glint: 0xff7a30,
        name: "LAVA",
      };
      if (n < 400) return {
        top: 0xb8f0a8, side: 0x2a7a38, wall: 0x14401e,
        bg1: 0x061505, bg2: 0x0f2e18,
        accent: 0xf0ffe0, glint: 0x6acb7a,
        name: "FOREST",
      };
      return {
        top: 0xd8c0ff, side: 0x5e3fa0, wall: 0x261048,
        bg1: 0x04001a, bg2: 0x170a44,
        accent: 0xfff0ff, glint: 0xa47fff,
        name: "SPACE",
      };
    }

    // Linearly blend two themes at the band boundary for smooth transitions.
    // Blend ramps over the last/first 10 floors of each band.
    currentTheme() {
      const n = this.player ? this.player.highestFloor : 0;
      const band = Math.floor(n / 100);
      const intoBand = n - band * 100;
      if (intoBand < 90) return this.floorTheme(n);
      // Blend toward next band
      const t = (intoBand - 90) / 10;
      const a = this.floorTheme(n);
      const b = this.floorTheme(band * 100 + 100);
      return {
        top:    lerpColor(a.top, b.top, t),
        side:   lerpColor(a.side, b.side, t),
        wall:   lerpColor(a.wall, b.wall, t),
        bg1:    lerpColor(a.bg1, b.bg1, t),
        bg2:    lerpColor(a.bg2, b.bg2, t),
        accent: lerpColor(a.accent, b.accent, t),
        glint:  lerpColor(a.glint, b.glint, t),
        name: a.name,
      };
    }

    // Pixel-art arctic climber drawn procedurally. Redraws each frame.
    drawPlayer() {
      const p = this.player;
      const g = this.playerGfx;
      g.clear();

      const cx = p.x;
      const feet = p.y;
      const facing = p.facing;

      // Base rectangle origin (top-left of body bounding box)
      const bx = cx - p.w / 2;
      const by = feet - p.h;

      // Crouch squash on land
      const crouch = p.crouchT; // 0..1
      const squash = 1 - crouch * 0.2;
      const stretch = p.onGround ? 1 : 1.05;
      const h = p.h * squash * stretch;
      const yTop = feet - h;

      // Running lean when going fast on ground
      const speedFrac = Phaser.Math.Clamp(Math.abs(p.vx) / CFG.MAX_H_SPEED, 0, 1);
      const lean = p.onGround ? facing * speedFrac * 4 : 0;

      // --- Legs ---
      // Ground + moving: legs alternate via runPhase. Airborne: tuck (both up).
      const airborne = !p.onGround;
      const legW = 5;
      const legH = Math.max(4, h * 0.28);
      const legY = yTop + h - legH;
      const legSpread = p.w * 0.25;
      const legLX = cx - legSpread - legW / 2;
      const legRX = cx + legSpread - legW / 2;

      g.fillStyle(0x2b2b30, 1); // dark pants
      if (airborne) {
        // Tuck - knees up
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX, tuckY, legW, legH);
        g.fillRect(legRX, tuckY, legW, legH);
      } else if (Math.abs(p.vx) > 20) {
        // Running: alternate offsets
        const s = Math.sin(p.runPhase);
        const off = s * legH * 0.4;
        g.fillRect(legLX, legY - off, legW, legH);
        g.fillRect(legRX, legY + off, legW, legH);
      } else {
        g.fillRect(legLX, legY, legW, legH);
        g.fillRect(legRX, legY, legW, legH);
      }

      // --- Boots ---
      g.fillStyle(0x111318, 1);
      const bootH = 3;
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX - 1, tuckY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, tuckY + legH - bootH, legW + 2, bootH);
      } else {
        g.fillRect(legLX - 1, legY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, legY + legH - bootH, legW + 2, bootH);
      }

      // --- Parka body ---
      const bodyH = h * 0.46;
      const bodyY = yTop + h * 0.30;
      const bodyX = bx + lean;
      g.fillStyle(0x2e84d6, 1);
      g.fillRect(bodyX, bodyY, p.w, bodyH);
      // belt / fur trim bottom
      g.fillStyle(0xffffff, 1);
      g.fillRect(bodyX, bodyY + bodyH - 3, p.w, 3);

      // --- Arms ---
      g.fillStyle(0x2067b0, 1);
      const armW = 4, armH = bodyH * 0.8;
      if (airborne) {
        // Arms up for jump
        g.fillRect(bodyX - armW + 1, bodyY - armH * 0.4, armW, armH);
        g.fillRect(bodyX + p.w - 1,  bodyY - armH * 0.4, armW, armH);
      } else {
        const armSwing = Math.abs(p.vx) > 20 ? Math.sin(p.runPhase + Math.PI) * 4 : 0;
        g.fillRect(bodyX - armW + 1, bodyY + armSwing, armW, armH);
        g.fillRect(bodyX + p.w - 1,  bodyY - armSwing, armW, armH);
      }

      // --- Head (with goggles + beanie) ---
      const headW = p.w - 4;
      const headH = h * 0.30;
      const headX = bx + 2 + lean;
      const headY = yTop;
      // Skin
      g.fillStyle(0xf2d1a8, 1);
      g.fillRect(headX, headY + 4, headW, headH - 4);
      // Beanie
      g.fillStyle(0xd03030, 1);
      g.fillRect(headX, headY, headW, 6);
      g.fillStyle(0xffffff, 1);
      g.fillRect(headX, headY - 2, 4, 3);   // pom
      g.fillRect(headX + 4, headY - 0.5, headW - 4, 1.5); // band
      // Goggles (orange lens)
      g.fillStyle(0x1a1a1a, 1);
      g.fillRect(headX, headY + 7, headW, 4);
      g.fillStyle(0xff9a3d, 1);
      if (facing >= 0) {
        g.fillRect(headX + headW - 7, headY + 8, 5, 2);
      } else {
        g.fillRect(headX + 2, headY + 8, 5, 2);
      }

      // Scarf flutter
      g.fillStyle(0xffdc4a, 1);
      const scarfY = bodyY + 2;
      const flutter = Math.sin((this.time.now + cx) * 0.02) * 2;
      if (facing >= 0) {
        g.fillRect(bodyX - 3, scarfY, 3, 4);
        g.fillRect(bodyX - 5, scarfY + 2 + flutter, 3, 3);
      } else {
        g.fillRect(bodyX + p.w, scarfY, 3, 4);
        g.fillRect(bodyX + p.w + 2, scarfY + 2 + flutter, 3, 3);
      }
    }

    // ---------------------------------------------------------------
    // Physics
    // ---------------------------------------------------------------
    updatePhysics(dt) {
      const p = this.player;
      const ax = this.axisX;

      // ---- Horizontal ----
      if (ax !== 0) {
        const accel = p.onGround ? CFG.GROUND_ACCEL : CFG.AIR_ACCEL;
        p.vx += ax * accel * dt;
        p.vx = Phaser.Math.Clamp(p.vx, -CFG.MAX_H_SPEED, CFG.MAX_H_SPEED);
        p.facing = ax > 0 ? 1 : -1;
      } else if (p.onGround) {
        // Ice friction - slide to stop
        const dec = CFG.GROUND_FRICTION * dt;
        if (Math.abs(p.vx) <= dec) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * dec;
      }

      // ---- Jump ----
      if (this.jumpPressed && p.onGround) {
        const speedFrac = Math.abs(p.vx) / CFG.MAX_H_SPEED;
        p.vy = -(CFG.BASE_JUMP + speedFrac * CFG.BONUS_JUMP);
        p.onGround = false;
        p.jumpStartFloor = p.currentFloor;
      }

      // ---- Gravity ----
      p.vy += CFG.GRAVITY * dt;

      // ---- Integrate ----
      p.prevY = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // ---- Floor collision (one-way, only when falling) ----
      this.resolveFloorCollision();

      // ---- Wall collision & bounce ----
      this.resolveWallCollision();

      // ---- Animation state ----
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.runPhase += (Math.abs(p.vx) / CFG.MAX_H_SPEED) * 18 * dt;
      } else if (!p.onGround) {
        p.runPhase = 0;
      }
      if (p.crouchT > 0) p.crouchT = Math.max(0, p.crouchT - dt / 0.15);
    }

    resolveFloorCollision() {
      const p = this.player;
      if (p.vy < 0) return; // rising - pass through (one-way)

      const halfW = p.w / 2;
      const prevBottom = p.prevY;
      const curBottom = p.y;

      // Only consider floors whose top is between prevBottom and curBottom.
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        const top = f.y;
        if (prevBottom <= top && curBottom >= top) {
          // Horizontal overlap?
          if (p.x + halfW > f.x && p.x - halfW < f.x + f.w) {
            // Land
            p.y = top;
            p.vy = 0;
            const wasAir = !p.onGround;
            p.onGround = true;
            if (wasAir) this.onLand(f);
            break;
          }
        }
      }
    }

    resolveWallCollision() {
      const p = this.player;
      const halfW = p.w / 2;
      const leftBound  = CFG.WALL_THICKNESS + halfW;
      const rightBound = this.W - CFG.WALL_THICKNESS - halfW;
      const now = performance.now();

      if (p.x < leftBound && p.vx <= 0) {
        p.x = leftBound;
        // Flip horizontal velocity on impact
        p.vx = Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = -1;
        p.wallBounceArmed = true;
      } else if (p.x > rightBound && p.vx >= 0) {
        p.x = rightBound;
        p.vx = -Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = 1;
        p.wallBounceArmed = true;
      }

      // Resolve the bounce window
      if (p.wallBounceArmed) {
        const elapsed = now - p.wallHitTime;
        // Opposite-direction input check: hit right wall -> need LEFT input.
        const inputAwayFromWall =
          (p.wallHitSide === 1  && this.axisX < -0.1) ||
          (p.wallHitSide === -1 && this.axisX >  0.1);

        if (inputAwayFromWall && elapsed <= CFG.WALL_BOUNCE_WINDOW_MS) {
          // Successful wall bounce: full momentum preserved, vy untouched.
          const dir = -p.wallHitSide;
          p.vx = dir * CFG.MAX_H_SPEED;
          // vy left alone - the upward climb continues.
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
          this.onWallBounce();
        } else if (elapsed > CFG.WALL_BOUNCE_WINDOW_MS) {
          // Window expired without reversal - lose all horizontal momentum.
          p.vx = 0;
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
        }
      }
    }

    // ---------------------------------------------------------------
    // Landing / wall-bounce hooks
    // ---------------------------------------------------------------
    onLand(floor) {
      const p = this.player;
      p.crouchT = 1;

      const fromFloor = p.jumpStartFloor;
      const toFloor   = floor.n;
      const prevFloor = p.currentFloor;
      p.currentFloor = toFloor;

      // Landing particle burst
      this.spawnLandParticles(p.x, floor.y, this.floorTheme(floor.n));

      const floorsClearedSinceJump = toFloor - fromFloor;

      // --- New-floor scoring ---
      if (toFloor > p.highestFloor) {
        const gained = toFloor - p.highestFloor;
        // Multiplier is additive: 1 + (count * 0.5). count 0 -> 1x.
        const mult = 1 + this.combo.count * 0.5;
        this.score += Math.round(CFG.POINTS_PER_FLOOR * gained * mult);
        const prevBest = p.highestFloor;
        p.highestFloor = toFloor;

        // Milestone flashes
        for (let m = 0; m < CFG.MILESTONES.length; m++) {
          const ms = CFG.MILESTONES[m];
          if (prevBest < ms && toFloor >= ms && !this.milestonesFired[ms]) {
            this.milestonesFired[ms] = true;
            this.triggerMilestone(ms);
          }
        }

        // Keep the tower built well above the player
        const wantUpTo = toFloor + 80;
        if (wantUpTo > this.maxSpawnedFloor) {
          for (let k = this.maxSpawnedFloor + 1; k <= wantUpTo; k++) this._createFloor(k);
        }
      } else if (toFloor < prevFloor) {
        // Fell to a lower floor - revoke the points for the drop.
        const lost = prevFloor - toFloor;
        this.score = Math.max(0, this.score - lost * CFG.POINTS_PER_FLOOR);
      }

      // --- Combo update ---
      // "Combo ends: any 1-floor jump, falling to a lower floor, or meter runs out"
      if (floorsClearedSinceJump >= CFG.COMBO_MIN_FLOORS) {
        this.combo.count += 1;
        this.combo.timer = CFG.COMBO_TIMEOUT_MS / 1000;
        if (this.combo.count > this.combo.longest) {
          this.combo.longest = this.combo.count;
        }
        this.maybeShowComboReward(this.combo.count);
      } else {
        // Anything less than 2 floors (or a net drop) breaks any streak.
        if (this.combo.count > 0) this.breakCombo();
      }
    }

    breakCombo() {
      this.combo.count = 0;
      this.combo.timer = 0;
    }

    // Reward thresholds from the spec: 5/10/20/30/50/100+
    maybeShowComboReward(n) {
      const tier = this.comboTierFor(n);
      if (!tier) return;
      this.spawnRewardPopup(tier);
    }

    comboTierFor(n) {
      // Only fire the pop-up when we just crossed a threshold.
      if (n === 5)   return "GOOD!";
      if (n === 10)  return "SWEET!";
      if (n === 20)  return "EXCELLENT!";
      if (n === 30)  return "FANTASTIC!";
      if (n === 50)  return "EXTREME!";
      if (n === 100) return "GODLIKE!";
      // Every +25 beyond 100 keeps GODLIKE alive so marathon combos still feel good.
      if (n > 100 && (n - 100) % 25 === 0) return "GODLIKE!";
      return null;
    }

    spawnRewardPopup(text) {
      const cx = this.W / 2;
      const cy = this.H * 0.38;
      const size = Math.round(Math.min(this.W, this.H) * 0.11);
      const label = this.add.text(cx, cy, text, {
        fontFamily: "Courier New, monospace",
        fontSize: size + "px",
        fontStyle: "bold",
        color: "#ffdf3c",
        stroke: "#802000",
        strokeThickness: 8,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1700).setAlpha(0);

      this.tweens.add({
        targets: label,
        alpha: { from: 0, to: 1 },
        scale: { from: 0.6, to: 1.15 },
        y: cy - 20,
        ease: "Back.Out",
        duration: 220,
      });
      this.tweens.add({
        targets: label,
        alpha: 0,
        scale: 0.95,
        y: cy - 60,
        delay: 900,
        duration: 600,
        ease: "Sine.In",
        onComplete: () => label.destroy(),
      });
    }

    onWallBounce() {
      // Hook for Phase 7 audio / particle feedback.
      const p = this.player;
      const theme = this.currentTheme();
      const xWall = p.wallHitSide === -1 ? CFG.WALL_THICKNESS : this.W - CFG.WALL_THICKNESS;
      const dir = -p.wallHitSide;
      for (let i = 0; i < 10; i++) {
        this.particles.push({
          x: xWall, y: p.y - p.h * 0.6 + (Math.random() - 0.5) * 14,
          vx: dir * (40 + Math.random() * 80),
          vy: (Math.random() - 0.5) * 80,
          life: 0.4, maxLife: 0.4,
          size: 2 + Math.random() * 2,
          color: theme.accent,
        });
      }
    }

    // ---------------------------------------------------------------
    // Particles
    // ---------------------------------------------------------------
    spawnLandParticles(x, y, theme) {
      const n = 14;
      for (let i = 0; i < n; i++) {
        const angle = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9; // upward fan
        const speed = 40 + Math.random() * 90;
        this.particles.push({
          x: x + (Math.random() - 0.5) * 12,
          y: y - 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.3,
          maxLife: 0.8,
          size: 1 + Math.floor(Math.random() * 3),
          color: i % 3 === 0 ? theme.accent : theme.top,
        });
      }
    }

    updateParticles(dt) {
      const arr = this.particles;
      for (let i = arr.length - 1; i >= 0; i--) {
        const pt = arr[i];
        pt.life -= dt;
        if (pt.life <= 0) { arr.splice(i, 1); continue; }
        pt.vy += 420 * dt; // gravity on particles
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
      }
    }

    drawParticles() {
      const g = this.particlesGfx;
      g.clear();
      for (let i = 0; i < this.particles.length; i++) {
        const pt = this.particles[i];
        const a = Math.max(0, Math.min(1, pt.life / pt.maxLife));
        g.fillStyle(pt.color, a);
        g.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
      }
    }

    // ---------------------------------------------------------------
    // Milestone flash at floors 100 / 250 / 500 / 1000
    // ---------------------------------------------------------------
    triggerMilestone(n) {
      const msg = n >= 1000 ? `FLOOR ${n}!\nLEGEND.`
                : n >= 500  ? `FLOOR ${n}!\nINCREDIBLE!`
                : n >= 250  ? `FLOOR ${n}!\nKEEP GOING!`
                :             `FLOOR ${n}!\nNICE CLIMB!`;
      const cx = this.W / 2;
      const cy = this.H * 0.42;
      const size = Math.round(Math.min(this.W, this.H) * 0.1);
      const label = this.add.text(cx, cy, msg, {
        fontFamily: "Courier New, monospace",
        fontSize: size + "px",
        fontStyle: "bold",
        color: "#fff",
        stroke: "#000",
        strokeThickness: 8,
        align: "center",
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1750).setAlpha(0);
      this.tweens.add({
        targets: label, alpha: 1, scale: { from: 0.5, to: 1.2 },
        duration: 260, ease: "Back.Out",
      });
      this.tweens.add({
        targets: label, alpha: 0, scale: 1.3, y: cy - 40,
        delay: 1400, duration: 700, ease: "Sine.In",
        onComplete: () => label.destroy(),
      });

      // Full-screen color flash
      const theme = this.currentTheme();
      const flash = this.add.graphics().setScrollFactor(0).setDepth(1600);
      flash.fillStyle(theme.accent, 0.35);
      flash.fillRect(0, 0, this.W, this.H);
      this.tweens.add({
        targets: flash, alpha: 0,
        duration: 450, ease: "Sine.Out",
        onComplete: () => flash.destroy(),
      });
    }

    // ---------------------------------------------------------------
    // Camera - upward-only follow + auto-scroll escalation
    // ---------------------------------------------------------------
    updateCamera(dt) {
      const p = this.player;

      // Follow player while climbing; never pan back down.
      const desired = p.y - this.H * 0.62;
      if (desired < this.cameraY) {
        this.cameraY = Phaser.Math.Linear(this.cameraY, desired, 0.18);
      }

      // Trigger auto-scroll once the player first reaches the start floor.
      if (!this.scrollActive && p.highestFloor >= CFG.SCROLL_START_FLOOR) {
        this.scrollActive = true;
        this.scrollSpeed = CFG.SCROLL_INITIAL_SPEED;
        this.scrollStartedAt = this.time.now;
        this.nextSpeedupAt  = this.time.now + CFG.SCROLL_INCREMENT_MS;
        this.triggerHurryUp(false);
      }

      if (this.scrollActive) {
        // Scheduled speed-ups
        if (this.time.now >= this.nextSpeedupAt) {
          this.scrollSpeed += CFG.SCROLL_INCREMENT;
          this.nextSpeedupAt = this.time.now + CFG.SCROLL_INCREMENT_MS;
          this.triggerHurryUp(true);
        }
        // Camera Y decreases over time (climbs into negative = up).
        this.cameraY -= this.scrollSpeed * dt;
      }

      this.cameras.main.setScroll(0, this.cameraY);
    }

    // ---------------------------------------------------------------
    // Combo timer update (called per frame)
    // ---------------------------------------------------------------
    updateCombo(dt) {
      if (this.combo.timer > 0) {
        this.combo.timer -= dt;
        if (this.combo.timer <= 0) {
          this.combo.timer = 0;
          if (this.combo.count > 0) this.breakCombo();
        }
      }
    }

    // ---------------------------------------------------------------
    // HUD (floor / score / best / combo meter)
    // ---------------------------------------------------------------
    buildHUD() {
      if (this.hud) this.hud.container.destroy();
      const c = this.add.container(0, 0).setScrollFactor(0).setDepth(1100);

      const pad = 14;
      const small = Math.max(14, Math.round(Math.min(this.W, this.H) * 0.032));
      const big   = Math.max(18, Math.round(Math.min(this.W, this.H) * 0.045));

      const floorTxt = this.add.text(pad, pad, "FLOOR 0", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#000", strokeThickness: 4,
      });
      c.add(floorTxt);

      const scoreTxt = this.add.text(this.W / 2, pad, "0", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 4,
      }).setOrigin(0.5, 0);
      c.add(scoreTxt);

      const bestTxt = this.add.text(this.W - pad, pad, "BEST " + this.best.score, {
        fontFamily: "Courier New, monospace",
        fontSize: small + "px",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 3,
      }).setOrigin(1, 0);
      c.add(bestTxt);

      // Combo meter on the left side
      const meterBG = this.add.graphics();
      c.add(meterBG);
      const meterFill = this.add.graphics();
      c.add(meterFill);

      const comboTxt = this.add.text(pad + 9, this.H * 0.5, "", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0.5);
      c.add(comboTxt);

      this.hud = {
        container: c,
        floorTxt, scoreTxt, bestTxt, comboTxt,
        meterBG, meterFill,
        pad, small, big,
      };
    }

    drawHUD() {
      if (!this.hud) return;
      const p = this.player;
      this.hud.floorTxt.setText("FLOOR " + p.highestFloor);
      this.hud.scoreTxt.setText(String(this.score));
      this.hud.bestTxt.setText("BEST " + Math.max(this.best.score, this.score));

      // Combo meter
      const mbg = this.hud.meterBG;
      const mf  = this.hud.meterFill;
      mbg.clear(); mf.clear();

      const mx = this.hud.pad;
      const myTop = this.H * 0.25;
      const mw = 10;
      const mh = this.H * 0.50;

      // Track
      mbg.fillStyle(0x000000, 0.5);
      mbg.fillRect(mx - 2, myTop - 2, mw + 4, mh + 4);
      mbg.fillStyle(0x1a3a66, 1);
      mbg.fillRect(mx, myTop, mw, mh);

      if (this.combo.count > 0 && this.combo.timer > 0) {
        const frac = Phaser.Math.Clamp(this.combo.timer / (CFG.COMBO_TIMEOUT_MS / 1000), 0, 1);
        const fillH = mh * frac;
        const color = frac > 0.5 ? 0xffdf3c : (frac > 0.2 ? 0xff8a2a : 0xff3030);
        mf.fillStyle(color, 1);
        mf.fillRect(mx, myTop + (mh - fillH), mw, fillH);
        this.hud.comboTxt.setText("x" + this.combo.count);
        this.hud.comboTxt.setVisible(true);
      } else {
        this.hud.comboTxt.setVisible(false);
      }
    }

    // ---------------------------------------------------------------
    // HURRY UP flash (banner only here; alarm audio lands in Phase 7)
    // ---------------------------------------------------------------
    triggerHurryUp(strong) {
      this.hurryFlashEndsAt = this.time.now + (strong ? 1800 : 1200);
      this.hurryFlashStrong = strong;
    }

    drawHurryUp() {
      const fx = this.fxLayer;
      // Clear prior transient child
      if (this._hurryLabel) { this._hurryLabel.destroy(); this._hurryLabel = null; }
      if (this.time.now > this.hurryFlashEndsAt) return;

      const remaining = this.hurryFlashEndsAt - this.time.now;
      const pulse = 0.6 + 0.4 * Math.abs(Math.sin(this.time.now / 90));
      const color = this.hurryFlashStrong ? "#ff3a3a" : "#ffcc33";
      const text = this.hurryFlashStrong ? "HURRY UP!" : "CLIMB!";

      const label = this.add.text(this.W / 2, this.H * 0.18, text, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(Math.min(this.W, this.H) * 0.09) + "px",
        fontStyle: "bold",
        color,
        stroke: "#000",
        strokeThickness: 6,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1600).setAlpha(pulse);

      this._hurryLabel = label;

      // Edge vignette flash
      this.fxLayer.iterate(() => {});
      if (this._edgeFlash) this._edgeFlash.destroy();
      const ef = this.add.graphics().setScrollFactor(0).setDepth(1550);
      ef.fillStyle(Phaser.Display.Color.HexStringToColor(color).color, 0.18 * pulse);
      const thick = 18;
      ef.fillRect(0, 0, this.W, thick);
      ef.fillRect(0, this.H - thick, this.W, thick);
      ef.fillRect(0, 0, thick, this.H);
      ef.fillRect(this.W - thick, 0, thick, this.H);
      this._edgeFlash = ef;

      // Schedule auto-cleanup when the flash expires.
      this.time.delayedCall(Math.max(0, remaining), () => {
        if (this._edgeFlash === ef) { ef.destroy(); this._edgeFlash = null; }
      });
    }

    // ---------------------------------------------------------------
    // Game over
    // ---------------------------------------------------------------
    checkGameOver() {
      if (this.gameOver) return;
      const p = this.player;
      // Bottom of screen in world coords
      const viewBottom = this.cameraY + this.H;
      if (p.y > viewBottom + 8) {
        this.triggerGameOver();
      }
    }

    triggerGameOver() {
      this.gameOver = true;
      // Persist all three bests to localStorage.
      if (this.player.highestFloor > this.best.floor) {
        this.best.floor = this.player.highestFloor;
        lsSet(LS_KEYS.bestFloor, this.best.floor);
      }
      if (this.score > this.best.score) {
        this.best.score = this.score;
        lsSet(LS_KEYS.bestScore, this.best.score);
      }
      if (this.combo.longest > this.best.longestCombo) {
        this.best.longestCombo = this.combo.longest;
        lsSet(LS_KEYS.longestCombo, this.best.longestCombo);
      }
      this.showGameOverScreen();
    }

    showGameOverScreen() {
      if (this.gameOverOverlay) this.gameOverOverlay.destroy();
      const g = this.add.container(0, 0).setScrollFactor(0).setDepth(2000);

      const bg = this.add.graphics();
      bg.fillStyle(0x000000, 0.72);
      bg.fillRect(0, 0, this.W, this.H);
      g.add(bg);

      const cx = this.W / 2;
      const cy = this.H / 2;
      const titleSize = Math.round(Math.min(this.W, this.H) * 0.12);
      const lineSize  = Math.round(Math.min(this.W, this.H) * 0.045);

      const title = this.add.text(cx, cy - titleSize * 1.6, "GAME OVER", {
        fontFamily: "Courier New, monospace",
        fontSize: titleSize + "px",
        fontStyle: "bold",
        color: "#ff5a5a",
        stroke: "#000",
        strokeThickness: 6,
      }).setOrigin(0.5);
      g.add(title);

      const lines = [
        `FLOOR REACHED:  ${this.player.highestFloor}`,
        `SCORE:          ${this.score}`,
        `LONGEST COMBO:  x${this.combo.longest}`,
        ``,
        `BEST SCORE:     ${this.best.score}`,
        `BEST FLOOR:     ${this.best.floor}`,
        `BEST COMBO:     x${this.best.longestCombo}`,
      ];
      lines.forEach((t, i) => {
        const line = this.add.text(cx, cy - titleSize * 0.1 + i * (lineSize * 1.3), t, {
          fontFamily: "Courier New, monospace",
          fontSize: lineSize + "px",
          color: "#9cd9ff",
        }).setOrigin(0.5);
        g.add(line);
      });

      const btnW = Math.min(this.W * 0.6, 260);
      const btnH = lineSize * 2.2;
      const btnY = cy + lineSize * 4;
      const btnBg = this.add.graphics();
      btnBg.fillStyle(0x2e84d6, 1);
      btnBg.fillRoundedRect(cx - btnW / 2, btnY - btnH / 2, btnW, btnH, 10);
      btnBg.lineStyle(2, 0x9cd9ff, 1);
      btnBg.strokeRoundedRect(cx - btnW / 2, btnY - btnH / 2, btnW, btnH, 10);
      g.add(btnBg);

      const btnLabel = this.add.text(cx, btnY, "RESTART", {
        fontFamily: "Courier New, monospace",
        fontSize: lineSize + "px",
        fontStyle: "bold",
        color: "#fff",
      }).setOrigin(0.5);
      g.add(btnLabel);

      const hit = this.add.zone(cx, btnY, btnW, btnH)
        .setOrigin(0.5)
        .setInteractive({ useHandCursor: true });
      g.add(hit);
      hit.on("pointerdown", () => this.restartRun());
      this.input.keyboard.once("keydown-SPACE",  () => this.gameOver && this.restartRun());
      this.input.keyboard.once("keydown-ENTER",  () => this.gameOver && this.restartRun());

      this.gameOverOverlay = g;
    }

    restartRun() {
      // Tear down all transient graphics that belong to the previous run.
      if (this.gameOverOverlay) { this.gameOverOverlay.destroy(); this.gameOverOverlay = null; }
      if (this._hurryLabel)     { this._hurryLabel.destroy();     this._hurryLabel = null; }
      if (this._edgeFlash)      { this._edgeFlash.destroy();      this._edgeFlash = null; }
      this.floorsGfx.clear();
      this.playerGfx.clear();
      this.wallsGfx.clear();
      this.particlesGfx.clear();
      this.ghostGfx.clear();
      this.resetRun();
    }

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    drawFloors() {
      const g = this.floorsGfx;
      g.clear();
      const viewTop = this.cameraY - 20;
      const viewBottom = this.cameraY + this.H + 20;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < viewTop || f.y > viewBottom) continue;
        const theme = this.floorTheme(f.n);
        // Shadow strip under the floor
        g.fillStyle(0x000000, 0.35);
        g.fillRect(f.x + 2, f.y + f.h, f.w, 4);
        // Side color (thickness)
        g.fillStyle(theme.side, 1);
        g.fillRect(f.x, f.y, f.w, f.h);
        // Top highlight
        g.fillStyle(theme.top, 1);
        g.fillRect(f.x, f.y, f.w, 3);
        // Glint ticks
        g.fillStyle(theme.accent, 0.75);
        for (let t = 0; t < f.w; t += 24) {
          g.fillRect(f.x + t + 6, f.y + 1, 4, 1);
        }
        // Floor number etched on every 5th floor
        if (f.n > 0 && f.n % 5 === 0 && f.w > 70) {
          // Small tick on left end
          g.fillStyle(theme.wall, 0.55);
          g.fillRect(f.x + 4, f.y + 5, 3, 3);
        }
      }
    }

    drawWalls() {
      const g = this.wallsGfx;
      g.clear();
      const theme = this.currentTheme();
      const top = this.cameraY - 20;
      const h = this.H + 40;

      // Left wall
      g.fillStyle(theme.wall, 1);
      g.fillRect(0, top, CFG.WALL_THICKNESS, h);
      // Right wall
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, CFG.WALL_THICKNESS, h);

      // Inner edge highlight
      g.fillStyle(theme.accent, 0.10);
      g.fillRect(CFG.WALL_THICKNESS - 2, top, 2, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, 2, h);

      // Brick hatching
      g.fillStyle(0x000000, 0.28);
      const startRow = Math.floor(top / 16) * 16;
      for (let y = startRow; y < top + h; y += 16) {
        g.fillRect(0, y, CFG.WALL_THICKNESS, 1);
        g.fillRect(this.W - CFG.WALL_THICKNESS, y, CFG.WALL_THICKNESS, 1);
      }
      // Vertical mortar line
      g.fillStyle(0x000000, 0.18);
      g.fillRect(CFG.WALL_THICKNESS / 2, top, 1, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS / 2, top, 1, h);
    }

    update(_time, delta) {
      if (this.gameOver) {
        this.drawWalls();
        this.drawFloors();
        this.drawPlayer();
        return;
      }
      const dt = Math.min(delta / 1000, 1 / 30);
      this.readInput();
      this.updatePhysics(dt);
      this.updateCombo(dt);
      this.updateParticles(dt);
      this.updateCamera(dt);
      this.drawBackground();     // theme can drift as player climbs
      this.drawWalls();
      this.drawFloors();
      this.drawParticles();
      this.drawPlayer();
      this.drawHurryUp();
      this.drawHUD();
      this.checkGameOver();
    }
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#05080f",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: window.innerWidth,
      height: window.innerHeight,
    },
    render: {
      pixelArt: true,
      antialias: false,
      roundPixels: true,
    },
    scene: [GameScene],
  };

  // eslint-disable-next-line no-unused-vars
  const game = new Phaser.Game(config);
  </script>
</body>
</html>

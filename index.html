<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Frostspire</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05080f;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #fff;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    canvas { display: block; }
    #tilt-enable {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 22px;
      background: rgba(20, 90, 180, 0.92);
      color: #fff;
      border: 2px solid #9cd9ff;
      border-radius: 10px;
      font: 700 14px/1 "Courier New", monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: none;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    #boot-msg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9cd9ff;
      font: 700 18px/1.5 "Courier New", monospace;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="tilt-enable" type="button">Enable Tilt Controls</button>
  <div id="boot-msg">LOADING FROSTSPIRE</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script>
  "use strict";

  /* =========================================================================
   * FROSTSPIRE - an Icy Tower-inspired vertical climber
   * Single-file browser game built with Phaser 3.
   * ========================================================================= */

  // ------------------------------------------------------------------
  // CFG - all gameplay tuning in one place
  // ------------------------------------------------------------------
  const CFG = {
    // Horizontal motion
    MAX_H_SPEED: 400,           // px/s at full sprint
    GROUND_ACCEL: 1000,         // 400 / 0.4s ramp to max
    GROUND_FRICTION: 1333,      // 400 / 0.3s slide to stop
    AIR_ACCEL: 600,             // 60% of ground accel

    // Vertical / jump
    GRAVITY: 800,               // px/s^2 (matches spec 0.8 scaled)
    BASE_JUMP: 300,             // jump Vy at standstill -> ~1 floor
    BONUS_JUMP: 350,            // added at full sprint -> ~5 floors

    // Floors
    FLOOR_HEIGHT: 50,           // vertical spacing between floors
    FLOOR_THICKNESS: 10,        // visual thickness
    FLOOR_MIN_WIDTH_PX: 60,
    FLOOR_WIDTH_JITTER: 0.15,   // +/- 15%

    // Walls
    WALL_THICKNESS: 36,
    WALL_BOUNCE_WINDOW_MS: 100, // time to press opposite dir for full preserve

    // Character
    CHAR_W: 22,
    CHAR_H: 32,

    // Combo
    COMBO_MIN_FLOORS: 2,
    COMBO_TIMEOUT_MS: 3000,

    // Scroll escalation
    SCROLL_START_FLOOR: 5,
    SCROLL_INITIAL_SPEED: 30,
    SCROLL_INCREMENT: 20,
    SCROLL_INCREMENT_MS: 30000,

    // Scoring
    POINTS_PER_FLOOR: 10,

    // Ghost recorder
    GHOST_SAMPLE_MS: 100,

    // Milestones
    MILESTONES: [100, 250, 500, 1000],
  };

  const LS_KEYS = {
    bestScore:   "frostspire.bestScore",
    bestFloor:   "frostspire.bestFloor",
    longestCombo:"frostspire.longestCombo",
    ghost:       "frostspire.ghost",
  };

  function lsGetInt(key, fallback) {
    try {
      const v = parseInt(localStorage.getItem(key), 10);
      return Number.isFinite(v) ? v : fallback;
    } catch (_) { return fallback; }
  }
  function lsGetJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, typeof val === "string" ? val : JSON.stringify(val)); }
    catch (_) {}
  }

  // ------------------------------------------------------------------
  // GameScene - will grow in subsequent phases
  // ------------------------------------------------------------------
  class GameScene extends Phaser.Scene {
    constructor() { super("game"); }

    create() {
      this.W = this.scale.gameSize.width;
      this.H = this.scale.gameSize.height;

      // Persistent bests (loaded once at boot, updated during play)
      this.best = {
        score:        lsGetInt(LS_KEYS.bestScore, 0),
        floor:        lsGetInt(LS_KEYS.bestFloor, 0),
        longestCombo: lsGetInt(LS_KEYS.longestCombo, 0),
        ghost:        lsGetJSON(LS_KEYS.ghost, null),
      };

      // Layer setup (deeper = foreground). Game-world layers scroll with camera.
      this.bgGfx       = this.add.graphics().setDepth(-10);
      this.wallsGfx    = this.add.graphics().setDepth(-5);
      this.floorsGfx   = this.add.graphics().setDepth(0);
      this.particlesGfx= this.add.graphics().setDepth(5);
      this.ghostGfx    = this.add.graphics().setDepth(8).setAlpha(0.35);
      this.playerGfx   = this.add.graphics().setDepth(10);

      // UI layer (stays put on screen)
      this.uiLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1000);
      this.fxLayer = this.add.container(0, 0).setScrollFactor(0).setDepth(1500);

      this.cameras.main.setBackgroundColor("#05080f");

      this.drawBackground();

      this.setupInput();
      this.resetRun();

      this.scale.on("resize", this.onResize, this);

      // Hide boot overlay now that Phaser is alive.
      const boot = document.getElementById("boot-msg");
      if (boot) boot.style.display = "none";
    }

    onResize(gameSize) {
      this.W = gameSize.width;
      this.H = gameSize.height;
      this.drawBackground();
      // Don't rebuild floors on resize; widths were set at spawn time.
      // Floor-0 (ground) is redrawn to cover full screen width.
      if (this.floors && this.floors[0]) {
        this.floors[0].x = 0;
        this.floors[0].w = this.W;
      }
    }

    // Simple placeholder gradient backdrop; themed version comes in Phase 6.
    drawBackground() {
      const g = this.bgGfx;
      g.clear();
      g.fillStyle(0x05080f, 1);
      g.fillRect(0, 0, this.W, this.H);
    }

    // ---------------------------------------------------------------
    // Input (keyboard for Phase 2; tilt/touch wired in Phase 8)
    // ---------------------------------------------------------------
    setupInput() {
      this.keys = this.input.keyboard.addKeys({
        left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        up:    Phaser.Input.Keyboard.KeyCodes.UP,
        a:     Phaser.Input.Keyboard.KeyCodes.A,
        d:     Phaser.Input.Keyboard.KeyCodes.D,
        w:     Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      // Prevent arrow / space from scrolling the page.
      this.input.keyboard.addCapture("LEFT,RIGHT,UP,DOWN,SPACE");

      // Axis buffer gets populated from keyboard / tilt / touch.
      this.axisX = 0;        // -1, 0, +1 (or analog in [-1..1] from tilt)
      this.jumpPressed = false;
    }

    readInput() {
      const k = this.keys;
      let ax = 0;
      if (k.left.isDown  || k.a.isDown) ax -= 1;
      if (k.right.isDown || k.d.isDown) ax += 1;
      this.axisX = ax;

      // Edge-triggered jump: true for one frame when any jump key goes down
      this.jumpPressed =
        Phaser.Input.Keyboard.JustDown(k.up) ||
        Phaser.Input.Keyboard.JustDown(k.w)  ||
        Phaser.Input.Keyboard.JustDown(k.space);
    }

    // ---------------------------------------------------------------
    // Run lifecycle
    // ---------------------------------------------------------------
    resetRun() {
      // Floor 0 top surface lives here in world coords.
      this.FLOOR0_Y = this.H - 80;

      this.player = {
        x: this.W / 2,
        y: this.FLOOR0_Y,       // feet y (world coords)
        prevY: this.FLOOR0_Y,
        vx: 0,
        vy: 0,
        w: CFG.CHAR_W,
        h: CFG.CHAR_H,
        onGround: true,
        facing: 1,
        runPhase: 0,
        crouchT: 0,
        // Wall bounce bookkeeping
        wallHitTime: 0,          // performance.now() of last wall hit, 0 if none pending
        wallHitSide: 0,          // -1 = hit left wall, +1 = hit right wall
        wallBounceArmed: false,  // true between hit and window expiry
        // Floor tracking
        currentFloor: 0,
        highestFloor: 0,
        jumpStartFloor: 0,
      };

      // Floors are authored in world-space; spawn them once.
      this.floors = [];
      this.maxSpawnedFloor = -1;
      this.spawnFloor(0); // ground
      for (let i = 1; i <= 60; i++) this.spawnFloor(i);

      // Camera starts at 0 (top of screen = world y 0). Upward-only follow.
      this.cameras.main.setScroll(0, 0);
      this.cameraY = 0;
    }

    // ---------------------------------------------------------------
    // Floor generation
    // ---------------------------------------------------------------
    floorY(n) { return this.FLOOR0_Y - n * CFG.FLOOR_HEIGHT; }

    // Width fraction curve based on spec: 70% base at floor 0,
    // drifting to ~40% at floor 200, ~25% at floor 500+.
    floorWidthFrac(n) {
      if (n <= 0) return 1.0;
      if (n < 200) return 0.70 - 0.30 * (n / 200);
      if (n < 500) return 0.40 - 0.15 * ((n - 200) / 300);
      return Math.max(0.15, 0.25 - (n - 500) * 0.0002);
    }

    spawnFloor(n) {
      if (n <= this.maxSpawnedFloor) return;
      // Fill any gaps (shouldn't happen in practice)
      for (let k = this.maxSpawnedFloor + 1; k <= n; k++) this._createFloor(k);
    }

    _createFloor(n) {
      const y = this.floorY(n);
      let f;
      if (n === 0) {
        // Ground - full width
        f = { n: 0, x: 0, y, w: this.W, h: CFG.FLOOR_THICKNESS, ground: true };
      } else {
        const frac = this.floorWidthFrac(n);
        const jitter = 1 + (Math.random() * 2 - 1) * CFG.FLOOR_WIDTH_JITTER;
        const availW = this.W - CFG.WALL_THICKNESS * 2;
        let w = Math.max(CFG.FLOOR_MIN_WIDTH_PX, availW * frac * jitter);
        w = Math.min(w, availW - 10);
        const slack = availW - w;
        const x = CFG.WALL_THICKNESS + Math.random() * slack;
        f = { n, x, y, w, h: CFG.FLOOR_THICKNESS, ground: false };
      }
      this.floors.push(f);
      this.maxSpawnedFloor = n;
    }

    // Rough theme resolver - full palette lands in Phase 6.
    floorTheme(n) {
      if (n < 100) return { top: 0x9cd9ff, side: 0x4aa8e0, wall: 0x2a5c8c };
      if (n < 200) return { top: 0xc9c9c9, side: 0x6a6a6a, wall: 0x333333 };
      if (n < 300) return { top: 0xff9a6a, side: 0xcc3a0a, wall: 0x701a00 };
      if (n < 400) return { top: 0x9aeaa0, side: 0x2a7a38, wall: 0x155020 };
      return { top: 0xd0b8ff, side: 0x5e3fa0, wall: 0x2a1a55 };
    }

    // Pixel-art arctic climber drawn procedurally. Redraws each frame.
    drawPlayer() {
      const p = this.player;
      const g = this.playerGfx;
      g.clear();

      const cx = p.x;
      const feet = p.y;
      const facing = p.facing;

      // Base rectangle origin (top-left of body bounding box)
      const bx = cx - p.w / 2;
      const by = feet - p.h;

      // Crouch squash on land
      const crouch = p.crouchT; // 0..1
      const squash = 1 - crouch * 0.2;
      const stretch = p.onGround ? 1 : 1.05;
      const h = p.h * squash * stretch;
      const yTop = feet - h;

      // Running lean when going fast on ground
      const speedFrac = Phaser.Math.Clamp(Math.abs(p.vx) / CFG.MAX_H_SPEED, 0, 1);
      const lean = p.onGround ? facing * speedFrac * 4 : 0;

      // --- Legs ---
      // Ground + moving: legs alternate via runPhase. Airborne: tuck (both up).
      const airborne = !p.onGround;
      const legW = 5;
      const legH = Math.max(4, h * 0.28);
      const legY = yTop + h - legH;
      const legSpread = p.w * 0.25;
      const legLX = cx - legSpread - legW / 2;
      const legRX = cx + legSpread - legW / 2;

      g.fillStyle(0x2b2b30, 1); // dark pants
      if (airborne) {
        // Tuck - knees up
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX, tuckY, legW, legH);
        g.fillRect(legRX, tuckY, legW, legH);
      } else if (Math.abs(p.vx) > 20) {
        // Running: alternate offsets
        const s = Math.sin(p.runPhase);
        const off = s * legH * 0.4;
        g.fillRect(legLX, legY - off, legW, legH);
        g.fillRect(legRX, legY + off, legW, legH);
      } else {
        g.fillRect(legLX, legY, legW, legH);
        g.fillRect(legRX, legY, legW, legH);
      }

      // --- Boots ---
      g.fillStyle(0x111318, 1);
      const bootH = 3;
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX - 1, tuckY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, tuckY + legH - bootH, legW + 2, bootH);
      } else {
        g.fillRect(legLX - 1, legY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, legY + legH - bootH, legW + 2, bootH);
      }

      // --- Parka body ---
      const bodyH = h * 0.46;
      const bodyY = yTop + h * 0.30;
      const bodyX = bx + lean;
      g.fillStyle(0x2e84d6, 1);
      g.fillRect(bodyX, bodyY, p.w, bodyH);
      // belt / fur trim bottom
      g.fillStyle(0xffffff, 1);
      g.fillRect(bodyX, bodyY + bodyH - 3, p.w, 3);

      // --- Arms ---
      g.fillStyle(0x2067b0, 1);
      const armW = 4, armH = bodyH * 0.8;
      if (airborne) {
        // Arms up for jump
        g.fillRect(bodyX - armW + 1, bodyY - armH * 0.4, armW, armH);
        g.fillRect(bodyX + p.w - 1,  bodyY - armH * 0.4, armW, armH);
      } else {
        const armSwing = Math.abs(p.vx) > 20 ? Math.sin(p.runPhase + Math.PI) * 4 : 0;
        g.fillRect(bodyX - armW + 1, bodyY + armSwing, armW, armH);
        g.fillRect(bodyX + p.w - 1,  bodyY - armSwing, armW, armH);
      }

      // --- Head (with goggles + beanie) ---
      const headW = p.w - 4;
      const headH = h * 0.30;
      const headX = bx + 2 + lean;
      const headY = yTop;
      // Skin
      g.fillStyle(0xf2d1a8, 1);
      g.fillRect(headX, headY + 4, headW, headH - 4);
      // Beanie
      g.fillStyle(0xd03030, 1);
      g.fillRect(headX, headY, headW, 6);
      g.fillStyle(0xffffff, 1);
      g.fillRect(headX, headY - 2, 4, 3);   // pom
      g.fillRect(headX + 4, headY - 0.5, headW - 4, 1.5); // band
      // Goggles (orange lens)
      g.fillStyle(0x1a1a1a, 1);
      g.fillRect(headX, headY + 7, headW, 4);
      g.fillStyle(0xff9a3d, 1);
      if (facing >= 0) {
        g.fillRect(headX + headW - 7, headY + 8, 5, 2);
      } else {
        g.fillRect(headX + 2, headY + 8, 5, 2);
      }

      // Scarf flutter
      g.fillStyle(0xffdc4a, 1);
      const scarfY = bodyY + 2;
      const flutter = Math.sin((this.time.now + cx) * 0.02) * 2;
      if (facing >= 0) {
        g.fillRect(bodyX - 3, scarfY, 3, 4);
        g.fillRect(bodyX - 5, scarfY + 2 + flutter, 3, 3);
      } else {
        g.fillRect(bodyX + p.w, scarfY, 3, 4);
        g.fillRect(bodyX + p.w + 2, scarfY + 2 + flutter, 3, 3);
      }
    }

    // ---------------------------------------------------------------
    // Physics
    // ---------------------------------------------------------------
    updatePhysics(dt) {
      const p = this.player;
      const ax = this.axisX;

      // ---- Horizontal ----
      if (ax !== 0) {
        const accel = p.onGround ? CFG.GROUND_ACCEL : CFG.AIR_ACCEL;
        p.vx += ax * accel * dt;
        p.vx = Phaser.Math.Clamp(p.vx, -CFG.MAX_H_SPEED, CFG.MAX_H_SPEED);
        p.facing = ax > 0 ? 1 : -1;
      } else if (p.onGround) {
        // Ice friction - slide to stop
        const dec = CFG.GROUND_FRICTION * dt;
        if (Math.abs(p.vx) <= dec) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * dec;
      }

      // ---- Jump ----
      if (this.jumpPressed && p.onGround) {
        const speedFrac = Math.abs(p.vx) / CFG.MAX_H_SPEED;
        p.vy = -(CFG.BASE_JUMP + speedFrac * CFG.BONUS_JUMP);
        p.onGround = false;
        p.jumpStartFloor = p.currentFloor;
      }

      // ---- Gravity ----
      p.vy += CFG.GRAVITY * dt;

      // ---- Integrate ----
      p.prevY = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // ---- Floor collision (one-way, only when falling) ----
      this.resolveFloorCollision();

      // ---- Wall collision & bounce ----
      this.resolveWallCollision();

      // ---- Animation state ----
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.runPhase += (Math.abs(p.vx) / CFG.MAX_H_SPEED) * 18 * dt;
      } else if (!p.onGround) {
        p.runPhase = 0;
      }
      if (p.crouchT > 0) p.crouchT = Math.max(0, p.crouchT - dt / 0.15);
    }

    resolveFloorCollision() {
      const p = this.player;
      if (p.vy < 0) return; // rising - pass through (one-way)

      const halfW = p.w / 2;
      const prevBottom = p.prevY;
      const curBottom = p.y;

      // Only consider floors whose top is between prevBottom and curBottom.
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        const top = f.y;
        if (prevBottom <= top && curBottom >= top) {
          // Horizontal overlap?
          if (p.x + halfW > f.x && p.x - halfW < f.x + f.w) {
            // Land
            p.y = top;
            p.vy = 0;
            const wasAir = !p.onGround;
            p.onGround = true;
            if (wasAir) this.onLand(f);
            break;
          }
        }
      }
    }

    resolveWallCollision() {
      const p = this.player;
      const halfW = p.w / 2;
      const leftBound  = CFG.WALL_THICKNESS + halfW;
      const rightBound = this.W - CFG.WALL_THICKNESS - halfW;
      const now = performance.now();

      if (p.x < leftBound && p.vx <= 0) {
        p.x = leftBound;
        // Flip horizontal velocity on impact
        p.vx = Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = -1;
        p.wallBounceArmed = true;
      } else if (p.x > rightBound && p.vx >= 0) {
        p.x = rightBound;
        p.vx = -Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = 1;
        p.wallBounceArmed = true;
      }

      // Resolve the bounce window
      if (p.wallBounceArmed) {
        const elapsed = now - p.wallHitTime;
        // Opposite-direction input check: hit right wall -> need LEFT input.
        const inputAwayFromWall =
          (p.wallHitSide === 1  && this.axisX < -0.1) ||
          (p.wallHitSide === -1 && this.axisX >  0.1);

        if (inputAwayFromWall && elapsed <= CFG.WALL_BOUNCE_WINDOW_MS) {
          // Successful wall bounce: full momentum preserved, vy untouched.
          const dir = -p.wallHitSide;
          p.vx = dir * CFG.MAX_H_SPEED;
          // vy left alone - the upward climb continues.
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
          this.onWallBounce();
        } else if (elapsed > CFG.WALL_BOUNCE_WINDOW_MS) {
          // Window expired without reversal - lose all horizontal momentum.
          p.vx = 0;
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
        }
      }
    }

    // ---------------------------------------------------------------
    // Landing / wall-bounce hooks
    // ---------------------------------------------------------------
    onLand(floor) {
      const p = this.player;
      if (p.vy === 0 && p.prevY - p.y > 40) p.crouchT = 1;
      if (!p.crouchT) p.crouchT = 1;
      p.currentFloor = floor.n;
      if (floor.n > p.highestFloor) {
        p.highestFloor = floor.n;
        // Proactively ensure the tower is built well above the player.
        const wantUpTo = floor.n + 80;
        if (wantUpTo > this.maxSpawnedFloor) {
          for (let k = this.maxSpawnedFloor + 1; k <= wantUpTo; k++) this._createFloor(k);
        }
      }
    }

    onWallBounce() {
      // Hook for Phase 7 audio / particle feedback.
    }

    // ---------------------------------------------------------------
    // Camera - upward-only follow (auto-scroll lands in Phase 4)
    // ---------------------------------------------------------------
    updateCamera(dt) {
      const p = this.player;
      // Desired camera top-left world y so player sits ~60% down the screen.
      const desired = p.y - this.H * 0.62;
      if (desired < this.cameraY) {
        // Smooth upward chase
        this.cameraY = Phaser.Math.Linear(this.cameraY, desired, 0.18);
      }
      this.cameras.main.setScroll(0, this.cameraY);
    }

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    drawFloors() {
      const g = this.floorsGfx;
      g.clear();
      const viewTop = this.cameraY - 20;
      const viewBottom = this.cameraY + this.H + 20;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < viewTop || f.y > viewBottom) continue;
        const theme = this.floorTheme(f.n);
        // Shadow strip under the floor
        g.fillStyle(0x000000, 0.25);
        g.fillRect(f.x + 2, f.y + f.h, f.w, 3);
        // Side color (thickness)
        g.fillStyle(theme.side, 1);
        g.fillRect(f.x, f.y, f.w, f.h);
        // Top highlight
        g.fillStyle(theme.top, 1);
        g.fillRect(f.x, f.y, f.w, 3);
        // Glint ticks
        g.fillStyle(0xffffff, 0.55);
        for (let t = 0; t < f.w; t += 24) {
          g.fillRect(f.x + t + 6, f.y + 1, 4, 1);
        }
      }
    }

    drawWalls() {
      const g = this.wallsGfx;
      g.clear();
      const theme = this.floorTheme(this.player.highestFloor);
      const top = this.cameraY - 20;
      const h = this.H + 40;

      // Left wall
      g.fillStyle(theme.wall, 1);
      g.fillRect(0, top, CFG.WALL_THICKNESS, h);
      // Right wall
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, CFG.WALL_THICKNESS, h);

      // Inner edge highlight
      g.fillStyle(0xffffff, 0.08);
      g.fillRect(CFG.WALL_THICKNESS - 2, top, 2, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, 2, h);

      // Brick hatching
      g.fillStyle(0x000000, 0.22);
      const startRow = Math.floor(top / 16) * 16;
      for (let y = startRow; y < top + h; y += 16) {
        g.fillRect(0, y, CFG.WALL_THICKNESS, 1);
        g.fillRect(this.W - CFG.WALL_THICKNESS, y, CFG.WALL_THICKNESS, 1);
      }
    }

    update(_time, delta) {
      const dt = Math.min(delta / 1000, 1 / 30);
      this.readInput();
      this.updatePhysics(dt);
      this.updateCamera(dt);
      this.drawWalls();
      this.drawFloors();
      this.drawPlayer();
    }
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#05080f",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: window.innerWidth,
      height: window.innerHeight,
    },
    render: {
      pixelArt: true,
      antialias: false,
      roundPixels: true,
    },
    scene: [GameScene],
  };

  // eslint-disable-next-line no-unused-vars
  const game = new Phaser.Game(config);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Frostspire</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05080f;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #fff;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script>
  "use strict";

  // ================================================================
  // FROSTSPIRE - Icy-Tower-inspired vertical climber
  // Single-file browser game, Phaser 3.
  // ================================================================

  const CFG = {
    // Horizontal
    MAX_H_SPEED: 400,
    GROUND_ACCEL: 1000,
    GROUND_FRICTION: 1333,
    AIR_ACCEL: 600,

    // Vertical / jump
    GRAVITY: 800,
    BASE_JUMP: 300,
    BONUS_JUMP: 350,

    // Input feel - tight chain-jump response
    JUMP_BUFFER_MS: 150,
    COYOTE_MS: 80,

    // Floors
    FLOOR_HEIGHT: 50,
    FLOOR_THICKNESS: 10,
    FLOOR_MIN_WIDTH_PX: 60,
    FLOOR_WIDTH_JITTER: 0.15,

    // Walls
    WALL_THICKNESS: 36,
    WALL_BOUNCE_WINDOW_MS: 100,

    // Character
    CHAR_W: 22,
    CHAR_H: 32,

    // Combo
    COMBO_MIN_FLOORS: 2,
    COMBO_TIMEOUT_MS: 3000,
    POINTS_PER_FLOOR: 10,

    // Scroll escalation
    SCROLL_START_FLOOR: 5,
    SCROLL_INITIAL_SPEED: 30,
    SCROLL_INCREMENT: 20,
    SCROLL_INCREMENT_MS: 30000,

    // Misc
    MILESTONES: [100, 250, 500, 1000],
    GHOST_SAMPLE_MS: 100,
    FLIP_MIN_SPEED_FRAC: 0.7,
  };

  const LS_KEYS = {
    bestScore:    "frostspire.bestScore",
    bestFloor:    "frostspire.bestFloor",
    longestCombo: "frostspire.longestCombo",
    bestFlips:    "frostspire.bestFlips",
    character:    "frostspire.character",
    ghost:        "frostspire.ghost",
    tiltInvert:   "frostspire.tiltInvert",
  };

  function lsGetInt(k, d) {
    try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : d; }
    catch (_) { return d; }
  }
  function lsGetJSON(k, d) {
    try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; }
    catch (_) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); }
    catch (_) {}
  }
  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    return (
      (Math.round(ar + (br - ar) * t) << 16) |
      (Math.round(ag + (bg - ag) * t) << 8) |
      Math.round(ab + (bb - ab) * t)
    );
  }

  class GameScene extends Phaser.Scene {
    constructor() { super("game"); }

    create() {
      this.W = this.scale.gameSize.width;
      this.H = this.scale.gameSize.height;

      // Persistent bests
      this.best = {
        score:        lsGetInt(LS_KEYS.bestScore, 0),
        floor:        lsGetInt(LS_KEYS.bestFloor, 0),
        longestCombo: lsGetInt(LS_KEYS.longestCombo, 0),
        flips:        lsGetInt(LS_KEYS.bestFlips, 0),
      };

      // Render layers (depth-ordered)
      this.bgGfx        = this.add.graphics().setDepth(-10);
      this.wallsGfx     = this.add.graphics().setDepth(-5);
      this.floorsGfx    = this.add.graphics().setDepth(0);
      this.particlesGfx = this.add.graphics().setDepth(5);
      this.ghostGfx     = this.add.graphics().setDepth(8).setAlpha(0.30);
      this.playerGfx    = this.add.graphics().setDepth(10);

      this.cameras.main.setBackgroundColor("#05080f");

      this.scale.on("resize", this.onResize, this);

      this.setupInput();
      this.resetRun();

      this.drawBackground();
    }

    onResize(sz) {
      this.W = sz.width;
      this.H = sz.height;
      this.drawBackground();
      // Floor 0 stretches to fill the width
      if (this.floors && this.floors[0]) {
        this.floors[0].x = 0;
        this.floors[0].w = this.W;
      }
    }

    drawBackground() {
      const g = this.bgGfx;
      g.clear();
      g.fillStyle(0x05080f, 1);
      g.fillRect(0, 0, this.W, this.H);
    }

    // -----------------------------------------------------------
    // Input - keyboard for Phase 2. Tilt + touch land in Phase 8.
    // -----------------------------------------------------------
    setupInput() {
      this.keys = this.input.keyboard.addKeys({
        left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        up:    Phaser.Input.Keyboard.KeyCodes.UP,
        a:     Phaser.Input.Keyboard.KeyCodes.A,
        d:     Phaser.Input.Keyboard.KeyCodes.D,
        w:     Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      this.input.keyboard.addCapture("LEFT,RIGHT,UP,DOWN,SPACE");

      this.axisX = 0;
      this.jumpBufferUntil = 0;   // time.now deadline for buffered jump
      this.lastGroundTime = 0;    // last ms the player was grounded
    }

    readInput() {
      const k = this.keys;
      let ax = 0;
      if (k.left.isDown  || k.a.isDown) ax -= 1;
      if (k.right.isDown || k.d.isDown) ax += 1;
      this.axisX = ax;

      // Any jump keydown refreshes the buffer.
      if (
        Phaser.Input.Keyboard.JustDown(k.up) ||
        Phaser.Input.Keyboard.JustDown(k.w)  ||
        Phaser.Input.Keyboard.JustDown(k.space)
      ) {
        this.jumpBufferUntil = this.time.now + CFG.JUMP_BUFFER_MS;
      }
    }

    // A jump fires when the player has a live buffer AND is jumpable
    // (on ground, OR within the coyote window after leaving ground).
    shouldJumpNow() {
      if (this.time.now > this.jumpBufferUntil) return false;
      if (this.player.onGround) return true;
      if (this.time.now - this.lastGroundTime <= CFG.COYOTE_MS) return true;
      return false;
    }

    // -----------------------------------------------------------
    // Run lifecycle
    // -----------------------------------------------------------
    resetRun() {
      // Floor 0's top-surface y lives here (world coords, lower-right-down).
      this.FLOOR0_Y = this.H - 80;

      this.player = {
        x: this.W / 2,
        y: this.FLOOR0_Y,
        prevY: this.FLOOR0_Y,
        vx: 0,
        vy: 0,
        w: CFG.CHAR_W,
        h: CFG.CHAR_H,
        onGround: true,
        facing: 1,
        runPhase: 0,
        crouchT: 0,
        // Wall bounce bookkeeping
        wallHitTime: 0,
        wallHitSide: 0,
        wallBounceArmed: false,
        // Floor tracking
        currentFloor: 0,
        highestFloor: 0,
        jumpStartFloor: 0,
      };

      // Procedural floors
      this.floors = [];
      this.maxSpawnedFloor = -1;
      for (let n = 0; n <= 60; n++) this._createFloor(n);

      // Camera
      this.cameras.main.setScroll(0, 0);
      this.cameraY = 0;
    }

    // -----------------------------------------------------------
    // Floor generation
    // -----------------------------------------------------------
    floorY(n) { return this.FLOOR0_Y - n * CFG.FLOOR_HEIGHT; }

    floorWidthFrac(n) {
      if (n <= 0) return 1.0;
      if (n < 200) return 0.70 - 0.30 * (n / 200);
      if (n < 500) return 0.40 - 0.15 * ((n - 200) / 300);
      return Math.max(0.15, 0.25 - (n - 500) * 0.0002);
    }

    _createFloor(n) {
      const y = this.floorY(n);
      let f;
      if (n === 0) {
        f = { n: 0, x: 0, y, w: this.W, h: CFG.FLOOR_THICKNESS };
      } else {
        const frac = this.floorWidthFrac(n);
        const jitter = 1 + (Math.random() * 2 - 1) * CFG.FLOOR_WIDTH_JITTER;
        const availW = this.W - CFG.WALL_THICKNESS * 2;
        let w = Math.max(CFG.FLOOR_MIN_WIDTH_PX, availW * frac * jitter);
        w = Math.min(w, availW - 10);
        const slack = availW - w;
        const x = CFG.WALL_THICKNESS + Math.random() * slack;
        f = { n, x, y, w, h: CFG.FLOOR_THICKNESS };
      }
      this.floors.push(f);
      this.maxSpawnedFloor = n;
    }

    // Pixel-art climber. Rendered relative to (0,0) = body center
    // so Phase 6's flip can rotate the Graphics object directly.
    drawPlayer() {
      const p = this.player;
      const g = this.playerGfx;
      g.clear();

      const crouch = p.crouchT;
      const squash = 1 - crouch * 0.2;
      const stretch = p.onGround ? 1 : 1.05;
      const h = p.h * squash * stretch;
      const w = p.w;
      const airborne = !p.onGround;
      const speedFrac = Phaser.Math.Clamp(Math.abs(p.vx) / CFG.MAX_H_SPEED, 0, 1);
      const lean = p.onGround ? p.facing * speedFrac * 4 : 0;

      // Position + facing applied via Graphics transform
      g.x = p.x;
      g.y = p.y - h / 2;
      g.rotation = 0;
      g.scaleX = p.facing < 0 ? -1 : 1;
      g.scaleY = 1;

      const bx = -w / 2;
      const by = -h / 2;

      // --- Legs ---
      const legW = 5;
      const legH = Math.max(4, h * 0.28);
      const legY = by + h - legH;
      const legSpread = w * 0.25;
      const legLX = -legSpread - legW / 2;
      const legRX =  legSpread - legW / 2;

      g.fillStyle(0x2b2b30, 1);
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX, tuckY, legW, legH);
        g.fillRect(legRX, tuckY, legW, legH);
      } else if (Math.abs(p.vx) > 20) {
        const s = Math.sin(p.runPhase);
        const off = s * legH * 0.4;
        g.fillRect(legLX, legY - off, legW, legH);
        g.fillRect(legRX, legY + off, legW, legH);
      } else {
        g.fillRect(legLX, legY, legW, legH);
        g.fillRect(legRX, legY, legW, legH);
      }

      // Boots
      g.fillStyle(0x111318, 1);
      const bootH = 3;
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX - 1, tuckY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, tuckY + legH - bootH, legW + 2, bootH);
      } else {
        g.fillRect(legLX - 1, legY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, legY + legH - bootH, legW + 2, bootH);
      }

      // Parka body
      const bodyH = h * 0.46;
      const bodyY = by + h * 0.30;
      const bodyX = bx + lean;
      g.fillStyle(0x2e84d6, 1);
      g.fillRect(bodyX, bodyY, w, bodyH);
      g.fillStyle(0xffffff, 1);
      g.fillRect(bodyX, bodyY + bodyH - 3, w, 3);

      // Arms
      g.fillStyle(0x2067b0, 1);
      const armW = 4, armH = bodyH * 0.8;
      if (airborne) {
        g.fillRect(bodyX - armW + 1, bodyY - armH * 0.4, armW, armH);
        g.fillRect(bodyX + w - 1,    bodyY - armH * 0.4, armW, armH);
      } else {
        const armSwing = Math.abs(p.vx) > 20 ? Math.sin(p.runPhase + Math.PI) * 4 : 0;
        g.fillRect(bodyX - armW + 1, bodyY + armSwing, armW, armH);
        g.fillRect(bodyX + w - 1,    bodyY - armSwing, armW, armH);
      }

      // Head + beanie + goggles
      const headW = w - 4;
      const headH = h * 0.30;
      const headX = bx + 2 + lean;
      const headY = by;
      g.fillStyle(0xf2d1a8, 1);
      g.fillRect(headX, headY + 4, headW, headH - 4);
      g.fillStyle(0xd03030, 1);
      g.fillRect(headX, headY, headW, 6);
      g.fillStyle(0xffffff, 1);
      g.fillRect(headX, headY - 2, 4, 3);
      g.fillRect(headX + 4, headY - 0.5, headW - 4, 1.5);
      g.fillStyle(0x1a1a1a, 1);
      g.fillRect(headX, headY + 7, headW, 4);
      g.fillStyle(0xff9a3d, 1);
      g.fillRect(headX + headW - 7, headY + 8, 5, 2);

      // Scarf flutter
      g.fillStyle(0xffdc4a, 1);
      const scarfY = bodyY + 2;
      const flutter = Math.sin(this.time.now * 0.02) * 2;
      g.fillRect(bodyX - 3, scarfY, 3, 4);
      g.fillRect(bodyX - 5, scarfY + 2 + flutter, 3, 3);
    }

    // -----------------------------------------------------------
    // Physics
    // -----------------------------------------------------------
    updatePhysics(dt) {
      const p = this.player;
      const ax = this.axisX;

      // Horizontal accel / friction
      if (ax !== 0) {
        const a = p.onGround ? CFG.GROUND_ACCEL : CFG.AIR_ACCEL;
        p.vx += ax * a * dt;
        p.vx = Phaser.Math.Clamp(p.vx, -CFG.MAX_H_SPEED, CFG.MAX_H_SPEED);
        p.facing = ax > 0 ? 1 : -1;
      } else if (p.onGround) {
        const dec = CFG.GROUND_FRICTION * dt;
        if (Math.abs(p.vx) <= dec) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * dec;
      }

      // Buffered jump - fires instantly on landing for chain-jumps
      if (this.shouldJumpNow()) {
        const speedFrac = Math.abs(p.vx) / CFG.MAX_H_SPEED;
        p.vy = -(CFG.BASE_JUMP + speedFrac * CFG.BONUS_JUMP);
        p.onGround = false;
        p.jumpStartFloor = p.currentFloor;
        this.jumpBufferUntil = 0;
      }

      // Gravity + integrate
      p.vy += CFG.GRAVITY * dt;
      p.prevY = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      this.resolveFloorCollision();
      this.resolveWallCollision();

      if (p.onGround) this.lastGroundTime = this.time.now;

      // Animation state
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.runPhase += (Math.abs(p.vx) / CFG.MAX_H_SPEED) * 18 * dt;
      } else if (!p.onGround) {
        p.runPhase = 0;
      }
      if (p.crouchT > 0) p.crouchT = Math.max(0, p.crouchT - dt / 0.15);
    }

    // One-way platforms - only land from above, pass up through.
    resolveFloorCollision() {
      const p = this.player;
      if (p.vy < 0) return;   // rising: ignore all floors

      const halfW = p.w / 2;
      const prevFeet = p.prevY;
      const curFeet  = p.y;

      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        const top = f.y;
        if (prevFeet <= top && curFeet >= top) {
          if (p.x + halfW > f.x && p.x - halfW < f.x + f.w) {
            p.y = top;
            p.vy = 0;
            const wasAir = !p.onGround;
            p.onGround = true;
            if (wasAir) this.onLand(f);
            break;
          }
        }
      }
    }

    // Wall bounce: hit wall reverses vx, opens a 100ms window where
    // pressing the opposite direction key preserves full momentum.
    // Otherwise horizontal momentum is lost (vertical keeps falling).
    resolveWallCollision() {
      const p = this.player;
      const halfW = p.w / 2;
      const leftBound  = CFG.WALL_THICKNESS + halfW;
      const rightBound = this.W - CFG.WALL_THICKNESS - halfW;
      const now = this.time.now;

      if (p.x < leftBound && p.vx <= 0) {
        p.x = leftBound;
        p.vx = Math.abs(p.vx);       // bounce off
        p.wallHitTime = now;
        p.wallHitSide = -1;
        p.wallBounceArmed = true;
      } else if (p.x > rightBound && p.vx >= 0) {
        p.x = rightBound;
        p.vx = -Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = 1;
        p.wallBounceArmed = true;
      }

      if (p.wallBounceArmed) {
        const elapsed = now - p.wallHitTime;
        const inputAway =
          (p.wallHitSide === 1  && this.axisX < -0.1) ||
          (p.wallHitSide === -1 && this.axisX >  0.1);

        if (inputAway && elapsed <= CFG.WALL_BOUNCE_WINDOW_MS) {
          const dir = -p.wallHitSide;
          p.vx = dir * CFG.MAX_H_SPEED;  // full momentum restored
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
          this.onWallBounce();
        } else if (elapsed > CFG.WALL_BOUNCE_WINDOW_MS) {
          p.vx = 0;                      // lose horizontal momentum
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
        }
      }
    }

    onLand(floor) {
      const p = this.player;
      p.crouchT = 1;
      p.currentFloor = floor.n;
      if (floor.n > p.highestFloor) {
        p.highestFloor = floor.n;
        // Keep the tower built well above the player
        const wantUpTo = floor.n + 80;
        if (wantUpTo > this.maxSpawnedFloor) {
          for (let k = this.maxSpawnedFloor + 1; k <= wantUpTo; k++) this._createFloor(k);
        }
      }
    }

    onWallBounce() {
      // Phase 7 plays audio here. Phase 6 adds particles.
    }

    // -----------------------------------------------------------
    // Camera - upward-only follow (auto-scroll lands in Phase 4)
    // -----------------------------------------------------------
    updateCamera() {
      const p = this.player;
      const desired = p.y - this.H * 0.62;
      if (desired < this.cameraY) {
        this.cameraY = Phaser.Math.Linear(this.cameraY, desired, 0.18);
      }
      this.cameras.main.setScroll(0, this.cameraY);
    }

    // -----------------------------------------------------------
    // Rendering - floors + walls
    // -----------------------------------------------------------
    floorTheme(n) {
      if (n < 100) return { top: 0x9cd9ff, side: 0x4aa8e0, wall: 0x2a5c8c };
      if (n < 200) return { top: 0xc9c9c9, side: 0x6a6a6a, wall: 0x333333 };
      if (n < 300) return { top: 0xffb27a, side: 0xcc3a0a, wall: 0x5a1400 };
      if (n < 400) return { top: 0xb8f0a8, side: 0x2a7a38, wall: 0x14401e };
      return           { top: 0xd8c0ff, side: 0x5e3fa0, wall: 0x261048 };
    }

    drawFloors() {
      const g = this.floorsGfx;
      g.clear();
      const top = this.cameraY - 20;
      const bot = this.cameraY + this.H + 20;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < top || f.y > bot) continue;
        const th = this.floorTheme(f.n);
        g.fillStyle(0x000000, 0.35);
        g.fillRect(f.x + 2, f.y + f.h, f.w, 4);
        g.fillStyle(th.side, 1);
        g.fillRect(f.x, f.y, f.w, f.h);
        g.fillStyle(th.top, 1);
        g.fillRect(f.x, f.y, f.w, 3);
        g.fillStyle(0xffffff, 0.6);
        for (let t = 0; t < f.w; t += 24) g.fillRect(f.x + t + 6, f.y + 1, 4, 1);
      }
    }

    drawWalls() {
      const g = this.wallsGfx;
      g.clear();
      const n = this.player.highestFloor;
      const th = this.floorTheme(n);
      const top = this.cameraY - 20;
      const h   = this.H + 40;
      g.fillStyle(th.wall, 1);
      g.fillRect(0, top, CFG.WALL_THICKNESS, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, CFG.WALL_THICKNESS, h);
      g.fillStyle(0xffffff, 0.08);
      g.fillRect(CFG.WALL_THICKNESS - 2, top, 2, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, 2, h);
      g.fillStyle(0x000000, 0.25);
      const start = Math.floor(top / 16) * 16;
      for (let y = start; y < top + h; y += 16) {
        g.fillRect(0, y, CFG.WALL_THICKNESS, 1);
        g.fillRect(this.W - CFG.WALL_THICKNESS, y, CFG.WALL_THICKNESS, 1);
      }
    }

    update(_t, delta) {
      const dt = Math.min(delta / 1000, 1 / 30);
      this.readInput();
      this.updatePhysics(dt);
      this.updateCamera();
      this.drawWalls();
      this.drawFloors();
      this.drawPlayer();
    }
  }

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#05080f",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: window.innerWidth,
      height: window.innerHeight,
    },
    render: { pixelArt: true, antialias: false, roundPixels: true },
    scene: [GameScene],
  });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Frostspire</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05080f;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #fff;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    canvas { display: block; }

    /* ----- Overlays (DOM for rock-solid mobile reliability) ----- */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      box-sizing: border-box;
      background: rgba(5, 8, 15, 0.82);
      z-index: 50;
      gap: 12px;
      text-align: center;
    }
    .overlay.on { display: flex; }
    .overlay h1 {
      margin: 0;
      font: 700 clamp(28px, 9vmin, 72px)/1 "Courier New", monospace;
      letter-spacing: 2px;
    }
    .overlay .stat-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font: 700 clamp(14px, 3.5vmin, 20px)/1.3 "Courier New", monospace;
      color: #9cd9ff;
    }
    .overlay .stat-block .best {
      color: #ffdf3c;
      font-size: clamp(12px, 3vmin, 17px);
    }
    .overlay button {
      width: min(80vw, 320px);
      padding: 16px 18px;
      border-radius: 14px;
      border: 3px solid #9cd9ff;
      background: #2e84d6;
      color: #fff;
      font: 700 clamp(15px, 4vmin, 22px)/1 "Courier New", monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .overlay button:active { transform: translateY(2px); }
    .overlay button.secondary { background: #444b66; border-color: #ffdf3c; }
    .overlay button.tertiary  { background: #1a1a24; border-color: #ffdf3c; color: #ffdf3c; }

    #hurry-up {
      position: fixed;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      font: 900 clamp(32px, 10vmin, 90px)/1 "Courier New", monospace;
      color: #ff3a3a;
      text-shadow: 0 0 8px #000, 0 0 16px #ff3a3a;
      letter-spacing: 4px;
      z-index: 40;
      display: none;
      animation: hurry-pulse 0.25s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Tilt enable button (iOS 13+ permission gate). Small, top-center.
       z-index above overlays so it's tappable even on the title screen. */
    #tilt-enable {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(20, 90, 180, 0.95);
      color: #fff;
      border: 2px solid #9cd9ff;
      border-radius: 10px;
      font: 700 11px/1 "Courier New", monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: none;
      z-index: 70;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    #share-toast {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #9cd9ff;
      border-radius: 8px;
      color: #fff;
      font: 700 13px/1 "Courier New", monospace;
      letter-spacing: 1px;
      display: none;
      z-index: 60;
    }
    @keyframes hurry-pulse {
      from { transform: translateX(-50%) scale(1);    opacity: 1;   }
      to   { transform: translateX(-50%) scale(1.08); opacity: 0.6; }
    }

    /* Pause button - always visible during play, top-right */
    #pause-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid #9cd9ff;
      background: rgba(0, 0, 0, 0.55);
      color: #9cd9ff;
      font: 700 22px/1 "Courier New", monospace;
      display: none;
      z-index: 35;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #title .logo {
      font: 900 clamp(40px, 14vmin, 120px)/1 "Courier New", monospace;
      color: #9cd9ff;
      text-shadow: 0 0 12px #0b2848, 6px 6px 0 #000;
      letter-spacing: 6px;
      margin-bottom: 4px;
    }
    #title .subtitle {
      font: 700 clamp(12px, 3vmin, 18px)/1 "Courier New", monospace;
      color: #ffdf3c;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    #title .hint {
      font: 700 clamp(10px, 2.4vmin, 14px)/1.4 "Courier New", monospace;
      color: #9cd9ff;
      letter-spacing: 1px;
      margin-top: 12px;
    }
    #title .selchar {
      font: 700 clamp(11px, 2.6vmin, 15px)/1 "Courier New", monospace;
      color: #ffffff;
      margin-top: 4px;
    }

    #character-select .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: min(92vw, 520px);
      max-height: 60vh;
      overflow-y: auto;
      padding: 6px;
    }
    @media (min-width: 640px) {
      #character-select .grid { grid-template-columns: repeat(3, 1fr); }
    }
    #character-select .cell {
      background: rgba(18, 24, 42, 0.95);
      border: 3px solid #9cd9ff;
      border-radius: 12px;
      padding: 10px 6px;
      font: 700 clamp(10px, 2.6vmin, 14px)/1.2 "Courier New", monospace;
      color: #fff;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    #character-select .cell.sel {
      background: rgba(34, 59, 102, 0.95);
      border-color: #ffdf3c;
      color: #ffdf3c;
    }

    #countdown {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.60);
      z-index: 55;
      pointer-events: none;
    }
    #countdown .num {
      font: 900 min(40vw, 240px)/1 "Courier New", monospace;
      color: #ffdf3c;
      text-shadow: 0 0 12px #000;
    }
    #countdown .sub {
      font: 700 min(6vw, 36px)/1 "Courier New", monospace;
      color: #fff;
      margin-top: 20px;
      text-shadow: 0 3px 10px #000;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Game Over overlay (DOM - clicks are 100% reliable on iOS) -->
  <div id="gameover" class="overlay">
    <h1 style="color:#ff5a5a;">GAME OVER</h1>
    <div class="stat-block">
      <div>FLOOR <span id="go-floor">0</span></div>
      <div>SCORE <span id="go-score">0</span></div>
      <div class="best">BEST FLOOR <span id="go-best-floor">0</span></div>
      <div class="best">BEST SCORE <span id="go-best-score">0</span></div>
    </div>
    <button id="btn-restart">&#9654;  RESTART</button>
    <button id="btn-share" class="secondary">SHARE SCORE</button>
    <button id="btn-flip-tilt" class="tertiary" style="display:none;">FLIP TILT DIRECTION</button>
  </div>

  <div id="hurry-up">HURRY UP!</div>
  <button id="tilt-enable" type="button">Enable Tilt Controls</button>
  <div id="share-toast">COPIED!</div>

  <!-- Always-visible in-game PAUSE button -->
  <button id="pause-btn" type="button" aria-label="Pause">&#10074;&#10074;</button>

  <!-- Title screen -->
  <div id="title" class="overlay on">
    <div class="logo">FROSTSPIRE</div>
    <div class="subtitle">A VERTICAL CLIMB</div>
    <div id="title-preview" style="margin: 4px 0 0;"></div>
    <div id="title-selchar" class="selchar">SELECTED: ARCTIC CLIMBER</div>
    <button id="btn-start">&#9654;  START GAME</button>
    <button id="btn-title-char" class="tertiary">CHOOSE CHARACTER &#9654;</button>
    <div class="hint">
      DESKTOP: &#8592; &#8594; / A D &nbsp;+&nbsp; SPACE<br>
      MOBILE: TILT OR LEFT/RIGHT HALF &nbsp;+&nbsp; TAP
    </div>
  </div>

  <!-- Pause menu -->
  <div id="pause-menu" class="overlay">
    <h1 style="color:#9cd9ff;">PAUSED</h1>
    <button id="btn-resume">&#9654;  RESUME</button>
    <button id="btn-pause-char" class="tertiary">CHARACTER</button>
    <button id="btn-mute"       class="secondary">MUTE</button>
    <button id="btn-pause-restart" class="secondary">RESTART</button>
    <button id="btn-home"       class="secondary">HOME</button>
  </div>

  <!-- Character select -->
  <div id="character-select" class="overlay">
    <h1 style="color:#ffdf3c; font-size: clamp(22px, 6vmin, 44px);">CHOOSE A CLIMBER</h1>
    <div class="grid" id="char-grid"></div>
    <button id="btn-char-close" class="secondary">CLOSE</button>
  </div>

  <!-- Countdown -->
  <div id="countdown">
    <div class="num" id="cd-num">3</div>
    <div class="sub" id="cd-sub">GET READY</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  function lsGetInt(k, d) {
    try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : d; }
    catch (_) { return d; }
  }
  function lsGetJSON(k, d) {
    try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; }
    catch (_) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); }
    catch (_) {}
  }
  function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    return (
      (Math.round(ar + (br - ar) * t) << 16) |
      (Math.round(ag + (bg - ag) * t) << 8) |
      Math.round(ab + (bb - ab) * t)
    );
  }

  // ================================================================
  // AudioMgr - procedural Web Audio (no files)
  // ================================================================
  class AudioMgr {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.muted = false;
    }
    init() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        this.ctx = new Ctor();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.55;
        this.master.connect(this.ctx.destination);
        if (this.ctx.state === "suspended") this.ctx.resume();
      } catch (_) {}
    }
    toggleMute() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
      return this.muted;
    }
    _blip(opts) {
      if (!this.ctx || this.muted) return;
      const ctx = this.ctx;
      const now = ctx.currentTime + (opts.delay || 0);
      const dur = opts.dur || 0.08;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = opts.type || "sine";
      osc.frequency.setValueAtTime(opts.f0, now);
      if (opts.f1 != null) {
        if (opts.linear) osc.frequency.linearRampToValueAtTime(opts.f1, now + dur);
        else osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.f1), now + dur);
      }
      const peak = opts.vol != null ? opts.vol : 0.22;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + Math.min(0.01, dur * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain).connect(this.master);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }
    _noise(dur, vol, bp) {
      if (!this.ctx || this.muted) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = vol;
      if (bp) {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass"; f.frequency.value = bp; f.Q.value = 6;
        src.connect(f).connect(g).connect(this.master);
      } else {
        src.connect(g).connect(this.master);
      }
      src.start(now);
      src.stop(now + dur + 0.02);
    }
    jump(sf) {
      this._blip({ type: "square",   f0: 140, f1: 320 + sf * 300, dur: 0.08, vol: 0.22 });
      this._blip({ type: "triangle", f0: 280, f1: (320 + sf * 300) * 1.5, dur: 0.08, vol: 0.08 });
    }
    land(impact) {
      this._blip({ type: "sine", f0: 160, f1: 60, dur: 0.06, vol: 0.20 + impact * 0.1 });
      this._noise(0.05, 0.08 + impact * 0.05, 220);
    }
    wallBounce() {
      this._blip({ type: "triangle", f0: 1400, f1: 2600, dur: 0.05, vol: 0.20, linear: true });
      this._blip({ type: "square",   f0: 900,  f1: 1700, dur: 0.04, vol: 0.10, linear: true, delay: 0.005 });
    }
    comboReward(tier) {
      const base = 523 + tier * 40;
      [base, base * 1.26, base * 1.50].forEach((f, i) =>
        this._blip({ type: "triangle", f0: f, dur: 0.18, vol: 0.18, delay: i * 0.09 })
      );
    }
    hurryUp() {
      this._blip({ type: "square", f0: 880, f1: 600, dur: 0.1, vol: 0.22, linear: true });
      this._blip({ type: "square", f0: 880, f1: 600, dur: 0.1, vol: 0.22, linear: true, delay: 0.14 });
    }
    gameOver() {
      [523, 440, 349, 262, 196].forEach((f, i) =>
        this._blip({ type: "triangle", f0: f, dur: 0.22, vol: 0.20, delay: i * 0.18 })
      );
    }
    milestone() {
      [523, 659, 784, 1047].forEach((f, i) =>
        this._blip({ type: "triangle", f0: f, dur: 0.22, vol: 0.20, delay: i * 0.1 })
      );
    }
  }

  class GameScene extends Phaser.Scene {
    constructor() { super("game"); }

    create() {
      this.W = this.scale.gameSize.width;
      this.H = this.scale.gameSize.height;

      // Persistent bests
      this.best = {
        score:        lsGetInt(LS_KEYS.bestScore, 0),
        floor:        lsGetInt(LS_KEYS.bestFloor, 0),
        longestCombo: lsGetInt(LS_KEYS.longestCombo, 0),
        flips:        lsGetInt(LS_KEYS.bestFlips, 0),
      };

      // Unlock Phaser's pointer pool so two-thumb mobile play actually
      // gets concurrent pointer events instead of queueing the second
      // thumb behind the first. Default is 1 touch pointer; we need 3
      // to handle thumb-over-thumb switching without starvation.
      this.input.addPointer(2);

      // Load art via native DOM Image (bypasses Phaser's loader entirely).
      // Data URIs load synchronously in the browser, onload fires immediately.
      this._artReady = false;
      this._floorPool = [];
      const artKeys = [
        ["bg-ice",    ASSETS.bgIce],
        ["floor-ice", ASSETS.floorIce],
        ["wall-ice",  ASSETS.wallIce],
      ];
      let remaining = artKeys.length;
      artKeys.forEach(([key, uri]) => {
        const img = new Image();
        img.onload = () => {
          this.textures.addImage(key, img);
          remaining--;
          if (remaining <= 0) {
            this._artReady = true;
            this._buildArtSprites();
          }
        };
        img.src = uri;
      });

      // Render layers (depth-ordered)
      this.bgGfx        = this.add.graphics().setDepth(-10);
      this.wallsGfx     = this.add.graphics().setDepth(-5);
      this.floorsGfx    = this.add.graphics().setDepth(0);
      this.particlesGfx = this.add.graphics().setDepth(5);
      this.ghostGfx     = this.add.graphics().setDepth(8).setAlpha(0.30);
      this.playerGfx    = this.add.graphics().setDepth(10);

      this.cameras.main.setBackgroundColor("#05080f");

      this.scale.on("resize", this.onResize, this);

      this.audio = new AudioMgr();
      this.input.once("pointerdown", () => this.audio.init());
      this.input.keyboard.on("keydown", () => this.audio.init());
      this.input.keyboard.on("keydown-M", () => this.audio.toggleMute());

      this.setupInput();
      this.resetRun();
      this.bindDomUI();

      // Start on title screen. Physics frozen via state = "title".
      this.state = "title";
      this.gameOver = true;  // prevents physics/checkGameOver until start

      this.drawBackground();
    }

    bindDomUI() {
      const $ = (id) => document.getElementById(id);
      this.dom = {
        gameover:   $("gameover"),
        goFloor:    $("go-floor"),
        goScore:    $("go-score"),
        goBestF:    $("go-best-floor"),
        goBestS:    $("go-best-score"),
        btnRestart: $("btn-restart"),

        title:      $("title"),
        btnStart:   $("btn-start"),
        btnTitleChar:$("btn-title-char"),
        titleSelChar:$("title-selchar"),
        titlePreview:$("title-preview"),
        pauseMenu:  $("pause-menu"),
        btnResume:  $("btn-resume"),
        btnPauseChar:$("btn-pause-char"),

      this.dom.btnFlipTilt.addEventListener("click", () => {
        this.tilt.invert = !this.tilt.invert;
        lsSet(LS_KEYS.tiltInvert, this.tilt.invert ? "1" : "0");
        this.dom.btnFlipTilt.textContent = "FLIP TILT: " + (this.tilt.invert ? "ON" : "OFF");
      });

      this.dom.btnStart.addEventListener("click", () => this.startFromTitle());
      this.dom.btnTitleChar.addEventListener("click", () => this.openCharacterSelect("title"));
      this.dom.pauseBtn.addEventListener("click", () => this.togglePause());
      this.dom.btnResume.addEventListener("click", () => this.requestResume());
      this.dom.btnPauseChar.addEventListener("click", () => this.openCharacterSelect("pause"));
      this.dom.btnMute.addEventListener("click", () => {
        const muted = this.audio.toggleMute();
        this.dom.btnMute.textContent = muted ? "UNMUTE" : "MUTE";
      });
      this.dom.btnPauseRestart.addEventListener("click", () => {
        this.closePauseMenu();
        this.restartRun();
      });
      this.dom.btnHome.addEventListener("click", () => {
        this.closePauseMenu();
        this.goToTitle();
      });
      this.dom.btnCharClose.addEventListener("click", () => this.closeCharacterSelect());

      // Keyboard: P / Esc to toggle pause during play
      this.input.keyboard.on("keydown-P",   () => this.togglePause());
      this.input.keyboard.on("keydown-ESC", () => this.togglePause());

      this.state = "title";
      this.refreshTitlePreview();
    }

    // Title preview uses a tiny inline SVG-ish via Phaser canvas... actually
    // easier: draw the current character to a throwaway Graphics, rasterize
    // to a small image, and place it in #title-preview.
    // For simplicity we just render the name in the title (the big
    // character preview would require more code). The live game is the
    // preview once you hit START.
    refreshTitlePreview() {
      const entry = CHARACTERS.find(c => c.id === this.characterId) || CHARACTERS[0];
      this.dom.titleSelChar.textContent = "SELECTED: " + entry.name;
    }

    setOverlay(id, on) {
      const el = this.dom[id];
      if (!el) return;
      if (on) el.classList.add("on");
      else    el.classList.remove("on");
    }

    // -----------------------------------------------------------
    // State transitions
    // -----------------------------------------------------------
    startFromTitle() {
      if (this.audio) this.audio.init();
      this.setOverlay("title", false);
      this.dom.pauseBtn.style.display = "block";
      this.state = "playing";
      this.resetRun();
    }

    goToTitle() {
      this.setOverlay("gameover", false);
      this.setOverlay("pauseMenu", false);
      this.setOverlay("charSel", false);
      this.dom.pauseBtn.style.display = "none";
      this.setOverlay("title", true);
      this.state = "title";
      this.refreshTitlePreview();
      this.gameOver = true; // freeze physics until start clicked
    }

    togglePause() {
      if (this.state === "playing") this.openPauseMenu();
      else if (this.state === "paused") this.requestResume();
    }
    openPauseMenu() {
      this.state = "paused";
      this.dom.btnMute.textContent = this.audio.muted ? "UNMUTE" : "MUTE";
      this.setOverlay("pauseMenu", true);
      this.dom.pauseBtn.style.display = "none";
    }
    closePauseMenu() {
      this.setOverlay("pauseMenu", false);
    }
    requestResume() {
      this.closePauseMenu();
      this.state = "countdown";
      this.jumpBufferUntil = 0;
      this.touchLeft = this.touchRight = false;
      if (this._pointers) this._pointers = {};
      this._startCountdown(3, () => {
        this.state = "playing";
        this.dom.pauseBtn.style.display = "block";
      });
    }
    _startCountdown(from, done) {
      const cd = this.dom.countdown;
      cd.style.display = "flex";
      this.dom.cdSub.style.display = "block";
      this.dom.cdSub.textContent = "GET READY";
      const beep = (f) => { if (this.audio) this.audio._blip({ type: "triangle", f0: f, dur: 0.12, vol: 0.22 }); };
      let n = from;
      this.dom.cdNum.textContent = String(n);
      beep(660);
      const step = () => {
        n -= 1;
        if (n > 0) {
          this.dom.cdNum.textContent = String(n);
          beep(780 + (from - n) * 50);
          setTimeout(step, 1000);
        } else {
          this.dom.cdNum.textContent = "GO!";
          this.dom.cdSub.style.display = "none";
          beep(1320);
          setTimeout(() => { cd.style.display = "none"; if (done) done(); }, 400);
        }
      };
      setTimeout(step, 1000);
    }

    openCharacterSelect(from) {
      this._charSelectFrom = from || "pause";
      this.setOverlay("title", false);
      this.setOverlay("pauseMenu", false);
      this.buildCharacterGrid();
      this.setOverlay("charSel", true);
    }
    closeCharacterSelect() {
      this.setOverlay("charSel", false);
      if (this._charSelectFrom === "title") {
        this.refreshTitlePreview();
        this.setOverlay("title", true);
      } else {
        // Re-open pause menu if we were paused
        if (this.state === "paused") this.setOverlay("pauseMenu", true);
      }
    }
    buildCharacterGrid() {
      const grid = this.dom.charGrid;
      grid.innerHTML = "";
      CHARACTERS.forEach((c) => {
        const cell = document.createElement("div");
        cell.className = "cell" + (c.id === this.characterId ? " sel" : "");
        cell.innerHTML = `<div style="width:64px;height:72px;" class="preview" data-id="${c.id}"></div>
                          <div>${c.name}</div>`;
        cell.addEventListener("click", () => {
          this.characterId = c.id;
          try { localStorage.setItem(LS_KEYS.character, c.id); } catch (_) {}
          this.characterDrawer = this[c.drawFn] || this.drawCharClimber;
          this.closeCharacterSelect();
        });
        grid.appendChild(cell);
      });
      // Render previews after the cells mount so we know their layout.
      setTimeout(() => this._renderCharPreviews(), 0);
    }
    _renderCharPreviews() {
      // Each preview is a small canvas drawn with the character drawer.
      const hosts = this.dom.charGrid.querySelectorAll(".preview");
      hosts.forEach((host) => {
        const id = host.dataset.id;
        const entry = CHARACTERS.find(c => c.id === id);
        if (!entry) return;
        const fn = this[entry.drawFn];
        if (!fn) return;
        // Tiny Phaser graphics drawn offscreen, then snapshot to ImageData
        // on a DOM canvas. Simpler: draw directly into a 2D canvas.
        const canvas = document.createElement("canvas");
        canvas.width = 64; canvas.height = 72;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        const scale = 2;
        ctx.translate(canvas.width / 2, canvas.height / 2 + 2);
        ctx.scale(scale, scale);
        // Shim minimal "g" with the fillStyle/fillRect calls the drawers use
        const shim = {
          fillStyle(color, alpha) {
            const r = (color >> 16) & 0xff;
            const gg = (color >> 8) & 0xff;
            const b = color & 0xff;
            ctx.fillStyle = `rgba(${r},${gg},${b},${alpha == null ? 1 : alpha})`;
          },
          fillRect(x, y, w, h) { ctx.fillRect(x, y, w, h); },
          fillTriangle(x1, y1, x2, y2, x3, y3) {
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
            ctx.closePath(); ctx.fill();
          },
          fillCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          },
          clear() { /* no-op for preview */ },
        };
        fn.call(this, shim, {
          w: CFG.CHAR_W, h: CFG.CHAR_H, lean: 0,
          airborne: false, speedFrac: 0, runPhase: 0,
          now: 0, facing: 1,
        });
        host.innerHTML = "";
        host.appendChild(canvas);
      });
    }

    onResize(sz) {
      this.W = sz.width;
      this.H = sz.height;
      this.drawBackground();
      // Floor 0 stretches to fill the width
      if (this.floors && this.floors[0]) {
        this.floors[0].x = 0;
        this.floors[0].w = this.W;
      }
    }

    drawBackground() {
      const g = this.bgGfx;
      g.clear();
      const theme = this.currentTheme ? this.currentTheme() : this.floorTheme(0);
      const steps = 12;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const c = lerpColor(theme.bg1, theme.bg2, t);
        g.fillStyle(c, 1);
        g.fillRect(0, (this.H * i) / steps, this.W, this.H / steps + 1);
      }
      // Subtle parallax dots by band
      const band = this.player ? Math.floor(this.player.highestFloor / 100) : 0;
      const seed = 1337 + band * 7;
      g.fillStyle(theme.accent, 0.30);
      for (let i = 0; i < 40; i++) {
        const r = ((seed * (i + 1)) * 9301 + 49297) % 233280;
        g.fillRect(r % this.W, (r >> 3) % this.H, 1 + (i % 3), 1 + (i % 3));
      }
    }

    // -----------------------------------------------------------
    // Input - keyboard, device tilt, and touch fallback
    // -----------------------------------------------------------
    setupInput() {
      this.keys = this.input.keyboard.addKeys({
        left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        up:    Phaser.Input.Keyboard.KeyCodes.UP,
        a:     Phaser.Input.Keyboard.KeyCodes.A,
        d:     Phaser.Input.Keyboard.KeyCodes.D,
        w:     Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      this.input.keyboard.addCapture("LEFT,RIGHT,UP,DOWN,SPACE");

      this.axisX = 0;
      this.jumpBufferUntil = 0;
      this.lastGroundTime = 0;

      // Tilt state
      this.tilt = {
        enabled: false,
        gamma: 0,
        invert: lsGetInt(LS_KEYS.tiltInvert, 0) === 1,
      };
      // Touch state (fallback when no tilt)
      this.touchLeft = false;
      this.touchRight = false;

      this._setupTilt();
      this._setupTouch();
    }

    _setupTilt() {
      const needsPermission =
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function";

      const installHandler = () => {
        if (this._tiltInstalled) return;
        this._tiltInstalled = true;
        window.addEventListener("deviceorientation", (ev) => {
          if (ev.gamma == null) return;
          this.tilt.enabled = true;
          this.tilt.gamma = ev.gamma;
          // First successful event auto-hides the prompt button.
          if (this.dom && this.dom.tiltBtn) this.dom.tiltBtn.style.display = "none";
        }, true);
      };

      if (needsPermission) {
        // iOS 13+: need a user-gesture button. Show it on mobile only.
        const btn = document.getElementById("tilt-enable");
        if (btn) {
          btn.style.display = "block";
          btn.addEventListener("click", async () => {
            try {
              const res = await DeviceOrientationEvent.requestPermission();
              if (res === "granted") { installHandler(); btn.style.display = "none"; }
            } catch (_) {}
          }, { once: true });
        }
      } else if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
        // Android + desktops with accelerometers can auto-install
        installHandler();
      }
    }

    _setupTouch() {
      // Per-pointer tracking so lifting one finger doesn't kill the
      // direction held by the other. This is what makes two-thumb
      // play feel like the original (hold direction + tap to jump).
      this._pointers = {};

      this.input.on("pointerdown", (pointer) => {
        if (this.gameOver) return;
        this.jumpBufferUntil = this.time.now + CFG.JUMP_BUFFER_MS;
        this._pointers[pointer.id] = pointer.x < this.W / 2 ? "left" : "right";
        this._syncTouchFromPointers();
      });
      this.input.on("pointermove", (pointer) => {
        if (this.gameOver || !pointer.isDown) return;
        this._pointers[pointer.id] = pointer.x < this.W / 2 ? "left" : "right";
        this._syncTouchFromPointers();
      });
      this.input.on("pointerup", (pointer) => {
        delete this._pointers[pointer.id];
        this._syncTouchFromPointers();
      });
    }

    _syncTouchFromPointers() {
      this.touchLeft = false;
      this.touchRight = false;
      for (const id in this._pointers) {
        if (this._pointers[id] === "left")  this.touchLeft = true;
        if (this._pointers[id] === "right") this.touchRight = true;
      }
    }

    readInput() {
      const k = this.keys;
      let ax = 0;

      // Keyboard
      if (k.left.isDown  || k.a.isDown) ax -= 1;
      if (k.right.isDown || k.d.isDown) ax += 1;

      // Tilt (only if no keyboard input)
      if (ax === 0 && this.tilt.enabled) {
        let g = this.tilt.gamma;
        if (this.tilt.invert) g = -g;
        // Simple dead zone + linear ramp out to +/- 25 degrees
        if (Math.abs(g) > 3) ax = Phaser.Math.Clamp(g / 25, -1, 1);
      }

      // Touch fallback (only if no tilt is flowing)
      if (ax === 0 && !this.tilt.enabled) {
        if (this.touchLeft)  ax -= 1;
        if (this.touchRight) ax += 1;
      }

      this.axisX = ax;

      if (
        Phaser.Input.Keyboard.JustDown(k.up) ||
        Phaser.Input.Keyboard.JustDown(k.w)  ||
        Phaser.Input.Keyboard.JustDown(k.space)
      ) {
        this.jumpBufferUntil = this.time.now + CFG.JUMP_BUFFER_MS;
      }
    }

    // A jump fires when the player has a live buffer AND is jumpable
    // (on ground, OR within the coyote window after leaving ground).
    shouldJumpNow() {
      if (this.time.now > this.jumpBufferUntil) return false;
      if (this.player.onGround) return true;
      if (this.time.now - this.lastGroundTime <= CFG.COYOTE_MS) return true;
      return false;
    }

    // -----------------------------------------------------------
    // Run lifecycle
    // -----------------------------------------------------------
    resetRun() {
      // Floor 0's top-surface y lives here (world coords, lower-right-down).
      this.FLOOR0_Y = this.H - 80;

      this.player = {
        x: this.W / 2,
        y: this.FLOOR0_Y,
        prevY: this.FLOOR0_Y,
        vx: 0,
        vy: 0,
        w: CFG.CHAR_W,
        h: CFG.CHAR_H,
        onGround: true,
        facing: 1,
        runPhase: 0,
        crouchT: 0,
        // Wall bounce bookkeeping
        wallHitTime: 0,
        wallHitSide: 0,
        wallBounceArmed: false,
        // Floor tracking
        currentFloor: 0,
        highestFloor: 0,
        jumpStartFloor: 0,
        // Flip / somersault
        rotation: 0,
        rotRate: 0,
        jumpSpeedFrac: 0,
      };
      this.bestFlips = lsGetInt(LS_KEYS.bestFlips, 0);

      // Particles - light AoS
      this.particles = [];

      // Milestones already fired this run
      this.milestonesFired = {};

      // Ghost replay recorder + playback of best run
      this.ghostRec = { samples: [], lastSampleAt: 0 };
      const storedGhost = lsGetJSON(LS_KEYS.ghost, null);
      this.ghostPlay = (storedGhost && Array.isArray(storedGhost.samples) && storedGhost.samples.length > 2)
        ? { samples: storedGhost.samples, startTime: this.time ? this.time.now : 0, index: 0 }
        : null;

      // Selected character -> drawer
      let charId = "climber";
      try { charId = localStorage.getItem(LS_KEYS.character) || "climber"; } catch (_) {}
      const entry = CHARACTERS.find(c => c.id === charId) || CHARACTERS[0];
      this.characterId = entry.id;
      this.characterDrawer = this[entry.drawFn] || this.drawCharClimber;

      // Procedural floors
      this.floors = [];
      this.maxSpawnedFloor = -1;
      for (let n = 0; n <= 60; n++) this._createFloor(n);

      // Camera
      this.cameras.main.setScroll(0, 0);
      this.cameraY = 0;

      // Auto-scroll
      this.scrollActive     = false;
      this.scrollSpeed      = 0;
      this.nextSpeedupAt    = 0;
      this.hurryUntil       = 0;

      // Run state
      this.gameOver = false;
      this.score = 0;
      // Clear stale touch pointers from previous run
      if (this._pointers) this._pointers = {};
      this.runStartTime = this.time ? this.time.now : 0;

      // Combo
      this.combo = { count: 0, timer: 0, longest: 0 };

      if (this.dom) this.dom.gameover.classList.remove("on");
      this.buildHUD();
    }

    // Fresh run callable from button / keyboard restart
    restartRun() {
      if (this.dom) {
        this.dom.gameover.classList.remove("on");
        this.dom.pauseMenu.classList.remove("on");
        this.dom.charSel.classList.remove("on");
        this.dom.title.classList.remove("on");
        this.dom.hurry.style.display = "none";
        this.dom.btnFlipTilt.style.display = "none";
        this.dom.countdown.style.display = "none";
        this.dom.pauseBtn.style.display = "block";
      }
      this.resetRun();
      this.state = "playing";
    }

    // -----------------------------------------------------------
    // Floor generation
    // -----------------------------------------------------------
    floorY(n) { return this.FLOOR0_Y - n * CFG.FLOOR_HEIGHT; }

    floorWidthFrac(n) {
      if (n <= 0) return 1.0;
      if (n < 200) return 0.70 - 0.30 * (n / 200);
      if (n < 500) return 0.40 - 0.15 * ((n - 200) / 300);
      return Math.max(0.15, 0.25 - (n - 500) * 0.0002);
    }

    _createFloor(n) {
      const y = this.floorY(n);
      let f;
      if (n === 0) {
        f = { n: 0, x: 0, y, w: this.W, h: CFG.FLOOR_THICKNESS };
      } else {
        const frac = this.floorWidthFrac(n);
        const jitter = 1 + (Math.random() * 2 - 1) * CFG.FLOOR_WIDTH_JITTER;
        const availW = this.W - CFG.WALL_THICKNESS * 2;
        let w = Math.max(CFG.FLOOR_MIN_WIDTH_PX, availW * frac * jitter);
        w = Math.min(w, availW - 10);
        const slack = availW - w;
        const x = CFG.WALL_THICKNESS + Math.random() * slack;
        f = { n, x, y, w, h: CFG.FLOOR_THICKNESS };
      }
      this.floors.push(f);
      this.maxSpawnedFloor = n;
    }

    // Dispatches to the selected character's drawer. The outer frame
    // (position / rotation / facing scale) is common; drawers paint
    // in local coords around (0,0) = body center.
    drawPlayer() {
      const p = this.player;
      const g = this.playerGfx;
      g.clear();

      const crouch = p.crouchT;
      const squash = 1 - crouch * 0.2;
      const stretch = p.onGround ? 1 : 1.05;
      const h = p.h * squash * stretch;
      const w = p.w;
      const airborne = !p.onGround;
      const speedFrac = Phaser.Math.Clamp(Math.abs(p.vx) / CFG.MAX_H_SPEED, 0, 1);
      const lean = p.onGround ? p.facing * speedFrac * 4 : 0;

      g.x = p.x;
      g.y = p.y - h / 2;
      g.rotation = p.rotation;
      g.scaleX = p.facing < 0 ? -1 : 1;
      g.scaleY = 1;

      const opts = { w, h, lean, airborne, speedFrac, runPhase: p.runPhase, now: this.time.now, facing: p.facing };
      const drawer = this.characterDrawer || this.drawCharClimber;
      drawer.call(this, g, opts);
    }

    drawCharClimber(g, o) {
      const { w, h, lean, airborne, speedFrac, runPhase, now } = o;
      const bx = -w / 2, by = -h / 2;
      const legW = 5;
      const legH = Math.max(4, h * 0.28);
      const legY = by + h - legH;
      const legSpread = w * 0.25;
      const legLX = -legSpread - legW / 2;
      const legRX =  legSpread - legW / 2;
      g.fillStyle(0x2b2b30, 1);
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX, tuckY, legW, legH);
        g.fillRect(legRX, tuckY, legW, legH);
      } else if (speedFrac > 0.05) {
        const s = Math.sin(runPhase);
        const off = s * legH * 0.4;
        g.fillRect(legLX, legY - off, legW, legH);
        g.fillRect(legRX, legY + off, legW, legH);
      } else {
        g.fillRect(legLX, legY, legW, legH);
        g.fillRect(legRX, legY, legW, legH);
      }
      g.fillStyle(0x111318, 1);
      const bootH = 3;
      if (airborne) {
        const tuckY = legY - legH * 0.6;
        g.fillRect(legLX - 1, tuckY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, tuckY + legH - bootH, legW + 2, bootH);
      } else {
        g.fillRect(legLX - 1, legY + legH - bootH, legW + 2, bootH);
        g.fillRect(legRX - 1, legY + legH - bootH, legW + 2, bootH);
      }
      const bodyH = h * 0.46;
      const bodyY = by + h * 0.30;
      const bodyX = bx + lean;
      g.fillStyle(0x2e84d6, 1);
      g.fillRect(bodyX, bodyY, w, bodyH);
      g.fillStyle(0xffffff, 1);
      g.fillRect(bodyX, bodyY + bodyH - 3, w, 3);
      g.fillStyle(0x2067b0, 1);
      const armW = 4, armH = bodyH * 0.8;
      if (airborne) {
        g.fillRect(bodyX - armW + 1, bodyY - armH * 0.4, armW, armH);
        g.fillRect(bodyX + w - 1,    bodyY - armH * 0.4, armW, armH);
      } else {
        const s = speedFrac > 0.05 ? Math.sin(runPhase + Math.PI) * 4 : 0;
        g.fillRect(bodyX - armW + 1, bodyY + s, armW, armH);
        g.fillRect(bodyX + w - 1,    bodyY - s, armW, armH);
      }
      const headW = w - 4, headH = h * 0.30, headX = bx + 2 + lean, headY = by;
      g.fillStyle(0xf2d1a8, 1);
      g.fillRect(headX, headY + 4, headW, headH - 4);
      g.fillStyle(0xd03030, 1);
      g.fillRect(headX, headY, headW, 6);
      g.fillStyle(0xffffff, 1);
      g.fillRect(headX, headY - 2, 4, 3);
      g.fillRect(headX + 4, headY - 0.5, headW - 4, 1.5);
      g.fillStyle(0x1a1a1a, 1);
      g.fillRect(headX, headY + 7, headW, 4);
      g.fillStyle(0xff9a3d, 1);
      g.fillRect(headX + headW - 7, headY + 8, 5, 2);
      g.fillStyle(0xffdc4a, 1);
      const scarfY = bodyY + 2;
      const flutter = Math.sin(now * 0.02) * 2;
      g.fillRect(bodyX - 3, scarfY, 3, 4);
      g.fillRect(bodyX - 5, scarfY + 2 + flutter, 3, 3);
    }

    drawCharPenguin(g, o) {
      const { w, h, airborne, speedFrac, runPhase, now } = o;
      const bx = -w / 2, by = -h / 2;
      const waddle = !airborne && speedFrac > 0.05 ? Math.sin(runPhase * 0.8) * 2 : 0;
      g.fillStyle(0xff8a2a, 1);
      if (airborne) {
        g.fillRect(-w * 0.4, by + h - 10, w * 0.35, 4);
        g.fillRect( w * 0.05, by + h - 10, w * 0.35, 4);
      } else {
        const s = speedFrac > 0.05 ? Math.sin(runPhase) * 3 : 0;
        g.fillRect(bx + 1, by + h - 5 - s, w * 0.45, 4);
        g.fillRect(bx + w - w*0.45 - 1, by + h - 5 + s, w * 0.45, 4);
      }
      g.fillStyle(0x0d0d14, 1);
      g.fillRect(bx, by + h * 0.20 + waddle, w, h * 0.70);

    // -----------------------------------------------------------
    // Physics
    // -----------------------------------------------------------
    updatePhysics(dt) {
      const p = this.player;
      const ax = this.axisX;

      // Horizontal accel / friction
      if (ax !== 0) {
        const a = p.onGround ? CFG.GROUND_ACCEL : CFG.AIR_ACCEL;
        p.vx += ax * a * dt;
        p.vx = Phaser.Math.Clamp(p.vx, -CFG.MAX_H_SPEED, CFG.MAX_H_SPEED);
        p.facing = ax > 0 ? 1 : -1;
      } else if (p.onGround) {
        const dec = CFG.GROUND_FRICTION * dt;
        if (Math.abs(p.vx) <= dec) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * dec;
      }

      // Buffered jump - fires instantly on landing for chain-jumps
      if (this.shouldJumpNow()) {
        const speedFrac = Math.abs(p.vx) / CFG.MAX_H_SPEED;
        p.vy = -(CFG.BASE_JUMP + speedFrac * CFG.BONUS_JUMP);
        p.onGround = false;
        p.jumpStartFloor = p.currentFloor;
        p.jumpSpeedFrac = speedFrac;
        // Somersault flip at high speed (Icy Tower signature move)
        if (speedFrac >= CFG.FLIP_MIN_SPEED_FRAC) {
          const dir = Math.sign(p.vx) || 1;
          const turnsPerSec = 2.2 * (speedFrac - CFG.FLIP_MIN_SPEED_FRAC) / (1 - CFG.FLIP_MIN_SPEED_FRAC);
          p.rotRate = dir * Math.PI * 2 * turnsPerSec;
        } else {
          p.rotRate = 0;
        }
        p.rotation = 0;
        this.jumpBufferUntil = 0;
        if (this.audio) this.audio.jump(speedFrac);
      }

      // Gravity + integrate
      p.vy += CFG.GRAVITY * dt;
      p.prevY = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      this.resolveFloorCollision();
      this.resolveWallCollision();

      if (p.onGround) this.lastGroundTime = this.time.now;

      // Animation state
      if (p.onGround && Math.abs(p.vx) > 20) {
        p.runPhase += (Math.abs(p.vx) / CFG.MAX_H_SPEED) * 18 * dt;
      } else if (!p.onGround) {
        p.runPhase = 0;
      }
      if (p.crouchT > 0) p.crouchT = Math.max(0, p.crouchT - dt / 0.15);

      // Flip rotation - spin airborne, ease to 0 on ground
      if (!p.onGround && p.rotRate !== 0) {
        p.rotation += p.rotRate * dt;
      } else if (p.onGround && p.rotation !== 0) {
        const ease = Math.sign(p.rotation) * Math.min(Math.abs(p.rotation), Math.PI * 6 * dt);
        p.rotation -= ease;
      }
    }

    // One-way platforms - only land from above, pass up through.
    resolveFloorCollision() {
      const p = this.player;
      if (p.vy < 0) return;   // rising: ignore all floors

      const halfW = p.w / 2;
      const prevFeet = p.prevY;
      const curFeet  = p.y;

      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        const top = f.y;
        if (prevFeet <= top && curFeet >= top) {
          if (p.x + halfW > f.x && p.x - halfW < f.x + f.w) {
            p.y = top;
            p.vy = 0;
            const wasAir = !p.onGround;
            p.onGround = true;
            if (wasAir) this.onLand(f);
            break;
          }
        }
      }
    }

    // Wall bounce: hit wall reverses vx, opens a 100ms window where
    // pressing the opposite direction key preserves full momentum.
    // Otherwise horizontal momentum is lost (vertical keeps falling).
    resolveWallCollision() {
      const p = this.player;
      const halfW = p.w / 2;
      const leftBound  = CFG.WALL_THICKNESS + halfW;
      const rightBound = this.W - CFG.WALL_THICKNESS - halfW;
      const now = this.time.now;

      if (p.x < leftBound && p.vx <= 0) {
        p.x = leftBound;
        p.vx = Math.abs(p.vx);       // bounce off
        p.wallHitTime = now;
        p.wallHitSide = -1;
        p.wallBounceArmed = true;
      } else if (p.x > rightBound && p.vx >= 0) {
        p.x = rightBound;
        p.vx = -Math.abs(p.vx);
        p.wallHitTime = now;
        p.wallHitSide = 1;
        p.wallBounceArmed = true;
      }

      if (p.wallBounceArmed) {
        const elapsed = now - p.wallHitTime;
        const inputAway =
          (p.wallHitSide === 1  && this.axisX < -0.1) ||
          (p.wallHitSide === -1 && this.axisX >  0.1);

        if (inputAway && elapsed <= CFG.WALL_BOUNCE_WINDOW_MS) {
          const dir = -p.wallHitSide;
          p.vx = dir * CFG.MAX_H_SPEED;  // full momentum restored
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
          this.onWallBounce();
        } else if (elapsed > CFG.WALL_BOUNCE_WINDOW_MS) {
          p.vx = 0;                      // lose horizontal momentum
          p.wallBounceArmed = false;
          p.wallHitTime = 0;
        }
      }
    }

    onLand(floor) {
      const p = this.player;
      p.crouchT = 1;
      const fromFloor = p.jumpStartFloor;
      const toFloor   = floor.n;
      const prevFloor = p.currentFloor;
      p.currentFloor = toFloor;

      // Landing particle burst + sound
      this.spawnLandParticles(p.x, floor.y, this.floorTheme(floor.n));
      const impact = Phaser.Math.Clamp((p.prevY > floor.y ? (p.prevY - floor.y) / 200 : 0), 0, 1);
      if (this.audio) this.audio.land(impact);

      // Flip bonus on landing
      const flips = Math.max(0, Math.floor(Math.abs(p.rotation) / (Math.PI * 2)));
      if (flips > 0) {
        const mult = 1 + this.combo.count * 0.5;
        const bonus = Math.round(100 * flips * mult);
        this.score += bonus;
        if (flips > this.bestFlips) {
          this.bestFlips = flips;
          lsSet(LS_KEYS.bestFlips, this.bestFlips);
        }
        this.spawnFlipPopup(flips, bonus);
        if (this.audio) this.audio.comboReward(Math.min(4, flips));
      }
      p.rotation = 0;
      p.rotRate = 0;
      p.jumpSpeedFrac = 0;

      const cleared = toFloor - fromFloor;

      // Scoring on new ground
      if (toFloor > p.highestFloor) {
        const gained = toFloor - p.highestFloor;
        const mult = 1 + this.combo.count * 0.5;
        this.score += Math.round(CFG.POINTS_PER_FLOOR * gained * mult);
        const prevHighest = p.highestFloor;
        p.highestFloor = toFloor;

        // Keep the tower built well above the player
        const wantUpTo = toFloor + 80;
        if (wantUpTo > this.maxSpawnedFloor) {
          for (let k = this.maxSpawnedFloor + 1; k <= wantUpTo; k++) this._createFloor(k);
        }

        // Milestones
        for (let m = 0; m < CFG.MILESTONES.length; m++) {
          const ms = CFG.MILESTONES[m];
          if (prevHighest < ms && toFloor >= ms && !this.milestonesFired[ms]) {
            this.milestonesFired[ms] = true;
            this.triggerMilestone(ms);
          }
        }
      } else if (toFloor < prevFloor) {
        const lost = prevFloor - toFloor;
        this.score = Math.max(0, this.score - lost * CFG.POINTS_PER_FLOOR);
      }

      // Combo update: flips ALSO count as combo-continuing
      const qualifying = cleared >= CFG.COMBO_MIN_FLOORS || flips > 0;
      if (qualifying) {
        this.combo.count += 1;
        this.combo.timer  = CFG.COMBO_TIMEOUT_MS / 1000;
        if (this.combo.count > this.combo.longest) this.combo.longest = this.combo.count;
        this.maybeShowComboReward(this.combo.count);
      } else if (this.combo.count > 0) {
        this.breakCombo();
      }
    }

    spawnFlipPopup(flips, bonus) {
      const word = flips === 1 ? "1 FLIP" : `${flips} FLIPS`;
      const color = flips >= 3 ? "#ff5cf0" : flips >= 2 ? "#ffaa00" : "#fff56a";
      const S = Math.min(this.W, this.H);
      const label = this.add.text(this.player.x, this.player.y - this.player.h - 10,
        `${word}  +${bonus}`, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.045) + "px",
        fontStyle: "bold",
        color,
        stroke: "#000",
        strokeThickness: 5,
      }).setOrigin(0.5).setDepth(11);
      this.tweens.add({
        targets: label,
        y: label.y - 40,
        alpha: { from: 1, to: 0 },
        scale: { from: 0.6, to: 1.15 },
        duration: 900,
        ease: "Sine.Out",
        onComplete: () => label.destroy(),
      });
    }

    triggerMilestone(n) {
      if (this.audio) this.audio.milestone();
      const S = Math.min(this.W, this.H);
      const msg = n >= 1000 ? `FLOOR ${n}!\nLEGEND.`
                : n >= 500  ? `FLOOR ${n}!\nINCREDIBLE!`
                : n >= 250  ? `FLOOR ${n}!\nKEEP GOING!`
                :             `FLOOR ${n}!\nNICE CLIMB!`;
      const label = this.add.text(this.W / 2, this.H * 0.42, msg, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.09) + "px",
        fontStyle: "bold",
        color: "#fff", stroke: "#000", strokeThickness: 8,
        align: "center",
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1600).setAlpha(0);
      this.tweens.add({
        targets: label, alpha: 1, scale: { from: 0.5, to: 1.2 },
        duration: 260, ease: "Back.Out",
      });
      this.tweens.add({
        targets: label, alpha: 0, scale: 1.3, y: label.y - 40,
        delay: 1400, duration: 700, ease: "Sine.In",
        onComplete: () => label.destroy(),
      });
      const flash = this.add.graphics().setScrollFactor(0).setDepth(1550);
      flash.fillStyle(this.currentTheme().accent, 0.30);
      flash.fillRect(0, 0, this.W, this.H);
      this.tweens.add({
        targets: flash, alpha: 0, duration: 500, ease: "Sine.Out",
        onComplete: () => flash.destroy(),
      });
    }

    // Particles (light, CPU-friendly)
    spawnLandParticles(x, y, theme) {
      for (let i = 0; i < 14; i++) {
        const a = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9;
        const sp = 40 + Math.random() * 90;
        this.particles.push({
          x: x + (Math.random() - 0.5) * 12,
          y: y - 2,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 0.5 + Math.random() * 0.3,
          maxLife: 0.8,
          size: 1 + Math.floor(Math.random() * 3),
          color: i % 3 === 0 ? theme.accent : theme.top,
        });
      }
    }
    updateParticles(dt) {
      const arr = this.particles;
      for (let i = arr.length - 1; i >= 0; i--) {
        const pt = arr[i];
        pt.life -= dt;
        if (pt.life <= 0) { arr.splice(i, 1); continue; }
        pt.vy += 420 * dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
      }
    }
    drawParticles() {
      const g = this.particlesGfx;
      g.clear();
      for (let i = 0; i < this.particles.length; i++) {
        const pt = this.particles[i];
        const a = Math.max(0, Math.min(1, pt.life / pt.maxLife));
        g.fillStyle(pt.color, a);
        g.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
      }
    }

    breakCombo() {
      this.combo.count = 0;
      this.combo.timer = 0;
    }

    maybeShowComboReward(n) {
      const word =
        n === 5   ? "GOOD!" :
        n === 10  ? "SWEET!" :
        n === 20  ? "EXCELLENT!" :
        n === 30  ? "FANTASTIC!" :
        n === 50  ? "EXTREME!" :
        n === 100 ? "GODLIKE!" :
        (n > 100 && (n - 100) % 25 === 0) ? "GODLIKE!" : null;
      if (!word) return;
      this.spawnRewardPopup(word);
      const tier = n >= 100 ? 5 : n >= 50 ? 4 : n >= 30 ? 3 : n >= 20 ? 2 : n >= 10 ? 1 : 0;
      if (this.audio) this.audio.comboReward(tier);
    }

    spawnRewardPopup(text) {
      const S = Math.min(this.W, this.H);
      const color = this.combo.count >= 100 ? "#ff5cf0"
                 : this.combo.count >= 50  ? "#ff3cdc"
                 : this.combo.count >= 30  ? "#a93cff"
                 : this.combo.count >= 20  ? "#ff2e2e"
                 : this.combo.count >= 10  ? "#ff8a2a"
                 : "#ffdf3c";
      const label = this.add.text(this.W / 2, this.H * 0.38, text, {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.11) + "px",
        fontStyle: "bold",
        color,
        stroke: "#000",
        strokeThickness: 8,
      }).setOrigin(0.5).setScrollFactor(0).setDepth(1500).setAlpha(0);
      this.tweens.add({
        targets: label,
        alpha: { from: 0, to: 1 },
        scale: { from: 0.5, to: 1.15 },
        y: this.H * 0.36,
        duration: 260,
        ease: "Back.Out",
      });
      this.tweens.add({
        targets: label, alpha: 0, scale: 1.0, y: this.H * 0.30,
        delay: 900, duration: 600, ease: "Sine.In",
        onComplete: () => label.destroy(),
      });
    }

    updateCombo(dt) {
      if (this.combo.timer > 0) {
        this.combo.timer -= dt;
        if (this.combo.timer <= 0) {
          this.combo.timer = 0;
          if (this.combo.count > 0) this.breakCombo();
        }
      }
    }

    onWallBounce() {
      if (this.audio) this.audio.wallBounce();
    }

    // -----------------------------------------------------------
    // HUD - floor / score / best + combo meter
    // -----------------------------------------------------------
    buildHUD() {
      if (this.hud) this.hud.container.destroy();
      const c = this.add.container(0, 0).setScrollFactor(0).setDepth(1100);
      const S = Math.min(this.W, this.H);
      const pad = Math.round(S * 0.025);
      const big = Math.max(18, Math.round(S * 0.045));
      const sm  = Math.max(13, Math.round(S * 0.032));

      const floorTxt = this.add.text(pad, pad, "FLOOR 0", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#9cd9ff", stroke: "#000", strokeThickness: 4,
      });
      c.add(floorTxt);

      const scoreTxt = this.add.text(this.W / 2, pad, "0", {
        fontFamily: "Courier New, monospace",
        fontSize: big + "px", fontStyle: "bold",
        color: "#ffffff", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0.5, 0);
      c.add(scoreTxt);

      const bestTxt = this.add.text(this.W - pad, pad, "BEST " + this.best.score, {
        fontFamily: "Courier New, monospace",
        fontSize: sm + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 3,
      }).setOrigin(1, 0);
      c.add(bestTxt);

      // Combo meter (vertical bar on left)
      const meterBG   = this.add.graphics(); c.add(meterBG);
      const meterFill = this.add.graphics(); c.add(meterFill);
      const multTxt   = this.add.text(pad + 18, this.H * 0.5, "", {
        fontFamily: "Courier New, monospace",
        fontSize: Math.round(S * 0.08) + "px", fontStyle: "bold",
        color: "#ffdf3c", stroke: "#000", strokeThickness: 5,
      }).setOrigin(0, 0.5);
      c.add(multTxt);
      multTxt.setVisible(false);

      this.hud = {
        container: c,
        floorTxt, scoreTxt, bestTxt, meterBG, meterFill, multTxt,
        pad, big, sm, S,
      };
    }

    drawHUD() {
      if (!this.hud) return;
      const h = this.hud;
      h.floorTxt.setText("FLOOR " + this.player.highestFloor);
      h.scoreTxt.setText(String(this.score));
      h.bestTxt.setText("BEST " + Math.max(this.best.score, this.score));

      const mbg = h.meterBG, mf = h.meterFill;
      mbg.clear(); mf.clear();
      const mx = h.pad;
      const myTop = this.H * 0.25;
      const mw = 12, mh = this.H * 0.50;
      mbg.fillStyle(0x000000, 0.50);
      mbg.fillRoundedRect(mx - 2, myTop - 2, mw + 4, mh + 4, 4);
      mbg.fillStyle(0x0a1428, 1);
      mbg.fillRoundedRect(mx, myTop, mw, mh, 3);

      if (this.combo.count > 0 && this.combo.timer > 0) {
        const frac = Phaser.Math.Clamp(this.combo.timer / (CFG.COMBO_TIMEOUT_MS / 1000), 0, 1);
        const fillH = mh * frac;
        const color =
          this.combo.count >= 100 ? 0xff5cf0 :
          this.combo.count >= 50  ? 0xff3cdc :
          this.combo.count >= 30  ? 0xa93cff :
          this.combo.count >= 20  ? 0xff2e2e :
          this.combo.count >= 10  ? 0xff8a2a :
          0xffdf3c;
        mf.fillStyle(color, 1);
        mf.fillRect(mx, myTop + (mh - fillH), mw, fillH);
        h.multTxt.setText("x" + this.combo.count);
        h.multTxt.setVisible(true);
      } else {
        h.multTxt.setVisible(false);
      }
    }

    // -----------------------------------------------------------
    // Camera - upward-only follow + auto-scroll escalation
    // -----------------------------------------------------------
    updateCamera(dt) {
      const p = this.player;
      // Follow upward
      const desired = p.y - this.H * 0.62;
      if (desired < this.cameraY) {
        this.cameraY = Phaser.Math.Linear(this.cameraY, desired, 0.18);
      }
      // Auto-scroll arms at floor 5
      if (!this.scrollActive && p.highestFloor >= CFG.SCROLL_START_FLOOR) {
        this.scrollActive   = true;
        this.scrollSpeed    = CFG.SCROLL_INITIAL_SPEED;
        this.nextSpeedupAt  = this.time.now + CFG.SCROLL_INCREMENT_MS;
        this.flashHurryUp();
      }
      if (this.scrollActive) {
        if (this.time.now >= this.nextSpeedupAt) {
          this.scrollSpeed += CFG.SCROLL_INCREMENT;
          this.nextSpeedupAt = this.time.now + CFG.SCROLL_INCREMENT_MS;
          this.flashHurryUp();
        }
        this.cameraY -= this.scrollSpeed * dt;
      }
      this.cameras.main.setScroll(0, this.cameraY);
    }

    flashHurryUp() {
      this.hurryUntil = this.time.now + 1400;
      if (this.dom && this.dom.hurry) this.dom.hurry.style.display = "block";
      if (this.audio) this.audio.hurryUp();
    }
    tickHurryUp() {
      if (!this.dom || !this.dom.hurry) return;
      if (this.time.now > this.hurryUntil && this.dom.hurry.style.display === "block") {
        this.dom.hurry.style.display = "none";
      }
    }

    // -----------------------------------------------------------
    // Game over
    // -----------------------------------------------------------
    checkGameOver() {
      if (this.gameOver) return;
      const p = this.player;
      const viewBottom = this.cameraY + this.H;
      if (p.y > viewBottom + 8) this.triggerGameOver();
    }

    triggerGameOver() {
      this.gameOver = true;
      this.state = "gameover";
      if (this.dom && this.dom.pauseBtn) this.dom.pauseBtn.style.display = "none";
      if (this.audio) this.audio.gameOver();
      if (this.player.highestFloor > this.best.floor) {
        this.best.floor = this.player.highestFloor;
        lsSet(LS_KEYS.bestFloor, this.best.floor);
      }
      if (this.score > this.best.score) {
        this.best.score = this.score;
        lsSet(LS_KEYS.bestScore, this.best.score);
      }
      if (this.combo.longest > this.best.longestCombo) {
        this.best.longestCombo = this.combo.longest;
        lsSet(LS_KEYS.longestCombo, this.best.longestCombo);
      }
      this.maybeSaveGhost();
      if (this.dom) {
        this.dom.goFloor.textContent  = this.player.highestFloor;
        this.dom.goScore.textContent  = this.score;
        this.dom.goBestF.textContent  = this.best.floor;
        this.dom.goBestS.textContent  = this.best.score;
        this.dom.gameover.classList.add("on");
        this.dom.hurry.style.display = "none";
        // Flip-tilt safety button only visible on mobile while tilt is active
        if (this.tilt && this.tilt.enabled) {
          this.dom.btnFlipTilt.style.display = "block";
          this.dom.btnFlipTilt.textContent = "FLIP TILT: " + (this.tilt.invert ? "ON" : "OFF");
        }
      }
    }

    // -----------------------------------------------------------
    // Rendering - floors + walls
    // -----------------------------------------------------------
    floorTheme(n) {
      if (n < 100) return {
        top: 0x9cd9ff, side: 0x4aa8e0, wall: 0x2a5c8c,
        bg1: 0x0b1d3a, bg2: 0x1a3d6c,
        accent: 0xe8faff,
      };
      if (n < 200) return {
        top: 0xc9c9c9, side: 0x6a6a6a, wall: 0x2e2e34,
        bg1: 0x14141a, bg2: 0x2a2a32,
        accent: 0xffcf80,
      };
      if (n < 300) return {
        top: 0xffb27a, side: 0xcc3a0a, wall: 0x5a1400,
        bg1: 0x200500, bg2: 0x501200,
        accent: 0xffd27a,
      };
      if (n < 400) return {
        top: 0xb8f0a8, side: 0x2a7a38, wall: 0x14401e,
        bg1: 0x061505, bg2: 0x0f2e18,
        accent: 0xfff0a8,
      };
      return {
        top: 0xd8c0ff, side: 0x5e3fa0, wall: 0x261048,
        bg1: 0x010014, bg2: 0x0c0830,
        accent: 0xfff0ff,
      };
    }
    // Smooth blend between current and next-band theme in the last 10
    // floors before a boundary.
    currentTheme() {
      const n = this.player ? this.player.highestFloor : 0;
      const band = Math.floor(n / 100);
      const into = n - band * 100;
      if (into < 90) return this.floorTheme(n);
      const t = (into - 90) / 10;
      const a = this.floorTheme(n);
      const b = this.floorTheme(band * 100 + 100);
      return {
        top:    lerpColor(a.top,    b.top,    t),
        side:   lerpColor(a.side,   b.side,   t),
        wall:   lerpColor(a.wall,   b.wall,   t),
        bg1:    lerpColor(a.bg1,    b.bg1,    t),
        bg2:    lerpColor(a.bg2,    b.bg2,    t),
        accent: lerpColor(a.accent, b.accent, t),
      };
    }

    drawFloors() {
      const g = this.floorsGfx;
      g.clear();
      const top = this.cameraY - 20;
      const bot = this.cameraY + this.H + 20;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < top || f.y > bot) continue;
        const th = this.floorTheme(f.n);
        g.fillStyle(0x000000, 0.35);
        g.fillRect(f.x + 2, f.y + f.h, f.w, 4);
        g.fillStyle(th.side, 1);
        g.fillRect(f.x, f.y, f.w, f.h);
        g.fillStyle(th.top, 1);
        g.fillRect(f.x, f.y, f.w, 3);
        g.fillStyle(0xffffff, 0.6);
        for (let t = 0; t < f.w; t += 24) g.fillRect(f.x + t + 6, f.y + 1, 4, 1);
      }
    }

    drawWalls() {
      const g = this.wallsGfx;
      g.clear();
      const n = this.player.highestFloor;
      const th = this.floorTheme(n);
      const top = this.cameraY - 20;
      const h   = this.H + 40;
      g.fillStyle(th.wall, 1);
      g.fillRect(0, top, CFG.WALL_THICKNESS, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, CFG.WALL_THICKNESS, h);
      g.fillStyle(0xffffff, 0.08);
      g.fillRect(CFG.WALL_THICKNESS - 2, top, 2, h);
      g.fillRect(this.W - CFG.WALL_THICKNESS, top, 2, h);
      g.fillStyle(0x000000, 0.25);
      const start = Math.floor(top / 16) * 16;
      for (let y = start; y < top + h; y += 16) {
        g.fillRect(0, y, CFG.WALL_THICKNESS, 1);
        g.fillRect(this.W - CFG.WALL_THICKNESS, y, CFG.WALL_THICKNESS, 1);
      }
    }

    // -----------------------------------------------------------
    // Custom art sprites (textures preloaded, built once in create)
    // -----------------------------------------------------------
    _buildArtSprites() {
      // Background: TileSprite at origin(0,0), position(0,0), fills screen.
      // setScrollFactor(0) locks it to the camera view.
      // tilePositionY drives the parallax scroll.
      this._bgSprite = this.add.tileSprite(0, 0, this.W, this.H, "bg-ice")
        .setOrigin(0, 0).setScrollFactor(0).setDepth(-9);

      // Walls: TileSprite strips on each edge. Origin(0,0) at exact pixel.
      this._wallL = this.add.tileSprite(0, 0, CFG.WALL_THICKNESS, this.H, "wall-ice")
        .setOrigin(0, 0).setScrollFactor(0).setDepth(-4);
      this._wallR = this.add.tileSprite(this.W - CFG.WALL_THICKNESS, 0, CFG.WALL_THICKNESS, this.H, "wall-ice")
        .setOrigin(0, 0).setScrollFactor(0).setDepth(-4);

      // Floor pool: Image objects (not TileSprite!) because the step art
      // has unique crystal edges that shouldn't repeat. setDisplaySize()
      // stretches the whole image to fit each floor's width.
      this._floorPool = [];
    }

    _updateArtSprites() {
      if (!this._artReady) return;
      // Background parallax
      if (this._bgSprite) {
        this._bgSprite.tilePositionY = (this.cameraY || 0) * 0.3;
        // Keep sized to current viewport (handles resize)
        this._bgSprite.setSize(this.W, this.H);
      }

      // Walls parallax
      if (this._wallL) {
        this._wallL.tilePositionY = (this.cameraY || 0) * 0.8;
        this._wallL.setPosition(0, 0);
        this._wallL.setSize(CFG.WALL_THICKNESS, this.H);
      }
      if (this._wallR) {
        this._wallR.tilePositionY = (this.cameraY || 0) * 0.8;
        this._wallR.setPosition(this.W - CFG.WALL_THICKNESS, 0);
        this._wallR.setSize(CFG.WALL_THICKNESS, this.H);
      }

      // Floor images — pool of Image objects matched to visible floors.
      // The step image is 256x64. We scale each to (floorWidth x 48px)
      // and position so the top ~20% (crystals) sits above the collision
      // line and the bottom ~80% (icicles) hangs below.
      const pool = this._floorPool;
      const viewTop = this.cameraY - 60;
      const viewBot = this.cameraY + this.H + 60;
      const VISUAL_H = 48;

      for (let i = 0; i < pool.length; i++) pool[i].setVisible(false);

      let idx = 0;
      for (let i = 0; i < this.floors.length; i++) {
        const f = this.floors[i];
        if (f.y < viewTop || f.y > viewBot) continue;
        if (f.n >= 100) continue;  // ice art only for floors 0-99

        if (idx >= pool.length) {
          const img = this.add.image(0, 0, "floor-ice")
            .setOrigin(0, 0.20)  // 20% from top = collision surface
            .setDepth(1);
          pool.push(img);
        }
        const img = pool[idx];
        img.setPosition(f.x, f.y);
        img.setDisplaySize(f.w, VISUAL_H);
        img.setVisible(true);
        idx++;
      }
    }

    // -----------------------------------------------------------
    // Ghost replay - record live positions, play back best run
    // -----------------------------------------------------------
    updateGhost() {
      const now = this.time.now - this.runStartTime;
      if (now - this.ghostRec.lastSampleAt >= CFG.GHOST_SAMPLE_MS) {
        this.ghostRec.lastSampleAt = now;
        const p = this.player;
        this.ghostRec.samples.push([Math.round(now), Math.round(p.x), Math.round(p.y), p.facing]);
      }
    }

    drawGhost() {
      const g = this.ghostGfx;
      g.clear();
      if (!this.ghostPlay) return;
      const s = this.ghostPlay.samples;
      const elapsed = this.time.now - this.ghostPlay.startTime;
      while (this.ghostPlay.index < s.length - 1 && s[this.ghostPlay.index + 1][0] <= elapsed) {
        this.ghostPlay.index++;
      }
      const i = this.ghostPlay.index;
      if (i >= s.length - 1) return;
      const a = s[i], b = s[i + 1];
      const span = Math.max(1, b[0] - a[0]);
      const t = Phaser.Math.Clamp((elapsed - a[0]) / span, 0, 1);
      const gx = a[1] + (b[1] - a[1]) * t;
      const gy = a[2] + (b[2] - a[2]) * t;
      if (gy < this.cameraY - 60 || gy > this.cameraY + this.H + 60) return;

      // Low-opacity silhouette (not a full character render, so it
      // never gets confused with the live player)
      const w = CFG.CHAR_W, h = CFG.CHAR_H;
      const bx = gx - w / 2, by = gy - h;
      g.fillStyle(0xffffff, 0.30);
      g.fillRect(bx, by + 4, w, h - 4);
      g.fillStyle(0x9cd9ff, 0.30);
      g.fillRect(bx, by + h * 0.30, w, h * 0.46);
    }

    maybeSaveGhost() {
      const prev = lsGetJSON(LS_KEYS.ghost, null);
      const prevScore = prev ? (prev.score || 0) : -1;
      if (this.score > prevScore) {
        lsSet(LS_KEYS.ghost, {
          samples: this.ghostRec.samples.slice(0, 2000),
          score: this.score,
          floor: this.player.highestFloor,
        });
      }
    }

    // -----------------------------------------------------------
    // Share
    // -----------------------------------------------------------
    shareScore() {
      const text = `I reached floor ${this.player.highestFloor} with a ${this.combo.longest}-combo in Frostspire!`;
      const toast = () => {
        if (!this.dom || !this.dom.shareToast) return;
        this.dom.shareToast.style.display = "block";
        setTimeout(() => { this.dom.shareToast.style.display = "none"; }, 1500);
      };
      const fallback = () => {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (_) { return false; }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(toast, () => { if (fallback()) toast(); });
      } else if (fallback()) {
        toast();
      }
      if (navigator.share) {
        try { navigator.share({ text, title: "Frostspire" }).catch(() => {}); } catch (_) {}
      }
    }

    update(_t, delta) {
      const dt = Math.min(delta / 1000, 1 / 30);

      // Non-playing states still render the last frame so the world
      // sits behind the DOM overlay rather than showing a blank canvas.
      if (this.state === "title" || this.state === "paused" ||
          this.state === "countdown" || this.gameOver) {
        this.drawBackground();
        this.drawWalls();
        this.drawFloors();
        this._updateArtSprites();
        this.drawGhost();
        this.drawParticles();
        this.drawPlayer();
        if (!this.gameOver) this.drawHUD();
        return;
      }

      this.readInput();
      this.updatePhysics(dt);
      this.updateCombo(dt);
      this.updateParticles(dt);
      this.updateGhost();
      this.updateCamera(dt);
      this.drawBackground();
      this.drawWalls();
      this.drawFloors();
      this._updateArtSprites();
      this.drawGhost();
      this.drawParticles();
      this.drawPlayer();
      this.drawHUD();
      this.tickHurryUp();
      this.checkGameOver();
    }
  }

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#05080f",
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: window.innerWidth,
      height: window.innerHeight,
    },
    render: { pixelArt: true, antialias: false, roundPixels: true },
    scene: [GameScene],
  });
  </script>
</body>
</html>
